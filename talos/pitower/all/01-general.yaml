# Talos 1.14 multi-document config. The v1alpha1 `machine.*` / `cluster.*`
# fields these replace are rejected when the matching document exists, and
# `talosctl gen config` (called by topf) emits most documents by default.
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  rotate-server-certificates: true
config:
  # These thresholds are a PERCENTAGE of the filesystem, so a bigger disk
  # means a bigger cache: 60% of worker-07's 997Gi is a 598Gi high-water
  # mark it had never reached, so image GC had simply never run there. It
  # sat at 322Gi of imageFs while referencing only ~57Gi of images - the
  # rest was unreferenced garbage.
  imageGCHighThresholdPercent: 60
  imageGCLowThresholdPercent: 50
  # Age-based eviction is the actual fix: it bounds the cache by how long an
  # image has gone unused rather than by disk size, so it behaves the same
  # on the 112Gi Pis and on worker-07's 1000G disk. The percentage
  # thresholds above stay as a backstop for sudden fill.
  #
  # Note a kubelet restart resets tracked image age, so after any node
  # reboot the full week must elapse again before anything qualifies.
  imageMaximumGCAge: 168h
# /var/mnt/extra (openebs-hostpath basePath) used to be a kubelet extraMount.
# 1.14 dropped extraMounts; /var/mnt is bind-mounted into the kubelet by
# default, which is also how Sidero documents local-path provisioners now.
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: home-ops
content: |-
  [plugins]
    [plugins."io.containerd.grpc.v1.cri"]
      enable_unprivileged_ports = true
      enable_unprivileged_icmp = true
  [plugins."io.containerd.cri.v1.images"]
    # Drop the compressed layer blobs once unpacked. Keeping both roughly
    # doubles image storage, and was a large share of the 322Gi of imageFs
    # worker-07 had accumulated against only ~57Gi of referenced images.
    # The cost is a full re-download on a re-pull instead of a local
    # unpack. Changing this forces a REBOOT on every node - roll them one
    # at a time.
    discard_unpacked_layers = true
  [plugins."io.containerd.cri.v1.runtime"]
    device_ownership_from_security_context = true
---
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
  forwardKubeDNSToHost: false
  resolveMemberNames: true
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.ipv6.conf.all.forwarding: "1"
# Workload isolation (sandboxd) moves kubelet and pods into their own PID/mount
# namespace. Nodes upgraded in place keep the old behaviour; only regenerated
# config flips it on. Opt out until the host-reaching workloads (NVIDIA CDI,
# openebs hostpath, tetragon, node-exporter, ceph) are verified against it.
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: false
