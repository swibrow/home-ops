---
# 1200GiB scsi3 disk on proxmox-01's `media` zpool (4x 600GB 10K SAS, RAIDZ1,
# bays 4-7) - the Immich photo library. Unlike scratch and runners this holds
# real data: RAIDZ1 survives one disk, but bay 7 is a 2011 drive with
# uncorrected reads, so treat the redundancy as thin and keep the off-host copy
# current.
#
# Size-band selector, and the bands are the whole reason disk sizes are chosen
# the way they are: 300-400GiB is `runners`, 400-500GiB is `scratch`,
# 1000GiB is the system disk, 1100-1300GiB is this volume.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: media
provisioning:
  diskSelector:
    match: disk.size > 1100u * GiB && disk.size < 1300u * GiB
  minSize: 1100GiB
  grow: true
filesystem:
  type: xfs
