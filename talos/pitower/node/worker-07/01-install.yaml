---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  wibrow.dev/compute: "true"
# 1000GiB scsi0 system disk. sdb/sdc are the `extra` and `media` user volumes
# (02-extra.yaml, 04-media.yaml), selected by size band there.
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
# /var/mnt/media used to be a kubelet extraMount on top of the user volume so
# openebs-hostpath-media could hand pods hostPaths under it. 1.14 removed
# extraMounts; user volumes under /var/mnt are visible to the kubelet directly.
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  maxPods: 250
