---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  wibrow.dev/compute: "true"
# Bare-metal Dell R630 (ex proxmox-01). Six 745GiB SAS SSDs and four 559GiB
# 10K SAS HDDs behind the PERC in HBA mode. One SSD is the system disk; the
# other five are the ZFS pool `fast` and the HDDs the existing `garage` raidz1,
# both imported by the zfs extension. Their datasets mount under /var/mnt
# (extra, media, garage), which the kubelet sees without extraMounts - so
# there are no UserVolumeConfigs here. Pool layout and datasets are in
# docs/infrastructure/proxmox-01-migration.md.
#
# Serial, not dev_path: sdX enumeration order is not stable across the ten
# disks.
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.serial == "V6X00TXA"
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  maxPods: 250
---
# The zfs extension ships the module but does not load it. ARC is invisible to
# kubelet memory accounting, so it is capped (64GiB of 755GiB) rather than left
# to take half the machine.
apiVersion: v1alpha1
kind: KernelModuleConfig
name: zfs
parameters:
  - zfs_arc_max=68719476736
