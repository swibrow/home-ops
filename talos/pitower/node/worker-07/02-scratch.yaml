---
# 450GiB scsi1 disk, a zvol on proxmox-01's rpool (6x 800GB SAS SSD, 3 mirrors,
# sync=standard). The standalone `scratch` zpool it used to live on is gone, so
# the old "rebuildable data only" caveat no longer applies - this is mirrored
# enterprise flash with PLP. Size-range selector: the only other disk in this
# band is the 1000GiB system disk.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: scratch
provisioning:
  diskSelector:
    match: disk.size > 400u * GiB && disk.size < 500u * GiB
  minSize: 400GiB
  grow: true
filesystem:
  type: xfs
