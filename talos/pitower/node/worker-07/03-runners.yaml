---
# 350GiB scsi2 disk on proxmox-01's `runners` zpool (single 500GB Samsung 850
# EVO, bay 9) - GitHub Actions runner scratch only: per-job work dirs and
# dind's /var/lib/docker. The pool is sync=disabled on a consumer SSD with no
# PLP and no redundancy, so nothing that must survive a power cut belongs here.
#
# Size-band selector, and the bands are why the disk sizes are what they are:
# 300-400GiB is this volume, 400-500GiB is `scratch`, 1000GiB is the system
# disk, 1100-1300GiB is `media`.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: runners
provisioning:
  diskSelector:
    match: disk.size > 300u * GiB && disk.size < 400u * GiB
  minSize: 300GiB
  grow: true
filesystem:
  type: xfs
