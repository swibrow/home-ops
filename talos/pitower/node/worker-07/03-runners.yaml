---
# 350GiB scsi2 disk, a zvol on proxmox-01's rpool (6x 800GB SAS SSD, 3 mirrors,
# sync=standard) - GitHub Actions runner scratch only: per-job work dirs and
# dind's /var/lib/docker. The standalone `runners` zpool it used to live on is
# gone, along with its sync=disabled/no-PLP power-cut caveat.
#
# Size-band selector, and the bands are why the disk sizes are what they are:
# 300-400GiB is this volume, 400-500GiB is `scratch`, 1000GiB is the system
# disk. The 1100-1300GiB `media` band is retired - that pool is dissolved.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: runners
provisioning:
  diskSelector:
    match: disk.size > 300u * GiB && disk.size < 400u * GiB
  minSize: 300GiB
  grow: true
filesystem:
  type: xfs
