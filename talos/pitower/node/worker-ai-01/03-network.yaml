---
# The board's second NIC (eno2) is unused. If it is cabled, Talos DHCPs on it and
# its default route shadows VLAN 20's (same metric), so the node can't reach the
# image factory. Talos only uses eno1.20.
machine:
  network:
    interfaces:
      - deviceSelector:
          physical: true
          hardwareAddr: b0:82:e2:a2:df:34
        ignore: true
