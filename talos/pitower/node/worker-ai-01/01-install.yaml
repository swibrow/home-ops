---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  feature.node.kubernetes.io/nvidia-gpu: "true"
# Bare metal, dual-booted with Bazzite. Two NVMe drives: the 1TB Kingston NV3
# (Gen4) is the system disk, shared with Bazzite, and the 2TB Samsung 9100 Pro
# is the `models` volume (02-models.yaml). Size is the only reliable way to tell
# them apart - nvme0n1/nvme1n1 enumeration order isn't guaranteed.
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.transport == "nvme" && disk.size <= 1500u * GB
---
# Capped so the rest of the Kingston stays unpartitioned for Bazzite. Only
# honored when EPHEMERAL is first provisioned. Model weights live on the models
# volume, so this only holds images, logs and emptyDirs.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 200GiB
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_uvm
---
# fbdev=0: the nvidia-drm framebuffer console holds the GPU, so the DRA driver's
# unbind to vfio-pci for omarchy hits "non-zero usage count" and wedges the node.
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_drm
parameters:
  - fbdev=0
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_modeset
---
# For the DRA driver's PassthroughSupport, which rebinds the GPU from nvidia to
# vfio-pci when a KubeVirt VM claims it. The GPU function itself is not in ids=:
# it stays on nvidia until a vfio.gpu.nvidia.com claim asks for it. Its HDMI
# audio function (10de:1aef) and the Exsys ASM2142 USB card (1b21:2142, the
# omarchy keyboard and mouse) are bound here for KubeVirt to pass to omarchy.
# xhci_pci also claims the USB card, so vfio_pci must win the module load race.
apiVersion: v1alpha1
kind: KernelModuleConfig
name: vfio_pci
parameters:
  - ids=10de:1aef,1b21:2142
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: vfio_iommu_type1
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  registerWithTaints:
    - key: dedicated
      value: gpu
      effect: NoSchedule
