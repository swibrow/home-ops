---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  feature.node.kubernetes.io/nvidia-gpu: "true"
# VM 300 on proxmox-02 (terraform/proxmox/vm_worker_ai_01.tf): scsi0 is the
# 250GiB system disk on local-lvm, scsi1 the `models` volume (02-models.yaml).
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_uvm
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_drm
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_modeset
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  registerWithTaints:
    - key: dedicated
      value: gpu
      effect: NoSchedule
