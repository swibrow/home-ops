---
# LLM model weights: the whole 2TB Samsung 9100 Pro, selected by size to
# exclude the 1TB system disk. Mounted at /var/mnt/models - backs the
# openebs-hostpath-models StorageClass (kubernetes/apps/pitower/openebs).
apiVersion: v1alpha1
kind: UserVolumeConfig
name: models
provisioning:
  diskSelector:
    match: 'disk.size > 1500u * GiB'
  minSize: 1500GiB
  grow: true
filesystem:
  type: xfs
  projectQuotaSupport: true
