---
# LLM model weights: 600GiB scsi1 disk on proxmox-02's `nvme` pool (the Samsung
# 9100 Pro). Mounted at /var/mnt/models - backs the openebs-hostpath-models
# StorageClass (kubernetes/apps/pitower/openebs). The size band is coupled to
# worker_ai.models_disk in terraform/proxmox/variables.tf.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: models
provisioning:
  diskSelector:
    match: '!system_disk && disk.size > 500u * GiB && disk.size < 700u * GiB'
  minSize: 500GiB
  grow: true
filesystem:
  type: xfs
  projectQuotaSupport: true
