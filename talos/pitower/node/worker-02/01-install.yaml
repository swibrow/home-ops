---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  feature.node.kubernetes.io/amd-gpu: "true"
# The NVMe boot disk; a second SATA SSD in these boxes is the ceph OSD.
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.model.startsWith("AirDisk")
