---
- name: ovh-vps node (fail2ban + oha + towonel-hub + crowdsec-firewall-bouncer + blackbox + otel-agent)
  hosts: ovh_vps
  become: true
  roles:
    - fail2ban
    - oha
    - towonel-hub
    # After towonel-hub: it pulls decisions through the tunnel that role serves.
    - crowdsec-firewall-bouncer
    # Before otel-agent: the agent scrapes this exporter over loopback, so it
    # should exist before the agent is configured to poll it.
    - blackbox-exporter
    - otel-agent
