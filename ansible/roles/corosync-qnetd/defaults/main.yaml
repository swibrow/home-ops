---
# Root SSH public keys of the PVE cluster nodes. `pvecm qdevice setup` (and
# `qdevice remove`) run from a cluster node as root: ssh-copy-id, then
# BatchMode ssh/scp as root to exchange the qnetd certificates. sshd here only
# allows key auth for root, so without these the setup cannot log in.
# Add proxmox-02's /root/.ssh/id_rsa.pub once that host is installed.
corosync_qnetd_cluster_node_keys:
  - ssh-rsa  root@proxmox-01
