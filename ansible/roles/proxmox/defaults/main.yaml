---
proxmox_disable_enterprise_repo: true
proxmox_enable_no_subscription_repo: true

# Opt-in: needs `cloudflare_api_token` in group_vars and a public A record for
# proxmox_acme_domain. Let's Encrypt cannot issue for .servers.local, so the
# host needs a name in a real zone pointing at its VLAN-20 address.
proxmox_acme_enabled: false
proxmox_acme_domain: proxmox-01.wibrow.dev
proxmox_acme_account: default
proxmox_acme_email: sam.wibrow.wa@gmail.com
proxmox_acme_plugin: cloudflare
proxmox_acme_directory: https://acme-v02.api.letsencrypt.org/directory

# ZFS pools created on the host and added as Proxmox zfspool storage. Disks
# pinned by serial; creation only runs when the pool is absent, so changing
# options here does NOT alter an existing pool - and neither `blocksize` nor any
# other storage option is re-applied to a storage that already exists.
#
# EMPTY ON PURPOSE, and entries are deleted rather than commented out. Creation
# is create-if-absent, so a leftover entry does not sit inert - the next role run
# rebuilds that pool on the disks it names. Three pools came out this way:
#
# - `media` (2026-08-13): RAIDZ1 over four 600GB spinners in bays 4-7. The photo
#   library moved to the NAS and the bays went to the SAS SSDs.
# - `scratch` + `runners` (2026-08-13): single consumer SATA SSDs in bays 8-9,
#   no redundancy, no PLP, holding worker-07's TSDB PVCs and GitHub runner work
#   dirs. They existed only to keep write-heavy churn off a spinning rpool. Both
#   zvols were moved onto rpool with `qm move-disk` and the bays freed for the
#   garage raidz1. Re-adding either entry would recreate a pool on disks that
#   are no longer in the chassis.
#
# The six SAS SSDs get no entry either: they ARE rpool, and rpool is not
# role-managed. PVE keeps boot and guest data in one pool (`local-zfs` IS
# `rpool/data`), so they were folded in with `zpool replace` per member rather
# than made into a separate pool.
#
# `garage` is the bulk/capacity tier: RAIDZ1 over four Toshiba AL13SEB600 10K
# SAS in bays 6-9. 2.17T raw, 1.53T usable - noticeably under the 1.64T that
# 3/4-of-raw predicts, because the ZFS slop reserve takes the rest.
#
# recordsize 1M suits S3 object data (it is a ceiling, not a fixed allocation,
# so small objects are not padded). ashift 12 even though these report 512/512
# native: it costs a little on small blocks and keeps the door open to 4Kn
# replacements. No autotrim - spinners.
#
# Content is `rootdir` ONLY, deliberately narrower than the role default of
# `images`: this pool exists for garage's S3 data via an LXC mountpoint, and
# allowing `images` would invite a stray VM disk onto spinning rust that the
# whole 2026-08 rebuild was about getting off.
#
# The four disks are all ~77,800 power-on hours (8.9y) with 0 uncorrected
# errors. `scsi-350000395982acc68` (bay 8) has 1 grown defect where the others
# have 0 - it is the one to watch. A fifth AL13SEB600, 64N0A0D1FRD3
# (`scsi-350000395982ac534`), is out of chassis as a cold spare. RAIDZ1
# survives exactly one failure; keep it that way.
proxmox_zfs_pools:
  - name: garage
    content: rootdir
    vdev_type: raidz1
    disks:
      - /dev/disk/by-id/scsi-350000395982aca50 # 64O0A00ZFRD3, bay 6
      - /dev/disk/by-id/scsi-350000395982acb7c # 64O0A018FRD3, bay 7
      - /dev/disk/by-id/scsi-350000395982acc68 # 64O0A01EFRD3, bay 8, 1 grown defect
      - /dev/disk/by-id/scsi-350000395982aca04 # 64O0A00UFRD3, bay 9
    pool_options:
      ashift: "12"
    fs_options:
      compression: lz4
      atime: "off"
      recordsize: 1M

# `proxmox_zfs_volume_properties` and the task that consumed it were removed on
# 2026-08-13. Both existed for a single override, `sync: disabled` on
# rpool/data/vm-200-disk-1, which bought worker-07 11.26ms -> 2.67ms writes while
# rpool was four 10K spinners with no SLOG - at the cost of losing up to one txg
# (~5s) of acknowledged writes on host power loss. rpool is now six enterprise
# SAS SSDs with power-loss protection, so a real fsync is cheap and there is
# nothing left to trade crash consistency for. Re-add the loop if a host-side
# zvol property is ever needed again; it is not expressible in terraform.

# Host management stays on the 1G nic1 trunk (vmbr0/vmbr1). VM/CT guest
# traffic gets its own bridge on the 10G nic6 port, tagged VLAN20 the same way
# as nic1.20 -> vmbr0 - the far-end switch port for nic6 is trunked to match.
proxmox_network_iface: nic1
proxmox_network_vlan: 20
proxmox_network_bridge: vmbr0
proxmox_network_untagged_bridge: vmbr1
proxmox_network_vm_iface: nic6
proxmox_network_vm_bridge: vmbr2
proxmox_network_unused_ifaces:
  - nic0
  - nic2
  - nic3
  - nic4
  - nic5
