---
proxmox_disable_enterprise_repo: true
proxmox_enable_no_subscription_repo: true

# Opt-in: needs `cloudflare_api_token` in group_vars and a public A record for
# proxmox_acme_domain. Let's Encrypt cannot issue for .servers.local, so the
# host needs a name in a real zone pointing at its VLAN-20 address.
proxmox_acme_enabled: false
proxmox_acme_domain: proxmox-01.wibrow.dev
proxmox_acme_account: default
proxmox_acme_email: sam.wibrow.wa@gmail.com
proxmox_acme_plugin: cloudflare
proxmox_acme_directory: https://acme-v02.api.letsencrypt.org/directory

# ZFS pools created on the host and added as Proxmox zfspool storage. Disks
# pinned by serial; creation only runs when the pool is absent, so changing
# options here does NOT alter an existing pool - and neither `blocksize` nor any
# other storage option is re-applied to a storage that already exists.
#
# `scratch` and `runners` hold rebuildable data only (no redundancy, consumer
# SSDs without PLP). The `media` RAIDZ1 pool that used to sit here was dissolved
# on 2026-08-13: the photo library moved to the NAS and its four 600GB spinners
# in bays 4-7 make way for the SAS SSDs. Its entry is removed rather than
# commented out on purpose - creation is create-if-absent, so leaving it would
# let the next role run silently rebuild the pool on those disks.
# - scratch: single 500GB SanDisk in bay 8; write-heavy TSDB PVCs of worker-07.
# - runners: single 500GB Samsung 850 EVO in bay 9; GitHub runner dind/work
#   scratch. Replaces the 4x Samsung 830 128GB stripe (bays 4-7) destroyed on
#   2026-08-07. sync=disabled at pool level: nothing on it needs to survive a
#   crash, runner pods just respawn.
#
# A second EVO was planned for this pool but is not seated. Adding it later is
# `zpool add runners <by-id>` by hand - creation here is create-if-absent and
# will not widen an existing pool.
proxmox_zfs_pools:
  - name: scratch
    disks:
      - /dev/disk/by-id/ata-SanDisk_SD7SB2Q512G1001_153141400183
    pool_options:
      ashift: "12"
      autotrim: "on"
    fs_options:
      compression: lz4
      atime: "off"
  - name: runners
    disks:
      - /dev/disk/by-id/ata-Samsung_SSD_850_EVO_500GB_S21JNSAG160704R
    pool_options:
      ashift: "12"
      autotrim: "on"
    fs_options:
      compression: lz4
      atime: "off"
      sync: disabled

# ZFS dataset properties applied to guest zvols. rpool is 4x 600GB 10K SAS
# spinning (2 mirror vdevs since 2026-08-06, no SLOG), so sync writes cost a
# seek. Measured on
# vm-200 (worker-07): 21-33 MB/s of ZIL traffic and 27-103 zil_commit/s were
# driving 90-127 MB/s of physical spindle writes against a guest writing only
# 12-16 MB/s. sync=disabled dropped that to 6.3 MB/s and took guest write
# latency 11.26ms -> 2.67ms, because WAL rewrites of the same blocks now
# coalesce in ARC within the txg instead of each being forced out.
#
# The trade: the guest loses up to one txg (~5s) of acknowledged writes on host
# power loss. Accepted here - the node's local disk holds TSDBs (prometheus,
# victoria-metrics, victoria-logs, tempo) which just re-scrape, plus media that
# kopiur backs up. The ceph mons that used to make this unsafe now live on
# worker-01/02/03. Postgres is the one workload this is wrong for.
#
# NOT expressible in terraform: Proxmox has no per-VM setting for it, it is a
# host-side ZFS dataset property. Also note a zvol recreated by terraform comes
# back as sync=standard, silently restoring the 11ms - rerun this playbook after
# any VM disk recreate.
proxmox_zfs_volume_properties:
  - dataset: rpool/data/vm-200-disk-1
    properties:
      sync: disabled

# Host management stays on the 1G nic1 trunk (vmbr0/vmbr1). VM/CT guest
# traffic gets its own bridge on the 10G nic6 port, tagged VLAN20 the same way
# as nic1.20 -> vmbr0 - the far-end switch port for nic6 is trunked to match.
proxmox_network_iface: nic1
proxmox_network_vlan: 20
proxmox_network_bridge: vmbr0
proxmox_network_untagged_bridge: vmbr1
proxmox_network_vm_iface: nic6
proxmox_network_vm_bridge: vmbr2
proxmox_network_unused_ifaces:
  - nic0
  - nic2
  - nic3
  - nic4
  - nic5
