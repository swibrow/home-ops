# Hookscripts must live on a storage with `snippets` content. storage.cfg is
# cluster-wide, so this also enables it for proxmox-01's `local`.
- name: Read local storage content types
  ansible.builtin.command: pvesh get /storage/local --output-format json
  register: proxmox_local_storage
  changed_when: false
  check_mode: false

- name: Allow snippets on local storage
  vars:
    content: "{{ (proxmox_local_storage.stdout | from_json).content.split(',') }}"
  ansible.builtin.command: pvesm set local --content {{ (content + ['snippets']) | join(',') }}
  when: "'snippets' not in content"

- name: Install the GPU exclusivity hookscript
  ansible.builtin.template:
    src: gpu-exclusive.sh.j2
    dest: /var/lib/vz/snippets/gpu-exclusive.sh
    owner: root
    group: root
    mode: "0755"

# Not in terraform: PVE refuses `hookscript` from an API token ("only root can
# set 'hookscript' config"), so it is attached here as root on the host.
- name: Read the GPU VMs' hookscripts
  ansible.builtin.command: qm config {{ item }}
  loop:
    - "{{ proxmox_gpu_exclusive.ai_vmid }}"
    - "{{ proxmox_gpu_exclusive.gaming_vmid }}"
  register: proxmox_gpu_vm_config
  changed_when: false
  check_mode: false

- name: Attach the hookscript to the GPU VMs
  ansible.builtin.command: qm set {{ item.item }} --hookscript local:snippets/gpu-exclusive.sh
  loop: "{{ proxmox_gpu_vm_config.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'hookscript: local:snippets/gpu-exclusive.sh' not in item.stdout_lines"
