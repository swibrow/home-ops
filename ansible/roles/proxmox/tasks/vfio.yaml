---
# Bind proxmox_vfio_pci_ids to vfio-pci at boot, before any host driver can
# claim them. Only takes effect after a reboot.
- name: Load vfio modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/vfio.conf
    content: |
      vfio
      vfio_iommu_type1
      vfio_pci
    owner: root
    group: root
    mode: "0644"
  notify: Update initramfs

# softdep makes vfio-pci load first, so it claims the listed IDs before the GPU
# (nouveau, nvidiafb, nova_core) or HDMI audio (snd_hda_intel) drivers probe.
- name: Bind passthrough devices to vfio-pci
  ansible.builtin.copy:
    dest: /etc/modprobe.d/vfio.conf
    content: |
      options vfio-pci ids={{ proxmox_vfio_pci_ids | join(',') }}
      softdep nouveau pre: vfio-pci
      softdep nvidiafb pre: vfio-pci
      softdep nova_core pre: vfio-pci
      softdep snd_hda_intel pre: vfio-pci
    owner: root
    group: root
    mode: "0644"
  notify: Update initramfs
