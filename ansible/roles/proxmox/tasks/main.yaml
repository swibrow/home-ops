---
# PVE 9 / trixie ships enterprise repos as deb822 .sources files; the legacy
# .list neutralization is kept for the stray pve-enterprise.list on the host.
- name: Disable Proxmox enterprise repos
  ansible.builtin.copy:
    dest: "/etc/apt/sources.list.d/{{ item.file }}"
    content: |
      # managed by ansible - enterprise repo disabled (no subscription)
      Enabled: no
      Types: deb
      URIs: {{ item.uri }}
      Suites: {{ ansible_distribution_release }}
      Components: {{ item.component }}
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  loop:
    - file: pve-enterprise.sources
      uri: https://enterprise.proxmox.com/debian/pve
      component: pve-enterprise
    - file: ceph.sources
      uri: https://enterprise.proxmox.com/debian/ceph-squid
      component: enterprise
  when: proxmox_disable_enterprise_repo
  register: pve_enterprise_repo

- name: Neutralize legacy enterprise .list
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-enterprise.list
    content: "# managed by ansible - enterprise repo disabled (no subscription)\n"
    owner: root
    group: root
    mode: "0644"
  when: proxmox_disable_enterprise_repo
  register: pve_enterprise_repo_legacy

- name: Enable Proxmox no-subscription repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.sources
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_distribution_release }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  when: proxmox_enable_no_subscription_repo
  register: pve_no_subscription_repo

- name: Remove stale no-subscription .list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-no-subscription.list
    state: absent
  when: proxmox_enable_no_subscription_repo

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  when: pve_enterprise_repo.changed or pve_enterprise_repo_legacy.changed or pve_no_subscription_repo.changed

# pve-cluster resolves the node name through /etc/hosts, and `pvecm create` /
# `pvecm add` bind corosync to that address for good - it cannot be changed
# once the node is in a cluster.
- name: Resolve the node name to its reserved VLAN 20 address
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ inventory_hostname }}\.internal\b'
    line: "{{ proxmox_node_ip }} {{ inventory_hostname }}.internal {{ inventory_hostname }}"

- name: Provision ZFS pools and Proxmox storage
  ansible.builtin.include_tasks: zfs-pools.yaml

- name: Configure Let's Encrypt for the web UI
  ansible.builtin.include_tasks: acme.yaml
  when: proxmox_acme_enabled
