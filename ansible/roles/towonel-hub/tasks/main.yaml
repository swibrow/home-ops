---
- name: Load SOPS-encrypted towonel-hub key material
  community.sops.load_vars:
    file: "{{ role_path }}/vars/secrets.sops.yaml"

- name: Check if towonel-data docker volume exists
  ansible.builtin.command: docker volume inspect {{ towonel_hub_volume }}
  register: towonel_hub_volume_check
  changed_when: false
  failed_when: false

- name: Create towonel-data docker volume
  ansible.builtin.command: docker volume create {{ towonel_hub_volume }}
  when: towonel_hub_volume_check.rc != 0

- name: Ensure towonel-hub data directory is owned by the container's non-root user
  ansible.builtin.file:
    path: "{{ towonel_hub_data_dir }}"
    state: directory
    owner: "{{ towonel_hub_uid }}"
    group: "{{ towonel_hub_gid }}"
    mode: "0755"

# force: false so an already-seeded volume (or a live one) is never overwritten —
# this key material must not be regenerated, it identifies the tenant and every
# invite issued against it.
- name: Seed towonel-hub key material (never overwrites existing keys)
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "{{ towonel_hub_data_dir }}/{{ item.name }}"
    owner: "{{ towonel_hub_uid }}"
    group: "{{ towonel_hub_gid }}"
    mode: "0600"
    force: false
  loop:
    - { name: node.key, content: "{{ towonel_hub_node_key }}" }
    - { name: hub_kek.key, content: "{{ towonel_hub_kek_key }}" }
    - { name: invite_hash.key, content: "{{ towonel_hub_invite_hash_key }}" }
    - { name: operator.key, content: "{{ towonel_hub_operator_key }}" }
  no_log: true

- name: Ensure towonel config directory exists
  ansible.builtin.file:
    path: "{{ towonel_hub_caddyfile_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# SNI-routes :443 between the hub's own Caddy-terminated TLS (towonel_hub_domain)
# and the edge's raw passthrough (everything else) -- see README.md.
- name: Install Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ towonel_hub_caddyfile_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart towonel-hub

- name: Install towonel-hub systemd unit
  ansible.builtin.template:
    src: towonel-hub.service.j2
    dest: /etc/systemd/system/towonel-hub.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart towonel-hub

- name: Ensure towonel-hub is enabled and running
  ansible.builtin.systemd_service:
    name: towonel-hub
    daemon_reload: true
    enabled: true
    state: started

# Creating an invite stays manual: the token it prints has to reach Infisical by
# hand. This only reconciles the hostname patterns on an invite that exists.
# Granting a new pattern does not reach a running agent -- it publishes TLS policy
# at session start only, so follow this with
# `kubectl -n networking rollout restart deploy/towonel-agent`.
- name: Reconcile the invite hostname allowlist
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail

      hub() {
        docker exec -e TOWONEL_HUB_OPERATOR_API_KEY_PATH=/data/operator.key \
          {{ towonel_hub_container_name }} towonel "$@"
      }
      granted() {
        hub invite get --id "$1" \
          | sed -n 's/^[[:space:]]*Hostnames:[[:space:]]*//p' \
          | tr -d '[:space:]' | tr ',' '\n' | sed '/^$/d' | sort -u
      }

      id=$(hub invite list | awk '$2 == "{{ towonel_hub_invite_name }}" { print $1 }')
      if [[ -z "$id" ]]; then
        echo "no invite named {{ towonel_hub_invite_name }} on this hub" >&2
        exit 1
      fi

      desired=$(printf '%s\n' {{ towonel_hub_invite_hostnames | map('quote') | join(' ') }} | sort -u)
      current=$(granted "$id")
      missing=$(comm -23 <(echo "$desired") <(echo "$current"))
      extra=$(comm -13 <(echo "$desired") <(echo "$current"))
      if [[ -z "$missing$extra" ]]; then
        exit 0
      fi

      # add-hostnames can answer 409 hostname_conflict and still apply the change,
      # so its exit status proves nothing either way -- the re-read below decides.
      if [[ -n "$missing" ]]; then
        hub invite add-hostnames --id "$id" --hostnames "$(echo "$missing" | paste -sd,)" || true
      fi
      while read -r pattern; do
        [[ -n "$pattern" ]] && hub invite remove-hostname --id "$id" --hostname "$pattern"
      done <<< "$extra"

      if [[ -n "$(comm -3 <(echo "$desired") <(granted "$id"))" ]]; then
        echo "allowlist still differs from config after reconcile" >&2
        exit 1
      fi
      echo CHANGED
  register: towonel_hub_allowlist
  changed_when: "'CHANGED' in towonel_hub_allowlist.stdout"
