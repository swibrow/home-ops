---
- name: Determine blackbox_exporter release arch
  ansible.builtin.set_fact:
    blackbox_exporter_release_arch: "{{ blackbox_exporter_arch_map[ansible_facts['architecture']] }}"

- name: Create blackbox group
  ansible.builtin.group:
    name: "{{ blackbox_exporter_group }}"
    system: true

- name: Create blackbox user
  ansible.builtin.user:
    name: "{{ blackbox_exporter_user }}"
    group: "{{ blackbox_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download blackbox_exporter {{ blackbox_exporter_version }}
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_version }}/blackbox_exporter-{{ blackbox_exporter_version }}.linux-{{ blackbox_exporter_release_arch }}.tar.gz
    dest: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-{{ blackbox_exporter_release_arch }}.tar.gz"
    checksum: "{{ blackbox_exporter_checksums[blackbox_exporter_release_arch] }}"
    mode: "0644"

- name: Install blackbox_exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-{{ blackbox_exporter_release_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    # The tarball nests the binary under a versioned directory; extra-opts
    # strips it so the path stays stable across upgrades.
    include:
      - "blackbox_exporter-{{ blackbox_exporter_version }}.linux-{{ blackbox_exporter_release_arch }}/blackbox_exporter"
    extra_opts:
      - --strip-components=1
    owner: root
    group: root
    mode: "0755"
  notify: Restart blackbox-exporter

- name: Ensure blackbox_exporter config directory exists
  ansible.builtin.file:
    path: "{{ blackbox_exporter_config_dir }}"
    state: directory
    owner: root
    group: "{{ blackbox_exporter_group }}"
    mode: "0750"

- name: Install blackbox_exporter config
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ blackbox_exporter_config_path }}"
    owner: root
    group: "{{ blackbox_exporter_group }}"
    mode: "0640"
  notify: Restart blackbox-exporter

- name: Install blackbox-exporter systemd unit
  ansible.builtin.template:
    src: blackbox-exporter.service.j2
    dest: /etc/systemd/system/blackbox-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart blackbox-exporter

- name: Ensure blackbox-exporter is enabled and running
  ansible.builtin.systemd_service:
    name: blackbox-exporter
    daemon_reload: true
    enabled: true
    state: started
