alias: Stairs LED - Set Section
description: |
  Turn one floor section of the stairs LED on, off or toggle it, then repaint the whole strip from the section helpers. The strip does not report per-segment state, so the input_booleans are the source of truth.
mode: queued
fields:
  section:
    name: Section
    required: true
    selector:
      select:
        options:
          - basement
          - first_floor
          - attic
  to:
    name: State
    default: toggle
    selector:
      select:
        options:
          - 'on'
          - 'off'
          - toggle
  brightness:
    name: Brightness
    description: Strip brightness when turning on. Turning off keeps the current brightness.
    selector:
      number:
        min: 1
        max: 100
        unit_of_measurement: '%'
sequence:
  - variables:
      strip: light.0x54ef4410010f08d5
      warm:
        - 255
        - 167
        - 87
      sections:
        basement:
          start: 1
          count: 13
        first_floor:
          start: 14
          count: 13
        attic:
          start: 27
          count: 8
      helper: input_boolean.stairs_led_{{ section }}
      lit: '{{ not is_state(strip, ''off'') and is_state(helper, ''on'') }}'
      target_state: '{{ to | default(''toggle'') }}'
      turn_on: '{{ target_state == ''on'' or (target_state == ''toggle'' and not lit) }}'
      level: '{{ [1, (brightness | float * 2.55) | round | int] | max if brightness is defined else (255 if turn_on else none)
        }}'
  - if: '{{ turn_on and is_state(strip, ''off'') }}'
    then:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.stairs_led_basement
            - input_boolean.stairs_led_first_floor
            - input_boolean.stairs_led_attic
      - action: light.turn_on
        target:
          entity_id: '{{ strip }}'
        data:
          brightness: '{{ level }}'
      - delay:
          milliseconds: 500
  - action: input_boolean.turn_{{ 'on' if turn_on else 'off' }}
    target:
      entity_id: '{{ helper }}'
  - if: '{{ sections | map(''regex_replace'', ''^'', ''input_boolean.stairs_led_'') | select(''is_state'', ''on'') | list
      | count == 0 }}'
    then:
      - action: light.turn_off
        target:
          entity_id: '{{ strip }}'
    else:
      - if: '{{ level is not none and state_attr(strip, ''brightness'') != level }}'
        then:
          - action: light.turn_on
            target:
              entity_id: '{{ strip }}'
            data:
              brightness: '{{ level }}'
          - delay:
              milliseconds: 500
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/{{ device_attr(device_id(strip), 'name') }}/set
          payload: '{"segment_brightness": 100}'
      - delay:
          milliseconds: 100
      - action: mqtt.publish
        data:
          topic: zigbee2mqtt/{{ device_attr(device_id(strip), 'name') }}/set
          payload: '{% set ns = namespace(segs=[]) %} {% for i in range(1, (states(''number.0x54ef4410010f08d5_length'') |
            float(7) * 5) | int + 1) %} {% set ns.c = [0, 0, 0] %} {% for name, s in sections.items() if s.start <= i < s.start
            + s.count and is_state(''input_boolean.stairs_led_'' ~ name, ''on'') %} {% set ns.c = warm %} {% endfor %} {%
            set ns.segs = ns.segs + [{''segment'': i, ''color'': {''r'': ns.c[0], ''g'': ns.c[1], ''b'': ns.c[2]}}] %} {%
            endfor %} {{ {''segment_colors'': ns.segs} | to_json }}'
