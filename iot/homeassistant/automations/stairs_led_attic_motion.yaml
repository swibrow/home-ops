id: stairs_led_attic_motion
alias: Stairs LED - Attic Motion
description: Light the attic section while there is motion on the top stairs. Skips when the section is already lit so the
  clear does not blank a section it did not turn on.
triggers:
  - trigger: state
    entity_id: binary_sensor.attic_stairs_motion_sensor_occupancy
    from: 'off'
    to: 'on'
conditions:
  - condition: template
    value_template: '{{ is_state(''light.0x54ef4410010f08d5'', ''off'') or is_state(''input_boolean.stairs_led_attic'', ''off'')
      }}'
actions:
  - action: script.stairs_led_section
    data:
      section: attic
      to: 'on'
      brightness: '{{ 1 if states(''sensor.0x54ef44100143e472_illuminance'') | float(100) < 30 and (is_state(''light.0x54ef4410010f08d5'',
        ''off'') or state_attr(''light.0x54ef4410010f08d5'', ''brightness'') | int(0) <= 3) else 100 }}'
  - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.attic_stairs_motion_sensor_occupancy
        to: 'off'
        for:
          seconds: 120
    timeout:
      minutes: 30
  - action: script.stairs_led_section
    data:
      section: attic
      to: 'off'
mode: single
max_exceeded: silent
