id: floor_strip_night_mode_21_00
alias: Floor Strip - Night Mode (21:00)
triggers:
  - trigger: time
    at: '21:00:00'
actions:
  - action: light.turn_on
    target:
      entity_id: light.0x54ef4410010f08d5
    data:
      brightness: 255
  - action: script.floor_strip_night
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.stairs_led_first_floor
  - action: input_boolean.turn_off
    target:
      entity_id:
        - input_boolean.stairs_led_basement
        - input_boolean.stairs_led_attic
