# Board: NodeMCU v2 (ESP8266) + HLK-LD2410
# LD2410 on swapped UART0: D8/GPIO15 = TX -> radar RX, D7/GPIO13 = RX <- radar TX.
# Swapped pins keep the radar off GPIO1/3, which the onboard USB-serial chip also drives.
# Radar VCC needs 5V (NodeMCU VIN), not 3V3.
# Lamp board (K812 dimmer, U1 removed): D1 -> R2 -> M1 warm; cool channel unused.
# Feed the lamp's 5V before the NodeMCU, not from VIN: sharing the USB/diode path makes it flicker.

esphome:
  name: desk-lamp
  friendly_name: Desk Lamp

esp8266:
  board: nodemcuv2

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret desk_lamp_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Desk Lamp Fallback Hotspot"
    password: !secret desk_lamp_ap_password

captive_portal:

status_led:
  pin:
    number: GPIO2
    inverted: true

output:
  - platform: gpio
    id: warm_out
    pin: D1

light:
  - platform: binary
    name: "Desk lamp"
    id: lamp
    output: warm_out
    restore_mode: RESTORE_DEFAULT_OFF

switch:
  - platform: template
    name: "Desk lamp auto mode"
    id: auto_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: ld2410
    engineering_mode:
      name: Engineering mode
    bluetooth:
      name: Radar bluetooth

uart:
  id: ld2410_uart
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: ld2410_uart

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Desk presence"
      device_class: occupancy
      trigger_on_initial_state: true
      on_state:
        then:
          - if:
              condition:
                switch.is_on: auto_mode
              then:
                - if:
                    condition:
                      lambda: return x;
                    then:
                      - light.turn_on: lamp
                    else:
                      - light.turn_off: lamp
    has_moving_target:
      name: Moving target
    has_still_target:
      name: Still target

sensor:
  - platform: ld2410
    moving_distance:
      name: Moving distance
    still_distance:
      name: Still distance
    detection_distance:
      name: Detection distance
    g0:
      move_energy:
        name: G0 move energy
      still_energy:
        name: G0 still energy
    g1:
      move_energy:
        name: G1 move energy
      still_energy:
        name: G1 still energy
    g2:
      move_energy:
        name: G2 move energy
      still_energy:
        name: G2 still energy
    g3:
      move_energy:
        name: G3 move energy
      still_energy:
        name: G3 still energy

number:
  - platform: ld2410
    timeout:
      name: Radar timeout
    max_move_distance_gate:
      name: Max move distance gate
    max_still_distance_gate:
      name: Max still distance gate
    g0:
      move_threshold:
        name: G0 move threshold
      still_threshold:
        name: G0 still threshold
    g1:
      move_threshold:
        name: G1 move threshold
      still_threshold:
        name: G1 still threshold
    g2:
      move_threshold:
        name: G2 move threshold
      still_threshold:
        name: G2 still threshold
    g3:
      move_threshold:
        name: G3 move threshold
      still_threshold:
        name: G3 still threshold

select:
  - platform: ld2410
    distance_resolution:
      name: Distance resolution

button:
  - platform: ld2410
    factory_reset:
      name: Radar factory reset
    restart:
      name: Radar restart
    query_params:
      name: Radar query params
