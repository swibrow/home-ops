---
# Consumer side of a CNPG cluster that has its own dedicated Cluster in the
# `database` namespace (forgejo, propagit, rybbit, temporal).
#
# Identical to ../cnpg-db except for the namespace: it reads the same
# CNPG-generated `<cluster>-app` / `<cluster>-superuser` secret shape, but pulls
# it through the `cnpg-secrets-database` store and qualifies the host with
# `.database`. Kept as a separate component rather than parameterising
# ../cnpg-db, because that one is still wired into every app left in
# `cloudnative-pg` and this move should not touch them.
#
# Unlike ../cnpg-db-shared, the source secret here is CNPG-generated, not one we
# author — so the key is `user`, not `username`, and `host` is the bare service
# name that needs qualifying.
#
# The `postgresql` in DB_URL is a placeholder: the DB_SCHEME literal in the
# consumer's cnpg-db-config replaces everything left of the first "://".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: cnpg-secrets-database
    kind: ClusterSecretStore
  target:
    name: app-db-secret
    template:
      type: Opaque
      data:
        DB_HOST: '{{ index . "host" }}.database.svc.cluster.local'
        DB_PORT: '{{ index . "port" }}'
        DB_USER: '{{ index . "user" }}'
        DB_PASS: '{{ index . "password" }}'
        DB_NAME: '{{ index . "dbname" }}'
        DB_URL: 'postgresql://{{ index . "user" }}:{{ index . "password" }}@{{ index . "host" }}.database.svc.cluster.local:{{ index . "port" }}/{{ index . "dbname" }}?sslmode=disable'
  dataFrom:
    - extract:
        key: app-superuser
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
