---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: app
spec:
  repository:
    kind: ClusterRepository
    name: garage
  sources:
    - pvc:
        name: app
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  groupBy: None
  credentialProjection:
    enabled: true
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: 5Gi
      mode: Persistent
      storageClassName: ceph-block
    # Run the mover as the uid/gid that owns the app's data so kopia can read
    # files the app wrote 0600. Defaults to the house uid 2000; apps that can't
    # run as it override it with a patch in their kustomization (see dev/forgejo).
    securityContext:
      runAsUser: 2000
      runAsGroup: 2000
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
