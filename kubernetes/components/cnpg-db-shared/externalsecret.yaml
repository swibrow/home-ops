---
# Consumer side of a multi-tenant CNPG cluster in the `database` namespace, and
# since the dedicated clusters were retired, the only CNPG consumer component
# left.
#
# It templates no namespace and no service FQDN. The source secret is not a
# CNPG-generated `<cluster>-app` secret but one we author in `database` per
# tenant (see kubernetes/apps/pitower/database/tenants/), and it already carries
# host/port/dbname alongside the credentials. That is what makes this component
# namespace-agnostic: moving a cluster or renaming a service changes the source
# secret, not 16 consumers.
#
# The source secret does double duty — CNPG reads `username`/`password` from it
# to reconcile the DatabaseRole, and this ExternalSecret reads all five keys.
# Note the key is `username`, not the `user` that CNPG's own app secrets use.
#
# The `postgresql` in DB_URL is a placeholder: the DB_SCHEME literal in the
# consumer's cnpg-db-config replaces everything left of the first "://".
# Drivers disagree about the scheme for the same server — SQLAlchemy resolves a
# bare `postgresql://` to psycopg2, so anything on psycopg 3 must say
# `postgresql+psycopg` — while host/port/user/password/dbname are identical.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: cnpg-secrets-database
    kind: ClusterSecretStore
  target:
    name: app-db-secret
    template:
      type: Opaque
      data:
        DB_HOST: '{{ index . "host" }}'
        DB_PORT: '{{ index . "port" }}'
        DB_USER: '{{ index . "username" }}'
        DB_PASS: '{{ index . "password" }}'
        DB_NAME: '{{ index . "dbname" }}'
        DB_URL: 'postgresql://{{ index . "username" }}:{{ index . "password" }}@{{ index . "host" }}:{{ index . "port" }}/{{ index . "dbname" }}?sslmode=disable'
  dataFrom:
    - extract:
        key: app-superuser
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
