---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: argocd-secret
    creationPolicy: Merge
    # Without an explicit template, ESO copies this ExternalSecret's own
    # annotations onto the target Secret — including argocd.argoproj.io/tracking-id.
    # ArgoCD then reads a tracking-id claiming the Secret is an ExternalSecret,
    # fails to match it to the chart's Secret manifest, and reports permanent
    # OutOfSync. Pinning metadata here stops the propagation.
    template:
      mergePolicy: Merge
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: server.secretkey
      remoteRef:
        key: /argocd/secretkey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: webhook.github.secret
      remoteRef:
        key: /argocd/webhook
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
