---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - appproject.yaml
  - externalsecret.yaml
  - externalsecret-custom.yaml
  - pitower-cluster-secret.yaml
  - repo-creds-ghcr.yaml
  - repo-creds-github.yaml

helmCharts:
  - name: argo-cd
    version: 10.6.1
    repo: https://argoproj.github.io/argo-helm
    releaseName: argocd
    namespace: argocd
    valuesFile: argocd-values.yaml
