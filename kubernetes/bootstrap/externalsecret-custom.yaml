---
# Replaces the hand-applied argocd-secret-custom from secrets.sops.yaml, which
# was never in kustomization.yaml (ArgoCD has no SOPS decryptor) and so could
# not be rebuilt from git. Referenced by argocd-values.yaml via the
# $argocd-secret-custom:<key> indirection.
#
# An explicit target.template.metadata is required: without it ESO copies this
# ExternalSecret's own annotations onto the Secret, including
# argocd.argoproj.io/tracking-id, which makes ArgoCD report the Secret as
# permanently OutOfSync.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret-custom
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: argocd-secret-custom
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        dex.github.clientID: Iv23li0GuWmH00jCKhzh
        dex.github.clientSecret: "{{ .oauth2 }}"
        githubAppID: "1320850"
        githubAppInstallationID: "68309201"
        githubAppPrivateKey: "{{ .privatekey }}"
  data:
    - secretKey: oauth2
      remoteRef:
        key: /argocd/oauth2
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: privatekey
      remoteRef:
        key: /argocd/privatekey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
