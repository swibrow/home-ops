---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browser-use
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: browser-use-secret
    creationPolicy: Owner
  data:
    # agentgateway client key (ai/agentgateway), not a real Anthropic key —
    # paired with ANTHROPIC_BASE_URL in values.yaml pointing at the gateway.
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: /ai/agentgateway/BROWSER_USE_API_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
