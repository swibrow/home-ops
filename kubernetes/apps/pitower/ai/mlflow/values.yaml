# fullnameOverride keeps the Service name simple ("mlflow") for the HTTPRoute
# backendRef, matching the release name instead of "mlflow-mlflow".
fullnameOverride: mlflow

mlflow:
  backendStoreUriFrom:
    secretKeyRef:
      name: mlflow-db-secret
      key: DB_URL
  # Proxied artifacts in Garage's `models` bucket: clients only need the
  # tracking URL, not S3 credentials. Model files uploaded by hand go
  # elsewhere in the same bucket, outside mlflow/.
  artifactsDestination: s3://models/mlflow

envFrom:
  - secretRef:
      name: mlflow-s3-secret

env:
  # The public endpoint, not the in-cluster Service: with proxied multipart
  # uploads the server hands clients presigned part URLs on this host.
  - name: MLFLOW_S3_ENDPOINT_URL
    value: https://s3.wibrow.dev
  - name: MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD
    value: "true"

# MLflow's DNS-rebinding guard (default: localhost + private IPs only)
# rejects the public Host header "mlflow.wibrow.dev" that Envoy Gateway
# forwards unchanged. envoy-internal is already the trust boundary for this
# route (internal-only), so disable the middleware rather than allowlist
# hosts — see https://mlflow.org/docs/latest/self-hosting/security/network/.
server:
  flag_options:
    - disable_security_middleware

service:
  type: ClusterIP

metrics:
  enabled: true
  path: /metrics
serviceMonitor:
  enabled: true

# Picks up a tenant password rotation without a manual rollout.
podAnnotations:
  reloader.stakater.com/auto: "true"

# v3.14.0-full (chart default image tag) with 4 gunicorn workers OOMs
# under 2Gi within seconds of startup.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 4Gi
