---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
#
# Tracking for the ai-training fine-tunes (docs/applications/model-training.md)
# and the Claude Code tracing backend. It replaced Phoenix, whose tracing plugin
# collapses every repo into one project, while MLflow's claude-code plugin
# resolves the experiment per-project from .claude/settings.json.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - externalsecret.yaml
  - httproute.yaml
components:
  - ../../../../components/cnpg-db-shared
configMapGenerator:
  - name: cnpg-db-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=mlflow
      - SECRET_NAME=mlflow-db-secret
      - CNPG_SECRET_KEY=ai-mlflow
      - DB_SCHEME=postgresql
helmCharts:
  - name: mlflow
    repo: oci://ghcr.io/mlflow/charts
    version: 3.17.0
    releaseName: mlflow
    namespace: ai
    valuesFile: values.yaml
