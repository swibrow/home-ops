---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/embeddingserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: EmbeddingServer
metadata:
  name: mcp-tools-embedding
spec:
  model: sentence-transformers/all-MiniLM-L6-v2
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest@sha256:86da7b7687bbe8886120383bf1f463bc596c278849b6c816d0c200bd0733a12b
  env:
    - name: HOSTNAME
      value: "::"
  # TEI's CPU image is amd64-only; the Pi workers are arm64.
  podTemplateSpec:
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
