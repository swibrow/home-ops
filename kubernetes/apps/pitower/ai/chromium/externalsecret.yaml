---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Kanidm OAuth2 client secret for the SecurityPolicy (Envoy Gateway reads the
# "client-secret" key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name chromium-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: /ai/chromium/OIDC_CLIENT_SECRET
