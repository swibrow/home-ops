---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentgateway-system

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

resources:
  - namespace.yaml

# agentgateway-crds ships only the agentgateway.dev CRDs (in templates/). The
# Gateway API CRDs come from networking/envoy-gateway; both pin gateway-api v1.6.1.
helmCharts:
  - name: agentgateway-crds
    repo: oci://cr.agentgateway.dev/charts
    version: v2.2.1
    releaseName: agentgateway-crds
    namespace: agentgateway-system
  - name: agentgateway
    repo: oci://cr.agentgateway.dev/charts
    version: v1.5.0
    releaseName: agentgateway
    namespace: agentgateway-system
    valuesFile: values.yaml
