---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single ArgoCD app (pitower-ai-agentgateway), same aggregation pattern as
# llmkube: controller + CRDs in agentgateway-system (wave 0), then the Gateway,
# models and policies in ai (wave 1). The controller deploys the proxy next to
# its Gateway, so the data plane runs in ai.
resources:
  - controller
  - config
