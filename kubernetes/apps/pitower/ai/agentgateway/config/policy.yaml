---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agentgateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway
  traffic:
    # Clients authenticate with either a client key or a service account token
    # (audience agentgateway). Both checks are Optional, so the Require rule
    # below is what rejects a request carrying neither.
    apiKeyAuthentication:
      mode: Optional
      secretRef:
        name: agentgateway-client-keys
      # Accepts the key from x-agentgateway-api-key (Claude Code on the Max
      # plan, whose Authorization carries the sk-ant-oat OAuth token; set via
      # ANTHROPIC_CUSTOM_HEADERS), x-api-key (Anthropic SDK), or
      # Authorization: Bearer (OpenAI SDK). A bearer JWT (eyJ...) is left to
      # jwtAuthentication: Optional mode rejects a present but unknown key.
      location:
        expression: >-
          coalesce(request.headers["x-agentgateway-api-key"],
          request.headers["x-api-key"],
          request.headers["authorization"].startsWith("Bearer eyJ") ? null :
          request.headers["authorization"].stripPrefix("Bearer "))
    jwtAuthentication:
      mode: Optional
      location:
        expression: >-
          request.headers["authorization"].startsWith("Bearer eyJ") ?
          request.headers["authorization"].stripPrefix("Bearer ") : null
      providers:
        - issuer: https://raw.githubusercontent.com/swibrow/home-ops/main/pitower/kubernetes
          audiences:
            - agentgateway
          jwks:
            remote:
              url: https://raw.githubusercontent.com/swibrow/home-ops/main/pitower/kubernetes/openid/v1/jwks
    # Any pod can mint a token for its own service account, so the subjects
    # are listed like the client keys are.
    authorization:
      action: Require
      policy:
        matchExpressions:
          - >-
            has(apiKey.key) || (has(jwt.sub) && jwt.sub in [
            "system:serviceaccount:selfhosted:mealie"
            ])
    # An expression location is not stripped after auth like a header
    # location is, so drop the gateway key before it reaches a provider.
    headerModifiers:
      request:
        remove:
          - x-agentgateway-api-key
          - x-api-key
    timeouts:
      request: 600s
    retry:
      attempts: 2
      codes: [429, 500, 502, 503]
  # The model router parses every path as chat completions unless told
  # otherwise, which answers Anthropic SDK /v1/messages calls in OpenAI format
  # and 400s embeddings.
  backend:
    ai:
      routes:
        /v1/chat/completions: Completions
        /v1/messages: Messages
        /v1/messages/count_tokens: AnthropicTokenCount
        /v1/embeddings: Embeddings
        /v1/responses: Responses
        /v1/models: Models
  frontend:
    tracing:
      url: http://otel-collector.monitoring.svc.cluster.local:4318
      protocol: HTTP
      path: /v1/traces
