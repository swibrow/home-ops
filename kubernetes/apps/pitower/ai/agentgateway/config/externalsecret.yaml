---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentgateway-providers
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  # Shared with litellm while both gateways run.
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: /ai/litellm/OPENROUTER_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /ai/litellm/OPENAI_API_KEY
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentgateway-client-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  # One entry per client; the entry name is the client identity.
  data:
    - secretKey: admin
      remoteRef:
        key: /ai/agentgateway/ADMIN_API_KEY
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentgateway-ui-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: /ai/agentgateway/UI_OIDC_CLIENT_SECRET
