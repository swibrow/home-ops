---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentgateway-providers
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: /ai/agentgateway/OPENROUTER_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /ai/agentgateway/OPENAI_API_KEY
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentgateway-client-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  # One entry per client; the entry name is the client identity. goat's key
  # lives under /goat because its chart syncs it from there.
  data:
    - secretKey: admin
      remoteRef:
        key: /ai/agentgateway/ADMIN_API_KEY
    - secretKey: open-webui
      remoteRef:
        key: /ai/agentgateway/OPEN_WEBUI_API_KEY
    - secretKey: memini
      remoteRef:
        key: /ai/agentgateway/MEMINI_API_KEY
    - secretKey: hermes
      remoteRef:
        key: /ai/agentgateway/HERMES_API_KEY
    - secretKey: iris
      remoteRef:
        key: /ai/agentgateway/IRIS_API_KEY
    - secretKey: browser-use
      remoteRef:
        key: /ai/agentgateway/BROWSER_USE_API_KEY
    - secretKey: flickerd
      remoteRef:
        key: /ai/agentgateway/FLICKERD_API_KEY
    - secretKey: garrison
      remoteRef:
        key: /ai/agentgateway/GARRISON_API_KEY
    - secretKey: how
      remoteRef:
        key: /ai/agentgateway/HOW_API_KEY
    - secretKey: goat
      remoteRef:
        key: /goat/LLM_API_KEY
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentgateway-ui-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: /ai/agentgateway/UI_OIDC_CLIENT_SECRET
