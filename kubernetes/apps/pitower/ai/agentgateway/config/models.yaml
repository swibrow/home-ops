---
# Catch-all: any other model id goes to OpenRouter unchanged. The model router
# takes the first match in namespace/name order, so this must sort last.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: zz-openrouter
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway
      sectionName: http
  match:
    model: "*"
  provider: Openrouter
  policies:
    auth:
      secretRef:
        name: agentgateway-providers
        key: OPENROUTER_API_KEY
