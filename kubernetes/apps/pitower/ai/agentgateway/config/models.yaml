---
# Anthropic API credits via workload identity federation (anthropic-wif.yaml).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: claude-opus
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway
      sectionName: http
  provider: Anthropic
  policies:
    auth:
      secretRef:
        name: anthropic-wif-token
        key: token
      location:
        header:
          name: Authorization
          prefix: "Bearer "
    transformations:
      - field: model
        expression: '"claude-opus-5-5"'
---
