# Claude Max subscription: no provider auth, so the client's sk-ant-oat OAuth
# token in Authorization reaches Anthropic unchanged. Unlike litellm there is
# no fallback to an API key when the token is missing; the request fails.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: claude-haiku-max
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway
      sectionName: http
  provider: Anthropic
  policies:
    transformations:
      - field: model
        expression: '"claude-haiku-4-5"'
