---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Only the credentials that must exist before Iris can boot. Anything else she
# needs (extra provider API keys, tool tokens) she adds from the dashboard's Keys
# tab, which writes $HERMES_HOME/.env on the PVC — not through this file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name iris
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    # Model provider: the shared litellm virtual key, same convention as hermes.
    # Only used to bake the first-boot config seed; after that the on-disk value wins.
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: /ai/litellm/LITELLM_MASTER_KEY
    # Telegram chat interface — her own bot, separate from hermes's.
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: /ai/iris/TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_ALLOWED_USERS
      remoteRef:
        key: /ai/iris/TELEGRAM_ALLOWED_USERS
    # Dashboard Kanidm OAuth2 client (self-hosted OIDC provider) — the ONLY way in.
    - secretKey: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
      remoteRef:
        key: /ai/iris/HERMES_DASHBOARD_OIDC_CLIENT_SECRET
