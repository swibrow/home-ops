---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - ./externalsecret.yaml
  - ./securitypolicy.yaml
  - ./autoscale.yaml
components:
  - ../../../../components/pvc
  - ../../../../components/kopiur
configMapGenerator:
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=voicestudio-pvc
      - CLAIM_NAME=voicestudio-data
      - STORAGE_SIZE=10Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=voicestudio-kopiur
      - CLAIM_NAME=voicestudio-data
patches:
  # voicestudio runs as root and its prefs.json/run_sentinel.json are 0600 root-owned; the kopiur mover must match to read them.
  - target:
      kind: SnapshotPolicy
      name: voicestudio-kopiur
    patch: |
      - op: replace
        path: /spec/mover/securityContext/runAsUser
        value: 0
      - op: replace
        path: /spec/mover/securityContext/runAsGroup
        value: 0
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.3.0
    releaseName: voicestudio
    namespace: ai
    valuesFile: values.yaml
