---
apiVersion: v1
kind: Namespace
metadata:
  name: ai
  annotations:
    # Shared by every ai app; never let removing voicestudio take the namespace with it.
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false
    # voicestudio runs as root and writes 0600 root-owned files, so its kopiur
    # mover runs as uid 0; kopiur requires this per-namespace opt-in for an elevated mover.
    kopiur.home-operations.com/privileged-movers: "true"
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
