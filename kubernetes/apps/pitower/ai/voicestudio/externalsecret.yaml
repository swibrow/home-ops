---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name voicestudio
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    # Admin key the web UI exchanges for a browser session.
    - secretKey: OMNIVOICE_API_KEY
      remoteRef:
        key: /ai/voicestudio/OMNIVOICE_API_KEY
    - secretKey: HF_TOKEN
      remoteRef:
        key: /ai/hf/HF_TOKEN
