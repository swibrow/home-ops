---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Google OAuth client JSON for the google-workspace skill, mounted as a file
# (values.yaml persistence.google-client-secret), never exposed as env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-google
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_WORKSPACE_OAUTH
      remoteRef:
        key: /ai/hermes/GOOGLE_WORKSPACE_OAUTH
