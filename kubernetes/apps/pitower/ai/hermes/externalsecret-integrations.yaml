---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Tokens for the cron pre-check scripts (cron/jobs.yaml). Kept out of the main
# `hermes` secret so a missing Infisical key only breaks this sync, and the pod
# references each key as optional.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-integrations
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    # Miniflux > Settings > API Keys.
    - secretKey: MINIFLUX_API_TOKEN
      remoteRef:
        key: /ai/hermes/MINIFLUX_API_TOKEN
    # Forgejo access token with read:notification scope.
    - secretKey: FORGEJO_TOKEN
      remoteRef:
        key: /ai/hermes/FORGEJO_TOKEN
