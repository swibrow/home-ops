model:
  # Claude Max subscription via agentgateway's *-max models, which forward the
  # client's OAuth token to Anthropic unchanged. The AI box (`local` on the llm
  # provider) is left free for testing.
  default: claude-sonnet-max
  provider: anthropic
  context_length: 200000
# Paid OpenRouter fallback when the subscription is rate-limited. On the llm
# provider so the OAuth headers below never reach OpenRouter.
fallback_providers:
  - provider: llm
    model: claude-haiku
providers:
  llm:
    # agentgateway's baseURL for `local` is the KEDA -scaled Service, so an
    # idle-scaled pod wakes on request; the first call after idle blocks on
    # the cold start.
    base_url: http://agentgateway.ai.svc.cluster.local/v1
    api_mode: chat_completions
    # hermes does NOT interpolate ${VAR} in config and the provider requires the
    # key inline. The init container substitutes the __PLACEHOLDERS__ from the
    # `hermes` secret before hermes starts.
    api_key: __AGENTGATEWAY_API_KEY__
    # Single llama.cpp slot: concurrent requests queue server-side.
    request_timeout_seconds: 900
  anthropic:
    # A different gateway hostname from llm on purpose: hermes matches
    # extra_headers by base_url, and these carry the subscription token.
    base_url: http://agentgateway.ai.svc/
    api_mode: anthropic_messages
    # The OAuth token as api_key makes hermes apply its Claude Code request
    # transforms. It still goes out as x-api-key (agentgateway strips that), so
    # the token rides in Authorization and the gateway key in its own header.
    api_key: __CLAUDE_OAUTH_TOKEN__
    extra_headers:
      x-agentgateway-api-key: __AGENTGATEWAY_API_KEY__
      Authorization: Bearer __CLAUDE_OAUTH_TOKEN__
      anthropic-beta: oauth-2025-04-20,claude-code-20250219,interleaved-thinking-2025-05-14,fine-grained-tool-streaming-2025-05-14
toolsets:
  - hermes-cli
skills:
  # Synced from swibrow/hermes by the git-sync sidecar.
  external_dirs:
    - /opt/hermes-repo/current/skills
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
memory:
  provider: memini
  auto_migrate: true
compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  reasoning_effort: medium
streaming:
  enabled: false
security:
  redact_secrets: true
privacy:
  redact_pii: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
mcp_servers:
  # Anonymous in-cluster vMCP (toolhive/toolhive-config/virtualmcpserver-direct.yaml).
  # The OAuth vMCP (vmcp-mcp-gateway, mcp.wibrow.dev) requires a browser OAuth flow
  # Hermes can't do, so it uses the anonymous sibling, netpol-locked to this pod.
  toolhive:
    url: http://vmcp-mcp-gateway-direct.ai:4483/mcp
auxiliary:
  vision:
    provider: anthropic
    model: claude-sonnet-max
  compression:
    provider: anthropic
    model: claude-haiku-max
    timeout: 180
  web_extract:
    provider: anthropic
    model: claude-haiku-max
    timeout: 120
  approval:
    provider: anthropic
    model: claude-haiku-max
    timeout: 60
  session_search:
    provider: anthropic
    model: claude-haiku-max
    timeout: 120
