model:
  # Claude Max subscription through the official Claude Code CLI
  # (NousResearch/hermes-plugin-claude-subscription-directsdk, installed by the
  # claude-code init container). The AI box (`local` on llm) stays free.
  provider: claude-subscription-directsdk-experimental
  default: sonnet
# Paid OpenRouter fallback for when the subscription is rate-limited.
fallback_providers:
  - provider: llm
    model: claude-haiku
providers:
  llm:
    # agentgateway's baseURL for `local` is the KEDA -scaled Service, so an
    # idle-scaled pod wakes on request; the first call after idle blocks on
    # the cold start.
    base_url: http://agentgateway.ai.svc.cluster.local/v1
    api_mode: chat_completions
    # hermes does NOT interpolate ${VAR} in config and the provider requires the
    # key inline. The init container substitutes this placeholder with the real
    # AGENTGATEWAY_API_KEY (from the `hermes` secret) before hermes starts.
    api_key: __AGENTGATEWAY_API_KEY__
    # Single llama.cpp slot: concurrent requests queue server-side.
    request_timeout_seconds: 900
  claude-subscription-directsdk-experimental:
    # Bounds a Claude Code call that hangs without output; Hermes' stale-call
    # watchdog is off for process:// providers otherwise.
    stale_timeout_seconds: 900
toolsets:
  - hermes-cli
skills:
  # Synced from swibrow/hermes by the git-sync sidecar.
  external_dirs:
    - /opt/hermes-repo/current/skills
  write_approval: true
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
approvals:
  mode: smart
  # Cron jobs read mail, feeds and alert payloads; anything flagged dangerous is
  # denied there rather than auto-approved.
  cron_mode: deny
  # Unconditional, even under /yolo. Mail is read + draft only (no draft
  # subcommand exists, so drafts go to chat), and infra changes go through git.
  deny:
    - '*google_api.py gmail send*'
    - '*google_api.py gmail reply*'
    - '*gws gmail*send*'
    - 'kubectl delete*'
    - 'terraform apply*'
    - 'terraform destroy*'
    - 'talosctl reset*'
    - 'git push --force*'
checkpoints:
  enabled: true
memory:
  provider: memini
  auto_migrate: true
compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  reasoning_effort: medium
streaming:
  enabled: false
security:
  redact_secrets: true
privacy:
  redact_pii: true
platform_toolsets:
  # Listing an MCP server name makes it an allowlist, so interactive sessions
  # get the full toolhive server and not the duplicate read-only view.
  cli:
    - hermes-cli
    - toolhive
  telegram:
    - hermes-telegram
    - toolhive
mcp_servers:
  # Anonymous in-cluster vMCP (toolhive/toolhive-config/virtualmcpserver-direct.yaml).
  # The OAuth vMCP (vmcp-mcp-gateway, mcp.wibrow.dev) requires a browser OAuth flow
  # Hermes can't do, so it uses the anonymous sibling, netpol-locked to this pod.
  toolhive:
    url: http://vmcp-mcp-gateway-direct.ai:4483/mcp
  # Same gateway restricted to read tools, for cron jobs that ingest untrusted
  # text. Allowlisted by name because vMCP aggregation is not verified to keep
  # readOnlyHint annotations (so `trust: untrusted` could block reads too).
  # Names are the vMCP-prefixed originals, e.g. github_list_pull_requests.
  toolhive_ro:
    url: http://vmcp-mcp-gateway-direct.ai:4483/mcp
    tools:
      include:
        - '*_get*'
        - '*_list*'
        - '*_search*'
        - '*_query*'
        - '*_find*'
        - '*_describe*'
        - '*_read*'
auxiliary:
  vision:
    provider: claude-subscription-directsdk-experimental
    model: sonnet
  compression:
    provider: claude-subscription-directsdk-experimental
    model: haiku
    timeout: 180
  web_extract:
    provider: claude-subscription-directsdk-experimental
    model: haiku
    timeout: 120
  approval:
    provider: claude-subscription-directsdk-experimental
    model: haiku
    timeout: 60
  session_search:
    provider: claude-subscription-directsdk-experimental
    model: haiku
    timeout: 120
