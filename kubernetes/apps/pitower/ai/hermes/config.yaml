model:
  # Claude Max subscription through the official Claude Code CLI
  # (NousResearch/hermes-plugin-claude-subscription-directsdk, installed by the
  # claude-code init container). The AI box (`local` on llm) stays free.
  provider: claude-subscription-directsdk-experimental
  default: sonnet
# Paid OpenRouter fallback for when the subscription is rate-limited.
fallback_providers:
  - provider: llm
    model: claude-haiku
providers:
  llm:
    # agentgateway's baseURL for `local` is the KEDA -scaled Service, so an
    # idle-scaled pod wakes on request; the first call after idle blocks on
    # the cold start.
    base_url: http://agentgateway.ai.svc.cluster.local/v1
    api_mode: chat_completions
    # hermes does NOT interpolate ${VAR} in config and the provider requires the
    # key inline. The init container substitutes this placeholder with the real
    # AGENTGATEWAY_API_KEY (from the `hermes` secret) before hermes starts.
    api_key: __AGENTGATEWAY_API_KEY__
    # Single llama.cpp slot: concurrent requests queue server-side.
    request_timeout_seconds: 900
  claude-subscription-directsdk-experimental:
    # Bounds a Claude Code call that hangs without output; Hermes' stale-call
    # watchdog is off for process:// providers otherwise.
    stale_timeout_seconds: 900
toolsets:
  - hermes-cli
skills:
  # Synced from swibrow/hermes by the git-sync sidecar.
  external_dirs:
    - /opt/hermes-repo/current/skills
  write_approval: true
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
approvals:
  mode: smart
  # Cron jobs read mail and feeds; anything flagged dangerous is denied there
  # rather than auto-approved, so mail is only ever acted on from a chat.
  cron_mode: deny
  # Acting on mail is allowed, but only once approved in the chat.
  smart_policy: >-
    Always ESCALATE commands that send, reply to, forward, archive, label or
    delete email (google_api.py gmail send/reply/modify, gws gmail), and that
    create, change or delete calendar events or Drive files.
  # Unconditional, even under /yolo. Infra changes go through git.
  deny:
    - 'kubectl delete*'
    - 'terraform apply*'
    - 'terraform destroy*'
    - 'talosctl reset*'
    - 'git push --force*'
checkpoints:
  enabled: true
memory:
  provider: memini
  auto_migrate: true
compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  reasoning_effort: medium
streaming:
  enabled: false
security:
  redact_secrets: true
privacy:
  redact_pii: true
platform_toolsets:
  # Listing an MCP server name makes it an allowlist, so interactive sessions
  # get the full toolhive server and not the duplicate read-only view.
  cli:
    - hermes-cli
    - toolhive
    - paperless
    - chromium
  telegram:
    - hermes-telegram
    - toolhive
    - paperless
    - chromium
mcp_servers:
  # Anonymous in-cluster vMCP (toolhive/toolhive-config/virtualmcpserver-direct.yaml).
  # The OAuth vMCP (vmcp-mcp-gateway, mcp.wibrow.dev) requires a browser OAuth flow
  # Hermes can't do, so it uses the anonymous sibling, netpol-locked to this pod.
  toolhive:
    url: http://vmcp-mcp-gateway-direct.ai:4483/mcp
  # GitHub read tools for cron jobs that ingest untrusted text. This has to be
  # the backend proxy rather than the vMCP: the vMCP runs the optimizer, so it
  # only advertises find_tool/call_tool and an include list cannot narrow what
  # call_tool reaches. Names are github-mcp-server v2's own; ingress is granted
  # in toolhive-config/networkpolicy.yaml.
  github_ro:
    url: http://mcp-github-proxy.ai.svc.cluster.local:8080/mcp
    tools:
      include:
        - get_me
        - issue_read
        - list_issues
        - search_issues
        - pull_request_read
        - list_pull_requests
        - search_pull_requests
        - get_file_contents
  # Outside the mcp-tools group, so not on the vMCPs (one of which has a no-auth
  # route): its token can edit and delete documents. Ingress is the hermes pod
  # only (toolhive-config/networkpolicy.yaml).
  paperless:
    url: http://mcp-paperless-proxy.ai.svc.cluster.local:8080/mcp
  # The signed-in Chromium desktop (apps/pitower/ai/chromium), outside ToolHive
  # so only this pod can drive it.
  chromium:
    url: http://chromium.ai.svc.cluster.local:8931/mcp
auxiliary:
  vision:
    provider: claude-subscription-directsdk-experimental
    model: sonnet
  compression:
    provider: claude-subscription-directsdk-experimental
    model: haiku
    timeout: 180
  web_extract:
    provider: claude-subscription-directsdk-experimental
    model: haiku
    timeout: 120
  approval:
    provider: claude-subscription-directsdk-experimental
    model: haiku
    timeout: 60
  session_search:
    provider: claude-subscription-directsdk-experimental
    model: haiku
    timeout: 120
