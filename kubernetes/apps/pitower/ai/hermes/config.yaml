model:
  default: claude-sonnet
  provider: anthropic
fallback_providers:
  - provider: anthropic
    model: claude-haiku
providers:
  anthropic:
    # Routed through litellm (ai/litellm) instead of api.anthropic.com directly,
    # using a litellm virtual key rather than a real Anthropic key. Model names
    # are litellm's own aliases (claude-sonnet/claude-haiku -> OpenRouter), not
    # real Anthropic model ids, since litellm resolves on model_name.
    base_url: http://litellm.ai.svc.cluster.local:4000/
    api_mode: anthropic_messages
    # hermes does NOT interpolate ${VAR} in config (that relies on Flux postBuild
    # substitution, unused here) and the provider requires the key inline. The init
    # container substitutes this placeholder with the real LITELLM_API_KEY (from
    # the `hermes` secret) before hermes starts — mirroring what Flux bakes in.
    api_key: __LITELLM_API_KEY__
toolsets:
  - hermes-cli
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
memory:
  provider: memini
  auto_migrate: true
compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  reasoning_effort: medium
streaming:
  enabled: false
dashboard:
  basic_auth:
    username: sam
    # scrypt hash; plaintext password stored in Infisical at /ai/hermes/DASHBOARD_PASSWORD.
    password_hash: scrypt$16384$8$1$xuUHK0DPiX6pfows0DbscA==$0SjPi57CMxiyMgxPqLF5OyYySEkJ61Wt9oBnpEaw1hw=
security:
  redact_secrets: true
privacy:
  redact_pii: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
mcp_servers:
  # Anonymous in-cluster vMCP (toolhive/toolhive-config/virtualmcpserver-direct.yaml).
  # The OAuth vMCP (vmcp-mcp-gateway, mcp.wibrow.dev) requires a browser OAuth flow
  # Hermes can't do, so it uses the anonymous sibling, netpol-locked to this pod.
  toolhive:
    url: http://vmcp-mcp-gateway-direct.ai:4483/mcp
auxiliary:
  vision:
    provider: anthropic
    model: claude-sonnet
  compression:
    provider: anthropic
    model: claude-haiku
    timeout: 180
  web_extract:
    provider: anthropic
    model: claude-haiku
    timeout: 120
  approval:
    provider: anthropic
    model: claude-haiku
    timeout: 60
  session_search:
    provider: anthropic
    model: claude-haiku
    timeout: 120
