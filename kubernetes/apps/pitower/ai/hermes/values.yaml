defaultPodOptions:
  securityContext:
    fsGroup: 10000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  hermes:
    annotations:
      reloader.stakater.com/auto: "true"
    replicas: 1
    strategy: Recreate
    type: deployment
    initContainers:
      git-sync:
        image:
          repository: registry.k8s.io/git-sync/git-sync
          tag: v4.7.1@sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717
        restartPolicy: Always
        env:
          GITSYNC_REPO: git@github.com:swibrow/hermes.git
          GITSYNC_REF: main
          GITSYNC_ROOT: /opt/hermes-repo
          GITSYNC_LINK: current
          GITSYNC_PERIOD: 60s
          GITSYNC_MAX_FAILURES: "10"
          GITSYNC_SSH_KEY_FILE: /etc/git-secret/ssh
          GITSYNC_SSH_KNOWN_HOSTS_FILE: /etc/git-secret/known_hosts
          # ssh needs a passwd entry for the non-default uid.
          GITSYNC_ADD_USER: "true"
          GITSYNC_HTTP_BIND: :2020
          GITSYNC_EXECHOOK_COMMAND: /etc/git-sync/exechook.sh
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 2020
              periodSeconds: 2
              failureThreshold: 60
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 128Mi
      init:
        dependsOn: git-sync
        image:
          repository: docker.io/library/alpine
          tag: "3.24"
        envFrom:
          - secretRef:
              name: hermes
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            # Bake the real AGENTGATEWAY_API_KEY into the config (hermes needs it inline
            # and does not interpolate ${VAR}). Key chars are [A-Za-z0-9_-] only, so
            # '|' is a safe sed delimiter.
            sed "s|__AGENTGATEWAY_API_KEY__|${AGENTGATEWAY_API_KEY}|g" /tmp/config.yaml > /opt/data/config.yaml
            mkdir -p /opt/data/workspace /opt/data/plugins
            # Plugins come from the synced swibrow/hermes tree.
            plugin=/opt/data/plugins/memini
            if [ -d "$plugin" ] && [ ! -L "$plugin" ]; then rmdir "$plugin"; fi
            ln -sfn /opt/hermes-repo/current/plugins/memini "$plugin"
            chown -R 10000:10000 /opt/data/config.yaml /opt/data/workspace
      # The Claude subscription provider plugin drives the official Claude Code
      # CLI, which the hermes image does not ship. Both land on the PVC and are
      # only refetched when the pinned versions change.
      claude-code:
        dependsOn: init
        image:
          repository: nousresearch/hermes-agent
          tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
        env:
          HOME: /opt/data
          CLAUDE_CODE_VERSION: 2.1.285
          PLUGIN_REF: 31b591fd04737a7807183f3d7f3d389b19f94687
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            prefix=/opt/data/.npm-global
            if [ "$("$prefix/bin/claude" --version 2>/dev/null | cut -d' ' -f1)" != "$CLAUDE_CODE_VERSION" ]; then
              npm install -g --prefix "$prefix" "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
            fi
            plugin=/opt/data/plugins/claude-subscription-directsdk-experimental
            if [ "$(git -C "$plugin" rev-parse HEAD 2>/dev/null)" != "$PLUGIN_REF" ]; then
              rm -rf "$plugin"
              git clone -q https://github.com/NousResearch/hermes-plugin-claude-subscription-directsdk "$plugin"
              git -C "$plugin" checkout -q "$PLUGIN_REF"
            fi
    containers:
      app:
        image: &image
          repository: nousresearch/hermes-agent
          tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
        args: ["gateway", "run"]
        env:
          MEMINI_BASE_URL: http://memini.ai:8080
          # Share this string across agents (e.g. this Claude Code session) to
          # share one memory namespace, or give hermes its own to keep its
          # captured turns separate.
          MEMINI_NAMESPACE: hermes
          MEMINI_API_KEY:
            valueFrom:
              secretKeyRef:
                name: hermes
                key: MEMINI_API_KEY
          HERMES_HOME: /opt/data
          HOME: /opt/data
          TZ: Europe/Zurich
          CLAUDE_SUBSCRIPTION_DIRECTSDK_COMMAND: /opt/data/.npm-global/bin/claude
        envFrom:
          - secretRef:
              name: hermes
        resources:
          requests:
            cpu: 14m
            memory: 167Mi
          limits:
            memory: 2Gi
        ports:
          - containerPort: &port 8642
            name: http
            protocol: TCP
      dashboard:
        image: *image
        args: ["dashboard", "--host", "0.0.0.0", "--insecure"]
        env:
          TZ: Europe/Zurich
          GATEWAY_HEALTH_URL: http://localhost:8642
          HERMES_HOME: /opt/data
          HOME: /opt/data
          HERMES_DASHBOARD_OIDC_ISSUER: https://idm.wibrow.dev/oauth2/openid/hermes
          HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes
          # Envoy Gateway terminates TLS upstream; without this hermes builds the
          # OAuth callback URL from the (plain-HTTP) request it actually receives,
          # so the redirect_uri sent to Kanidm is http:// and gets rejected as a
          # mismatch against the registered https:// redirect URL.
          HERMES_DASHBOARD_PUBLIC_URL: https://hermes.wibrow.dev
        envFrom:
          - secretRef:
              name: hermes
        resources:
          requests:
            cpu: 15m
            memory: 144Mi
          limits:
            memory: 1Gi
        ports:
          - containerPort: &dashboardPort 9119
            name: http
            protocol: TCP
      codeserver:
        image:
          repository: ghcr.io/coder/code-server
          tag: 4.140.0@sha256:1c9ad972a78450f430155144110da4c02d3627c72a598e9197e2781fb9f92e28
        args:
          - --auth
          - none
          - --user-data-dir
          - /home/node/.vscode
          - --extensions-dir
          - /home/node/.vscode
          - --port
          - "12321"
          - /opt/data
        env:
          TZ: Europe/Zurich
        resources:
          requests:
            cpu: 10m
            memory: 72Mi
          limits:
            memory: 1Gi
        ports:
          - containerPort: &codeserverPort 12321
            name: codeserver
            protocol: TCP

service:
  app:
    controller: hermes
    ports:
      http:
        port: *port
      codeserver:
        port: *codeserverPort
  dashboard:
    controller: hermes
    ports:
      http:
        port: *dashboardPort

route:
  app:
    hostnames:
      - hermes.wibrow.dev
    parentRefs:
      - name: envoy-internal
        namespace: networking
        sectionName: https
    rules:
      - backendRefs:
          - identifier: dashboard
            port: http
  codeserver:
    hostnames:
      - hermes-code.wibrow.dev
    parentRefs:
      - name: envoy-internal
        namespace: networking
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: codeserver

persistence:
  config:
    existingClaim: hermes
    globalMounts:
      - path: /opt/data
  configmap:
    type: configMap
    name: hermes-config
    defaultMode: 0755
    globalMounts:
      - path: /tmp/config.yaml
        subPath: config.yaml
  hermes-repo:
    type: emptyDir
    globalMounts:
      - path: /opt/hermes-repo
  git-sync-key:
    type: secret
    name: hermes-git-sync
    defaultMode: 0400
    advancedMounts:
      hermes:
        git-sync:
          - path: /etc/git-secret/ssh
            subPath: ssh
  git-sync-config:
    type: configMap
    name: hermes-git-sync
    defaultMode: 0755
    advancedMounts:
      hermes:
        git-sync:
          - path: /etc/git-secret/known_hosts
            subPath: known_hosts
          - path: /etc/git-sync/exechook.sh
            subPath: exechook.sh
