---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - externalsecret.yaml
  - externalsecret-google.yaml
  - generator-github.yaml
components:
  - ../../../../components/pvc
  - ../../../../components/kopiur
configMapGenerator:
  - name: hermes-config
    options:
      disableNameSuffixHash: true
    files:
      - config.yaml=config.yaml
  - name: hermes-git-sync
    options:
      disableNameSuffixHash: true
    files:
      - known_hosts=known_hosts
      - exechook.sh=git-sync-hook.sh
      - data-sync.sh=data-sync.sh
      - git-credential-github=git-credential-github
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=hermes-pvc
      - CLAIM_NAME=hermes
      - STORAGE_SIZE=5Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=hermes-kopiur
      - CLAIM_NAME=hermes
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.3.0
    releaseName: hermes
    namespace: ai
    valuesFile: values.yaml
