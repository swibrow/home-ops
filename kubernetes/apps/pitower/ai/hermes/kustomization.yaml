---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - externalsecret.yaml
components:
  - ../../../../components/volsync
  - ../../../../components/kopiur
configMapGenerator:
  - name: hermes-config
    options:
      disableNameSuffixHash: true
    files:
      - config.yaml=config.yaml
  - name: hermes-memini-plugin
    options:
      disableNameSuffixHash: true
    files:
      - __init__.py=plugin-memini/__init__.py
      - plugin.yaml=plugin-memini/plugin.yaml
  - name: volsync-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=hermes
      - CLAIM_NAME=hermes
      - SECRET_NAME=hermes-volsync
      - STORAGE_SIZE=5Gi
      - RESTIC_REPO=s3:https://s3.eu-central-2.amazonaws.com/pitower-volsync-backups/ai/hermes
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=hermes-kopiur
      - CLAIM_NAME=hermes
patches:
  # hermes writes its data as uid 10000 (top-level dir is 0700); the kopiur mover must match to read it.
  - target:
      kind: SnapshotPolicy
      name: hermes-kopiur
    patch: |
      - op: replace
        path: /spec/mover/securityContext/runAsUser
        value: 10000
      - op: replace
        path: /spec/mover/securityContext/runAsGroup
        value: 10000
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.0.1
    releaseName: hermes
    namespace: ai
    valuesFile: values.yaml
