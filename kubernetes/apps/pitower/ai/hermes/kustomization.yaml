---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - externalsecret.yaml
  - externalsecret-integrations.yaml
  - externalsecret-google.yaml
components:
  - ../../../../components/pvc
  - ../../../../components/kopiur
configMapGenerator:
  - name: hermes-config
    options:
      disableNameSuffixHash: true
    files:
      - config.yaml=config.yaml
  - name: hermes-cron
    options:
      disableNameSuffixHash: true
    files:
      - jobs.yaml=cron/jobs.yaml
      - sync.py=cron/sync.py
  - name: hermes-git-sync
    options:
      disableNameSuffixHash: true
    files:
      - known_hosts=known_hosts
      - exechook.sh=git-sync-hook.sh
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=hermes-pvc
      - CLAIM_NAME=hermes
      - STORAGE_SIZE=5Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=hermes-kopiur
      - CLAIM_NAME=hermes
patches:
  # hermes writes its data as uid 10000 (top-level dir is 0700); the kopiur mover must match to read it.
  - target:
      kind: SnapshotPolicy
      name: hermes-kopiur
    patch: |
      - op: replace
        path: /spec/mover/securityContext/runAsUser
        value: 10000
      - op: replace
        path: /spec/mover/securityContext/runAsGroup
        value: 10000
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.2.1
    releaseName: hermes
    namespace: ai
    valuesFile: values.yaml
