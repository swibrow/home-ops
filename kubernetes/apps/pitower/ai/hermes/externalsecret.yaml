---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    # Model provider: routed through agentgateway (ai/agentgateway), not
    # api.anthropic.com directly — this is hermes's gateway client key.
    - secretKey: AGENTGATEWAY_API_KEY
      remoteRef:
        key: /ai/agentgateway/HERMES_API_KEY
    # Claude Max long-lived token from `claude setup-token`, forwarded by
    # agentgateway's *-max models. Not named CLAUDE_CODE_OAUTH_TOKEN so hermes
    # does not also pick it up for a direct api.anthropic.com route.
    - secretKey: CLAUDE_OAUTH_TOKEN
      remoteRef:
        key: /ai/hermes/CLAUDE_OAUTH_TOKEN
    # Bearer used by the memini plugin; MUST match memini's own MEMINI_API_KEY
    # (kubernetes/apps/pitower/ai/memini/externalsecret.yaml) since that's the
    # token the memini service itself validates against.
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: /ai/memini/MEMINI_API_KEY
    # Telegram chat interface.
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: /ai/hermes/TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_ALLOWED_USERS
      remoteRef:
        key: /ai/hermes/TELEGRAM_ALLOWED_USERS
    # Dashboard Kanidm OAuth2 client (self-hosted OIDC provider).
    - secretKey: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
      remoteRef:
        key: /ai/hermes/HERMES_DASHBOARD_OIDC_CLIENT_SECRET
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes-git-sync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    # Read-only deploy key on swibrow/hermes. Kept out of the `hermes` secret,
    # which is envFrom'd into the agent.
    - secretKey: ssh
      remoteRef:
        key: /ai/hermes/GIT_SYNC_SSH_KEY
