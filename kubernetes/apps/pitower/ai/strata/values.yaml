---
controllers:
  strata:
    annotations:
      reloader.stakater.com/auto: "true"
    # KEDA owns the replica count; a rendered value would scale it up on every sync.
    replicas: null
    # One GPU on the node: a rolling update's new pod could never get the claim.
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/swibrow/strata
          tag: v0.1.39
        env:
          FAMILY: qwen
          MODEL: IQ2_XS
          CONTEXT: "131072"
          VISION: "no"
          # setup.py sizes from /proc/meminfo (the node's 64 GB), not the
          # container limit, so the low-RAM mode has to be asked for. With the
          # 24 GB card it picks the resident variant: the experts the GPU does
          # not hold (~16-18 GB) are copied into RAM, nothing read from disk.
          LOW_RAM: "on"
          TZ: Europe/Zurich
        envFrom:
          - secretRef:
              name: strata
        resources:
          requests:
            cpu: "8"
            memory: 24Gi
          limits:
            memory: 56Gi
          claims:
            - name: gpu
        securityContext:
          capabilities:
            # mlock past the 8 MiB RLIMIT_MEMLOCK pods get on Talos.
            add:
              - IPC_LOCK
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              # The first start downloads ~70 GB and builds the pack before
              # the port opens; later starts take 1-3 minutes.
              periodSeconds: 10
              failureThreshold: 1080
defaultPodOptions:
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: strata-gpu
  nodeSelector:
    feature.node.kubernetes.io/nvidia-gpu: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
service:
  app:
    ports:
      http:
        port: 8080
persistence:
  # The llmkube shared model cache on ai-01's NVMe; see
  # llmkube/llmkube-operator/values.yaml.
  data:
    existingClaim: llmkube-model-cache
    globalMounts:
      - path: /data
        subPath: strata
route:
  app:
    enabled: true
    annotations:
      # Gatus probes would wake the pod and keep it on the GPU.
      gatus.home-operations.com/enabled: "false"
    hostnames:
      - strata.wibrow.dev
    parentRefs:
      - name: envoy-internal
        namespace: networking
        sectionName: https
    rules:
      - backendRefs:
          - name: keda-add-ons-http-interceptor-proxy
            namespace: system
            port: 8080
        # Envoy's 15s default cuts off a streamed answer mid-generation.
        timeouts:
          request: 0s
