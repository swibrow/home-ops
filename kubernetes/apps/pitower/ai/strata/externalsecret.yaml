---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name strata
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    # Recorded into the model's config on the first setup pass; changing it
    # later needs one start with REINSTALL=1.
    - secretKey: API_KEY
      remoteRef:
        key: /ai/strata/API_KEY
