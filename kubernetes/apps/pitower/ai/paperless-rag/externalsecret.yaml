---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-rag
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    # Paperless REST token (Paperless > profile > API auth token). The job
    # only reads documents.
    - secretKey: PAPERLESS_TOKEN
      remoteRef:
        key: /ai/paperless-rag/PAPERLESS_TOKEN
    # Open-WebUI API key of an admin user (Settings > Account > API keys;
    # needs "API keys" enabled under Admin > Settings > General). The
    # knowledge base and workspace model are owned by, and private to, that
    # user.
    - secretKey: OPEN_WEBUI_API_KEY
      remoteRef:
        key: /ai/paperless-rag/OPEN_WEBUI_API_KEY
    # Handed to Open-WebUI as its RAG embedding credential for LiteLLM, the
    # same master key open-webui already uses for chat completions.
    - secretKey: EMBEDDING_API_KEY
      remoteRef:
        key: /ai/litellm/LITELLM_MASTER_KEY
