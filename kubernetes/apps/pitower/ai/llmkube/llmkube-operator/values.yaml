---
# The webhook chart templates self-generate a serving cert via `lookup`, which
# is a no-op under kustomize's `helm template` rendering - every render would
# mint a fresh cert and keep the app permanently out of sync. CRs are still
# schema-validated by the CRDs; run with the admission webhook off.
webhook:
  enabled: false

# Weights cache on ai-01's 2TB NVMe via openebs-hostpath-models. The taint is
# not an obstacle: the localpv provisioner copies the target node's taints onto
# its helper pods, so dynamic provisioning schedules fine behind
# dedicated=gpu:NoSchedule.
#
# `enabled` must stay true for any caching at all. With it false the chart
# renders `--model-cache-path=`, which disables the cache subsystem wholesale -
# including a per-InferenceService spec.modelCache.claimName, which the operator
# then rejects with a ModelCacheClaimIgnored event and serves from an emptyDir
# that re-downloads every weight on every pod restart.
#
# shared: one `llmkube-model-cache` PVC for every InferenceService, and ComfyUI
# mounts it too (subPath comfyui). RWO is per node, not per pod, and every
# consumer runs on ai-01, so they all mount it at once.
#
# The chart mounts the shared PVC into the controller-manager as well. Off
# ai-01 that pod would become the WaitForFirstConsumer PVC's first consumer and
# pin the hostpath to a node with no /var/mnt/models, so it is pinned to ai-01
# below.
modelCache:
  enabled: true
  mode: shared
  storageClass: openebs-hostpath-models
  # One XFS project quota (a hard limit) for all models; half the 2TB disk,
  # leaving room for the omarchy VM disk on the same volume.
  size: 1Ti

controllerManager:
  nodeSelector:
    feature.node.kubernetes.io/nvidia-gpu: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule

prometheus:
  inferencePodMonitor:
    enabled: true

  # GPU alerts read DCGM_FI_DEV_* from apps/pitower/system/dcgm-exporter. The
  # inference group (InferenceServiceDown, ControllerDown, + recording rules)
  # is a separate call on what should page and stays off here.
  prometheusRule:
    enabled: true
    rules:
      gpu:
        enabled: true
        # 3090 Ti: 450W TGP, so the chart's 250W default fires on every
        # sustained inference run. Alert only above the card's own ceiling.
        powerLimitThreshold: 460
        # A pegged GPU is the design point of a dedicated inference host, not
        # an incident. The chart has no per-alert toggle, so the threshold is
        # the only mute available for GPUHighUtilization - and the schema caps
        # it at 100, which the `> threshold` expr can never exceed on a 0-100
        # gauge. Temperature and power still catch a card in actual trouble.
        highUtilizationThreshold: 100
      inference:
        enabled: false
