---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai

# Wave 0: CRDs (shipped in the chart's templates/) + controller install ahead
# of the Model/InferenceService CRs (llmkube-models, wave 1).
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

helmCharts:
  - name: llmkube
    repo: oci://ghcr.io/defilantech/charts
    version: 0.10.11
    releaseName: llmkube
    namespace: ai
    valuesFile: values.yaml

# The router's /metrics needs ?model=, so scraping it here only 400s and fires
# TargetDown; llmkube-models/llama-router-metrics.yaml scrapes it instead. The
# chart has no selector value.
patches:
  - target:
      kind: PodMonitor
      name: llmkube-inference
    patch: |-
      - op: add
        path: /spec/selector/matchExpressions/-
        value:
          key: inference.llmkube.dev/runtime
          operator: NotIn
          values: [llamacpp-router]
