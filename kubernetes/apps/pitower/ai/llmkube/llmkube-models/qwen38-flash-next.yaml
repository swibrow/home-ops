---
# Qwen3.8-Flash-Next (Qwen Community License 1.0, released 2026-08-26): 125B
# MoE, 6B active per token, plus a 51B n-gram embedding table; multimodal,
# 262K native context; preview of the Qwen4 architecture (ggml arch qwen4exp,
# in llama.cpp since b10660). Far too big for the 3090 Ti's VRAM, so it runs
# as a hybrid GPU/CPU split with Unsloth's UD-IQ4_XS dynamic quant (93.7 GB on
# disk) on bare-metal ai-01 (64 GB, 16 threads, RTX 3090 Ti). Layout from the
# GGUF tensor headers (IQ4_XS routed experts ~1.24 GB/layer):
#
#   GPU (24 GB, 22.4 GB used / 1.7 GB free measured):
#     routed experts, layers 37-47                      ~13.6 GB  --n-cpu-moe 37
#     attention / DeltaNet / dense / norms              ~3.5 GB
#     token_embd + output                               ~1.0 GB
#     mmproj (F16) vision projector                     ~0.9 GB
#     KV cache 128K @q8_0 (12 sparse-attn layers)       ~1.6 GB
#     CUDA/compute buffers                              ~2   GB
#   CPU (mmap, page cache inside the 56Gi limit):
#     routed experts, layers 0-36                       ~45.9 GB
#     n-gram table per_layer_token_embd (IQ4_NL)        ~28.8 GB  sparse row
#                                                                 lookups
#
# Measured 2026-09-26 (llama-server /completion timings, 128K ctx, 3,256-token
# prompt, 512 generated tokens, warm): ~28 tok/s generation, ~280 tok/s prompt
# processing, no reads from the models disk once warm. A cold start pages
# ~16 GB of experts in from the 9100 Pro first (~165 tok/s prompt processing).
# --n-cpu-moe 38 measured 27.6 tok/s / 280 tok/s, so one layer more or less on
# the GPU barely matters; the CPU side dominates.
# UD-IQ3_XXS for comparison (old Proxmox VM, 48 GiB, --n-cpu-moe 36): ~30 tok/s
# generation, ~410 tok/s prompt processing on a 2.9K-token prompt. IQ4_XS
# trades ~7% generation and ~30% prompt processing for 4-bit quality.
#
# Three-shard GGUF: llama-router.yaml points at 00001 under
# router/qwen38-flash-next/ on the model cache PVC, and the split loader finds
# 00002/00003 next to it.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-flash-next
spec:
  source: hf://unsloth/Qwen3.8-Flash-Next-GGUF
  files:
    - UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
    - UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00002-of-00003.gguf
    - UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00003-of-00003.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: IQ4_XS
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-gpu
      # Renders --n-gpu-layers 99; which experts stay on the CPU is decided by
      # moeCPULayers / tensorOverrides on the InferenceService, not here.
      layers: -1
  # Downloader/staging init container.
  resources:
    cpu: "2"
    memory: "4Gi"
