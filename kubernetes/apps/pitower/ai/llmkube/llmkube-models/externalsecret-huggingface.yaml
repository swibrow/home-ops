---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Hugging Face read token for gated GGUF repos, consumed by Model
# spec.sourceSecretRef (llmkube reads the HF_TOKEN key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name huggingface
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: /ai/huggingface/HF_TOKEN
