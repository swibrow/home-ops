---
# Model weight cache on ai-01's 2TB Samsung 9100 Pro (Talos UserVolumeConfig
# `models`, mounted at /var/mnt/models - see talos/pitower/node/ai-01).
#
# Static PV rather than an openebs-hostpath class: OpenEBS localpv provisions
# through a helper pod pinned to the target node, and ai-01's
# dedicated=gpu:NoSchedule taint blocks that pod, leaving the PVC forever
# Pending. A pre-bound hostPath PV needs no provisioner. Weights land under
# <cacheKey>/ subdirectories, so multiple Models share this one claim.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llmkube-models-ai-01
spec:
  capacity:
    storage: 1500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: llmkube-models
  hostPath:
    path: /var/mnt/models/llmkube
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ai-01
---
# storageClassName names no StorageClass object on purpose: it only pairs this
# claim with the static PV above, and keeps the name free for a future dynamic
# openebs-hostpath-models class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llmkube-models
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: llmkube-models
  volumeName: llmkube-models-ai-01
  resources:
    requests:
      storage: 1500Gi
