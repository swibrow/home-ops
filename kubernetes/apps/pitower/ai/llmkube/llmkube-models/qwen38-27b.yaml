---
# Qwen3.8-27B (Apache 2.0, released 2026-08-14): 27.78B dense multimodal,
# 262K native context. Sized for ai-01's single RTX 3090 Ti (24GB):
#
#   UD-Q4_K_M weights   ~16.5 GB  (Unsloth dynamic quant - the recommended
#                                  quality/size point for 24GB cards; official
#                                  FP8 is 28.76GiB and doesn't fit, and Ampere
#                                  has no FP8 kernels anyway)
#   mmproj (F16)         ~1   GB  vision projector - image/video input
#   KV cache 64K @q8_0   ~2   GB  (f16 would be ~4GB)
#   CUDA/compute buffers ~2-3 GB
#                        -------
#                        ~22 GB
#
# Served by llama-router.yaml from router/qwen38-27b/ on the model cache PVC.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-27b
spec:
  source: hf://unsloth/Qwen3.8-27B-GGUF
  files:
    - Qwen3.8-27B-UD-Q4_K_M.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-gpu
      layers: -1
  # Downloader/staging init container.
  resources:
    cpu: "2"
    memory: "4Gi"
