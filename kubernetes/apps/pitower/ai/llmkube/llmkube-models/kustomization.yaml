---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai

# Wave 1: Model/InferenceService CRs after the operator + CRDs (wave 0).
commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"

resources:
  - resourceclaimtemplate.yaml
  - resourceclaim-shared.yaml
  - externalsecret-huggingface.yaml
  - externalsecret-models.yaml
  - llama-router.yaml
  - llama-router-metrics.yaml
  - qwen38-27b.yaml
  - qwen38-27b-abliterated.yaml
  - qwen38-flash-next.yaml
  - qwen38-flash-next-uncensored.yaml
  - qwen3-embedding.yaml
  - style-gemma4.yaml
  - strands-decider.yaml
  - strands-decider-autoscale.yaml

# The router's volume references the ConfigMap by name, which kustomize does
# not rewrite inside the InferenceService.
configMapGenerator:
  - name: llama-router-templates
    files:
      - templates/qwen38-27b-abliterated.jinja
    options:
      disableNameSuffixHash: true
  - name: llama-router-metrics
    files:
      - llama-router-metrics/exporter.py
