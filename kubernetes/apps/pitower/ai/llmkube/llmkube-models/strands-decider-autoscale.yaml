---
# Scale-to-zero, same as qwen38-27b-autoscale.yaml (see there for the
# interceptor alias and why KEDA targets the InferenceService). Only 4.4 GB of
# VRAM, but gpu-shared pins the 3090 Ti while any pod holds it, which keeps the
# llmkube-gpu services and the omarchy VM off the card.
#
# In-cluster callers: strands-decider-scaled.ai.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: strands-decider-scaled
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.system.svc.cluster.local
---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: strands-decider
spec:
  target:
    service: strands-decider
    port: 8080
  rules:
    - hosts:
        - strands-decider-scaled.ai.svc.cluster.local
        - strands-decider-scaled.ai.svc.cluster.local:8080
        - strands-decider-scaled.ai
        - strands-decider-scaled
  # The server batches concurrent questions itself.
  scalingMetric:
    concurrency:
      targetValue: 8
  timeouts:
    readiness: 300s
    responseHeader: 120s
    request: 0s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: strands-decider
spec:
  scaleTargetRef:
    name: strands-decider
    kind: InferenceService
    apiVersion: inference.llmkube.dev/v1alpha1
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 900
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.system:9090
        interceptorRoute: strands-decider
