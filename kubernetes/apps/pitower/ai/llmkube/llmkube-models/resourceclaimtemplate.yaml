---
# One whole RTX 3090 Ti per inference pod, through the NVIDIA DRA driver
# (system/dra-driver-nvidia-gpu). Referenced from each GPU Model's
# hardware.gpu.resourceClaims; the claim is created per pod and released with it.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: llmkube-gpu
  annotations:
    # spec is immutable; Argo recreates the template on a change instead.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            allocationMode: ExactCount
            count: 1
            # Keeps these off the RTX PRO 4000, which is reserved for one model.
            selectors:
              - cel:
                  expression: device.attributes['gpu.nvidia.com'].productName == 'NVIDIA GeForce RTX 3090 Ti'
---
# The whole RTX PRO 4000 Blackwell, reserved for qwen38-27b-abliterated.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: llmkube-gpu-pro4000
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            allocationMode: ExactCount
            count: 1
            selectors:
              - cel:
                  expression: device.attributes['gpu.nvidia.com'].productName == 'NVIDIA RTX PRO 4000 Blackwell'
