---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Garage key `models` (read/write on the `models` bucket) for Model
# spec.sourceSecretRef on s3:// sources. llmkube signs a path-style request to
# <AWS_ENDPOINT_URL>/<bucket>/<key>.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name garage-models
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        # Must match `s3_region` in system/garage/garage.toml.
        AWS_REGION: garage
        AWS_ENDPOINT_URL: https://s3.wibrow.dev
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /ai/models/AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /ai/models/AWS_SECRET_ACCESS_KEY
