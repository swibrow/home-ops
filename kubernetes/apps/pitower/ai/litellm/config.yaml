# LiteLLM proxy config — hosted providers + in-cluster GPU inference.
# Provider keys are injected as env vars from the `litellm` secret
# (Infisical /ai/litellm/*). LITELLM_MASTER_KEY + DATABASE_URL are read
# from the environment automatically and are not referenced here.
model_list:
  # --- Anthropic (via OpenRouter) ---
  - model_name: claude-opus
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.8
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: claude-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.6
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: claude-haiku
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: claude-fable
    litellm_params:
      model: openrouter/anthropic/claude-fable-5
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Claude Code Max subscription (direct Anthropic, OAuth forwarded) ---
  # One pinned entry per model, no router: Claude Code sets ANTHROPIC_MODEL to
  # exactly one of these, so a conversation never switches model mid-flight and
  # the prompt cache survives. Routing across tiers is what breaks that, and it
  # also walks into litellm#26224 (complexity_router 400s on thinking.type=adaptive).
  #
  # No api_key: Claude Code authenticates to LiteLLM with x-litellm-api-key and
  # carries its own sub OAuth token (sk-ant-oat*) in Authorization. clean_headers()
  # preserves that header and add_provider_specific_headers_to_request() forwards it
  # to anthropic/bedrock/vertex_ai only, so it never reaches OpenRouter. Needs no
  # forward_client_headers_to_llm_api on v1.95.0 despite what the tutorial says.
  # The client must NOT set ANTHROPIC_AUTH_TOKEN/ANTHROPIC_API_KEY: per Anthropic's
  # gateway docs a credential variable replaces the subscription login and moves
  # billing to that credential. The virtual key rides in ANTHROPIC_CUSTOM_HEADERS.
  # Any client WITHOUT an OAuth token silently falls back to the ANTHROPIC_API_KEY
  # in the litellm secret and bills the API account instead of the subscription.
  - model_name: claude-haiku-max
    litellm_params:
      model: anthropic/claude-haiku-4-5
  - model_name: claude-sonnet-max
    litellm_params:
      model: anthropic/claude-sonnet-5
  - model_name: claude-opus-max
    litellm_params:
      model: anthropic/claude-opus-5
  # Fable rejects thinking:{type:disabled} and assistant prefill with a 400, and
  # is unavailable to orgs below 30-day data retention. drop_params handles the
  # first; the rest surface as errors rather than silently downgrading.
  - model_name: claude-fable-max
    litellm_params:
      model: anthropic/claude-fable-5

  # --- Embeddings (memini) ---
  - model_name: memini-embed
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # --- Local GPU (vast.ai, ephemeral) ---
  # vLLM behind vast.ai's Instance Portal Caddy proxy, published over a
  # Cloudflare *quick* tunnel. Two things make this deliberately throwaway:
  # the trycloudflare hostname is regenerated every time cloudflared restarts,
  # and the rental itself is short-lived. When either ends this entry starts
  # returning connection errors — delete it rather than debugging it.
  # The portal accepts `Authorization: Bearer $OPEN_BUTTON_TOKEN`, which is
  # exactly what the openai/ provider sends, so api_key carries the portal
  # token and no extra_headers are needed.
  # Qwen3.8 is a reasoning model: it spends output tokens in message.reasoning
  # before emitting content, so low max_tokens returns content:null with
  # finish_reason:length. Callers need a few hundred tokens of headroom.
  # Serving AWQ-INT4 on 2x RTX 3090 — Ampere has no FP8 tensor cores, and the
  # 24 GB instance disk is smaller than the 28.7 GiB official FP8 checkpoint,
  # so INT4 is the only variant that fits at all.
  # `model` must match vLLM's --served-model-name or every call 404s.
  # NOT a shared backend: --max-num-seqs 2, because the hybrid Gated DeltaNet
  # layers hold a fixed recurrent state per sequence regardless of context
  # length. Concurrent callers queue rather than run in parallel.
  - model_name: vast-local
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: https://scale-wife-lancaster-defensive.trycloudflare.com/v1
      api_key: os.environ/VAST_PORTAL_TOKEN

  # --- Local GPU (ai-01, llmkube) ---
  # Qwen3.8-27B UD-Q4_K_M on the RTX 3090 Ti, served by llama.cpp via the
  # llmkube InferenceService (kubernetes/apps/pitower/ai/llmkube). 64K
  # context, vision enabled, tool calling via --jinja. `qwen3.8-27b` is
  # already the OpenRouter alias for the same weights, hence the -local name.
  # llama-server has no auth and ignores the model field; the dummy api_key
  # only satisfies the openai/ provider's client constructor.
  # Reasoning model: thinking is on by default and billed as output tokens
  # before content appears, so callers need max_tokens headroom (low values
  # return content:null with finish_reason:length).
  # Single slot (parallelSlots: 1): concurrent requests queue server-side.
  - model_name: qwen3.8-27b-local
    litellm_params:
      model: openai/qwen38-27b
      api_base: http://qwen38-27b.ai.svc.cluster.local:8080/v1
      api_key: local

  # --- OpenRouter (named aliases, auto-curated from the live catalog) ---
  # Newest ~5 chat models per major provider so they show in the dropdown.
