---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - externalsecret.yaml
  - httproute.yaml
helmCharts:
  - name: phoenix-helm
    repo: oci://registry-1.docker.io/arizephoenix
    version: 11.0.7
    releaseName: phoenix
    namespace: ai
    valuesFile: values.yaml
# Held at zero while the phoenix database moves into the shared `ai` CNPG
# cluster: the dump has to run against a quiesced source. Removed in the commit
# that flips database.postgres.host.
#
# This is a patch rather than `replicaCount: 0` in values.yaml because the chart
# renders `{{ .Values.replicaCount | default 1 }}`, and Helm's `default` treats 0
# as empty — the value would silently come back out as 1.
patches:
  - target:
      kind: Deployment
      name: phoenix
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
