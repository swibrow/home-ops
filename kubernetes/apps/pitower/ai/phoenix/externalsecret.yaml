---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phoenix
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: phoenix-secret
  data:
    - secretKey: PHOENIX_SECRET
      remoteRef:
        key: /ai/phoenix/PHOENIX_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: PHOENIX_ADMIN_SECRET
      remoteRef:
        key: /ai/phoenix/PHOENIX_ADMIN_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# phoenix is a tenant of the shared `ai` cluster in `database`, so its credential
# is the hand-authored ai-phoenix tenant secret over there (see
# database/tenants/phoenix.yaml), pulled across by the namespace-scoped store.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phoenix-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: cnpg-secrets-database
  target:
    name: phoenix-db-secret
    template:
      type: Opaque
      data:
        PHOENIX_POSTGRES_PASSWORD: '{{ index . "password" }}'
  dataFrom:
    - extract:
        key: ai-phoenix
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
