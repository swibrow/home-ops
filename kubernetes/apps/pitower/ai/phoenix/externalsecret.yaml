---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phoenix
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: phoenix-secret
  data:
    - secretKey: PHOENIX_SECRET
      remoteRef:
        key: /ai/phoenix/PHOENIX_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: PHOENIX_ADMIN_SECRET
      remoteRef:
        key: /ai/phoenix/PHOENIX_ADMIN_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
      remoteRef:
        key: /ai/phoenix/PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# The CNPG cluster lives in `database`, so its generated phoenix-app secret is
# pulled across via the namespace-scoped store rather than the `cnpg-secrets` one.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phoenix-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: cnpg-secrets-database
  target:
    name: phoenix-db-secret
    template:
      type: Opaque
      data:
        PHOENIX_POSTGRES_PASSWORD: '{{ index . "password" }}'
  dataFrom:
    - extract:
        key: phoenix-app
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
