---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    # Bearer token for memini's own /v1, /mcp, and admin UI.
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: /ai/memini/MEMINI_API_KEY
    # agentgateway client key, the bearer token for the embeddings and chat
    # (consolidation/dedup/rerank) endpoints proxied through agentgateway.
    - secretKey: MEMINI_AGENTGATEWAY_API_KEY
      remoteRef:
        key: /ai/agentgateway/MEMINI_API_KEY
