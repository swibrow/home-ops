controllers:
  searxng:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: docker.io/searxng/searxng
          tag: 2026.9.25-12f8b6515
        env:
          TZ: Europe/Zurich
        envFrom:
          - secretRef:
              name: searxng
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 30
              timeoutSeconds: 5
          readiness: *probe
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: searxng
    ports:
      http:
        port: 8080

persistence:
  config:
    type: configMap
    name: searxng-config
    advancedMounts:
      searxng:
        app:
          - path: /etc/searxng/settings.yml
            subPath: settings.yml
            readOnly: true
  cache:
    type: emptyDir
    globalMounts:
      - path: /var/cache/searxng
