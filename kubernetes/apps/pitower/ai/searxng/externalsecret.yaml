---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/generators.external-secrets.io/password_v1alpha1.json
# SearXNG refuses to start with its default secret_key. The key only signs its
# own cookies and nothing outside the pod reads it, so generate it here instead
# of keeping it in Infisical.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: searxng-secret
spec:
  length: 48
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - SEARXNG_SECRET
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng
spec:
  refreshPolicy: CreatedOnce
  target:
    name: searxng
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: searxng-secret
