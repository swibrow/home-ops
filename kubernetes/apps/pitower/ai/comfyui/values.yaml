controllers:
  comfyui:
    annotations:
      reloader.stakater.com/auto: "true"
    # Recreate, not RollingUpdate: the node has exactly one GPU, so a new pod's
    # claim can never be allocated beside the old one and a rolling update
    # would deadlock.
    strategy: Recreate
    initContainers:
      fetch-models:
        image:
          repository: docker.io/curlimages/curl
          tag: 8.22.0
        command:
          - /bin/sh
          - /scripts/fetch-models.sh
    containers:
      app:
        image:
          repository: ghcr.io/cloudsnacks/comfyui
          tag: 0.38.0-1
        args:
          - --listen
          - 0.0.0.0
          - --port
          - "8188"
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            memory: 24Gi
          claims:
            - name: gpu
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              # Torch + CUDA init before the HTTP server binds; the interceptor
              # holds the waking request until this passes.
              failureThreshold: 60
              periodSeconds: 5
defaultPodOptions:
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: comfyui-gpu
  nodeSelector:
    feature.node.kubernetes.io/nvidia-gpu: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    # llmkube's fsGroup: the models volume is the shared llmkube-model-cache,
    # and llama.cpp pods regroup the whole volume to 102 on every start.
    fsGroup: 102
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    ports:
      http:
        port: 8188
persistence:
  # The llmkube shared model cache on ai-01's NVMe; see
  # llmkube/llmkube-operator/values.yaml.
  models:
    existingClaim: llmkube-model-cache
    advancedMounts:
      comfyui:
        fetch-models:
          - path: /models
            subPath: comfyui
        app:
          - path: /opt/comfyui/models
            subPath: comfyui
  data:
    existingClaim: comfyui-data
    advancedMounts:
      comfyui:
        app:
          - path: /opt/comfyui/output
            subPath: output
          - path: /opt/comfyui/input
            subPath: input
          - path: /opt/comfyui/user
            subPath: user
  scripts:
    type: configMap
    name: comfyui-fetch-models
    defaultMode: 0555
    advancedMounts:
      comfyui:
        fetch-models:
          - path: /scripts
  # ComfyUI writes decoded frames here during a render; keep it off the image's
  # read-only-ish layer and out of the replicated volume.
  temp:
    type: emptyDir
    advancedMounts:
      comfyui:
        app:
          - path: /opt/comfyui/temp
route:
  app:
    enabled: true
    annotations:
      # Gatus auto-probes every HTTPRoute every 5m; through the interceptor that
      # counts as a request and wakes the pod, so it never stays scaled to zero.
      gatus.home-operations.com/enabled: "false"
    hostnames:
      - comfyui.wibrow.dev
    parentRefs:
      - name: envoy-internal
        namespace: networking
        sectionName: https
    # Through the KEDA interceptor rather than straight to the Service, so the
    # GPU is released on idle and a request wakes it. Cross-namespace backendRef
    # needs the ReferenceGrant in the system namespace.
    rules:
      - backendRefs:
          - name: keda-add-ons-http-interceptor-proxy
            namespace: system
            port: 8080
