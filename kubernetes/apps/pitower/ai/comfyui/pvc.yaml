---
# Renders and saved workflows are the only irreplaceable data here, so they go
# on replicated ceph rather than node-local disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 50Gi
