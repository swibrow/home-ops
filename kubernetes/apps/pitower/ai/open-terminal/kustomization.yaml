---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - ./externalsecret.yaml
  - ./networkpolicy.yaml
components:
  - ../../../../components/pvc
configMapGenerator:
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=open-terminal-pvc
      - CLAIM_NAME=open-terminal-home
      - STORAGE_SIZE=10Gi
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.2.1
    releaseName: open-terminal
    namespace: ai
    valuesFile: values.yaml
