---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/generators.external-secrets.io/password_v1alpha1.json
# Shared only between this pod and Open-WebUI (same namespace), so generate it
# here instead of keeping it in Infisical.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: open-terminal-api-key
spec:
  length: 48
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - OPEN_TERMINAL_API_KEY
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-terminal
spec:
  refreshPolicy: CreatedOnce
  target:
    name: open-terminal
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: open-terminal-api-key
