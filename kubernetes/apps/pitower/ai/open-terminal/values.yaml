# Sandboxed shell for Open-WebUI (Admin Settings > Integrations > Open Terminal,
# pre-seeded through TERMINAL_SERVER_CONNECTIONS). The full image carries
# Python, Node.js, build tools and passwordless sudo so the model can install
# what it needs at runtime; /home/user persists across restarts.
controllers:
  open-terminal:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/open-webui/open-terminal
          tag: 0.14.7
        env:
          TZ: Europe/Zurich
          # Appended to the run_command tool description. Every byte of output
          # stays in the chat context, and the local models only have 32-128K.
          OPEN_TERMINAL_EXECUTE_DESCRIPTION: >-
            Keep output small: command output goes straight into your limited
            context window. Redirect anything that may exceed a few KB (HTTP
            responses, page HTML, logs, build output, JSON) to a file, e.g.
            `cmd > /tmp/out.txt 2>&1; wc -c /tmp/out.txt; head -c 2000 /tmp/out.txt`,
            then inspect it with grep_search or read_file with start_line/end_line.
            Use `curl -sS -o file` rather than printing response bodies, and
            add `| head -n 50` or `| tail -n 50` to commands that list or log.
        envFrom:
          - secretRef:
              name: open-terminal
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8000
              initialDelaySeconds: 10
              periodSeconds: 30
          readiness: *probe
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 4Gi

service:
  app:
    controller: open-terminal
    ports:
      http:
        port: 8000

persistence:
  home:
    existingClaim: open-terminal-home
    globalMounts:
      - path: /home/user
