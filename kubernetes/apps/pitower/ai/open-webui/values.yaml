controllers:
  open-webui:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/open-webui/open-webui
          tag: v0.11.0
        env:
          # Application
          WEBUI_URL: "https://chat.wibrow.dev"
          TZ: Europe/Zurich
          PORT: "8080"
          # Model backend — litellm (OpenAI-compatible), Ollama disabled
          ENABLE_OPENAI_API: "true"
          OPENAI_API_BASE_URL: "http://litellm:4000/v1"
          ENABLE_OLLAMA_API: "false"
          # Auth — Kanidm OIDC only (local login form disabled)
          WEBUI_AUTH: "true"
          ENABLE_LOGIN_FORM: "false"
          ENABLE_OAUTH_SIGNUP: "true"
          OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
          OAUTH_PROVIDER_NAME: Kanidm
          OAUTH_CLIENT_ID: open-webui
          OPENID_PROVIDER_URL: "https://idm.wibrow.dev/oauth2/openid/open-webui/.well-known/openid-configuration"
          OAUTH_SCOPES: "openid email profile groups"
          # Kanidm requires PKCE — Open-WebUI omits it unless this is set.
          OAUTH_CODE_CHALLENGE_METHOD: "S256"
          # Group-based role management (Kanidm groups arrive in the `groups` claim)
          ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
          OAUTH_ROLES_CLAIM: groups
          OAUTH_ALLOWED_ROLES: "apps@idm.wibrow.dev,admins@idm.wibrow.dev"
          OAUTH_ADMIN_ROLES: "admins@idm.wibrow.dev"
          # Database — CNPG
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: open-webui-db-secret
                key: DB_URL
          # RAG vector store: pgvector in the same database (PGVECTOR_DB_URL
          # defaults to DATABASE_URL). The ai cluster ships pgvector for memini
          # and the open_webui tenant declares the extension; nothing was ever
          # indexed in the default Chroma store on the PVC.
          VECTOR_DB: pgvector
          # Column width is fixed when document_chunk is first created and a
          # later mismatch aborts startup. 1024 = Qwen3-Embedding-0.6B
          # (qwen3-embedding-local via LiteLLM). Engine/model themselves are
          # persisted config, so the paperless-rag sync job sets them through
          # the admin API rather than env.
          PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH: "1024"
          PGVECTOR_INDEX_METHOD: hnsw
        envFrom:
          - secretRef:
              name: open-webui
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 6
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 30
        resources:
          requests:
            cpu: 27m
            memory: 1Gi
          limits:
            memory: 4Gi

service:
  app:
    controller: open-webui
    ports:
      http:
        port: 8080

route:
  app:
    hostnames:
      - chat.wibrow.dev
    parentRefs:
      - name: envoy-external
        namespace: networking
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: 8080

persistence:
  data:
    existingClaim: open-webui-data
    advancedMounts:
      open-webui:
        app:
          - path: /app/backend/data
