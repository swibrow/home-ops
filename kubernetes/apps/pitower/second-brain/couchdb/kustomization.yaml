---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: second-brain
resources:
  - externalsecret.yaml
components:
  - ../../../../components/pvc
  - ../../../../components/kopiur
configMapGenerator:
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=couchdb-pvc
      - CLAIM_NAME=couchdb-data
      - STORAGE_SIZE=2Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=couchdb-kopiur
      - CLAIM_NAME=couchdb-data
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.3.0
    releaseName: couchdb
    namespace: second-brain
    valuesFile: values.yaml
