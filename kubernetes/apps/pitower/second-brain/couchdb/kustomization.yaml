---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: second-brain
resources:
  - externalsecret.yaml
components:
  - ../../../../components/volsync
  - ../../../../components/kopiur
configMapGenerator:
  - name: volsync-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=couchdb-backup
      - CLAIM_NAME=couchdb-data
      - SECRET_NAME=couchdb-volsync
      - STORAGE_SIZE=2Gi
      - RESTIC_REPO=s3:https://s3.eu-central-2.amazonaws.com/pitower-volsync-backups/second-brain/couchdb
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=couchdb-kopiur
      - CLAIM_NAME=couchdb-data
patches:
  # couchdb runs as uid 568; the kopiur mover must match to read it.
  - target:
      kind: SnapshotPolicy
      name: couchdb-kopiur
    patch: |
      - op: replace
        path: /spec/mover/securityContext/runAsUser
        value: 568
      - op: replace
        path: /spec/mover/securityContext/runAsGroup
        value: 568
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.0.1
    releaseName: couchdb
    namespace: second-brain
    valuesFile: values.yaml
