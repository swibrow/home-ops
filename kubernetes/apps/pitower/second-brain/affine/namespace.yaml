---
apiVersion: v1
kind: Namespace
metadata:
  name: second-brain
  annotations:
    # affine writes its data as uid 0, so its kopiur mover runs as root (see
    # kustomization.yaml); kopiur requires this per-namespace opt-in for an
    # elevated mover.
    kopiur.home-operations.com/privileged-movers: "true"
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
