---
controllers:
  affine:
    # Two pods would run the prisma migration init container concurrently
    # against the same database.
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"

    initContainers:
      # Generates config/private.key on first run and applies prisma + data
      # migrations; the server refuses to start against an unmigrated schema.
      migration:
        image:
          repository: ghcr.io/toeverything/affine
          tag: 0.26.7@sha256:74baac632031260f8c1c8ba34d9734b5addba0b8e72d6d9b9721e39f77738e94
        command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
        env: &env
          TZ: Europe/Zurich
          NODE_ENV: production
          DEPLOYMENT_TYPE: selfhosted
          AFFINE_SERVER_EXTERNAL_URL: https://affine.wibrow.dev
          # Server-side full-text search needs a Manticore instance; off until
          # one exists.
          AFFINE_INDEXER_ENABLED: "false"
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: affine-db-secret
                key: DB_URL
          REDIS_SERVER_HOST: affine-dragonfly.second-brain.svc.cluster.local
          REDIS_SERVER_PORT: "6379"

    containers:
      app:
        image:
          repository: ghcr.io/toeverything/affine
          tag: 0.26.7@sha256:74baac632031260f8c1c8ba34d9734b5addba0b8e72d6d9b9721e39f77738e94
        env: *env
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /info
                port: 3010
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /info
                port: 3010
              periodSeconds: 10
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /info
                port: 3010
              failureThreshold: 30
              periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

defaultPodOptions:
  nodeSelector:
    kubernetes.io/arch: amd64

service:
  app:
    controller: affine
    ports:
      http:
        port: 3010

route:
  app:
    enabled: true
    hostnames:
      - affine.wibrow.dev
    parentRefs:
      - name: envoy-external
        namespace: networking
        sectionName: https

persistence:
  config:
    existingClaim: affine-config
    globalMounts:
      - path: /root/.affine/config
  storage:
    existingClaim: affine-storage
    globalMounts:
      - path: /root/.affine/storage
