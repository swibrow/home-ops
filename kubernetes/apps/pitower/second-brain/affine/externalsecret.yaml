---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: affine-config-secret
    template:
      data:
        # AFFiNE reads /root/.affine/config/config.json at startup and replaces
        # the whole oauth.providers.oidc block with it, so the OIDC client is
        # declared here to keep the client secret out of git. Settings saved in
        # the Admin Panel are applied on top of this file, so leave the OAuth
        # page there untouched or it shadows what is declared here.
        #
        # Kanidm's issuer is per client (bare idm.wibrow.dev 404s), and the
        # scope list must match the client's scope map. Kanidm enforces PKCE
        # S256, which AFFiNE's OIDC provider always sends.
        #
        # In-cluster DNS resolves idm.wibrow.dev to the envoy-external LB IP,
        # which AFFiNE's SSRF guard rejects as a private address unless the
        # issuer origin is explicitly trusted.
        config.json: |
          {
            "oauth": {
              "providers": {
                "oidc": {
                  "clientId": "affine",
                  "clientSecret": {{ .OIDC_CLIENT_SECRET | toJson }},
                  "issuer": "https://idm.wibrow.dev/oauth2/openid/affine",
                  "allowPrivateNetwork": true,
                  "args": {
                    "scope": "openid profile email"
                  }
                }
              }
            }
          }
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /second-brain/affine/OIDC_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
