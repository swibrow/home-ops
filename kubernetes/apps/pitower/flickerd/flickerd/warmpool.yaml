---
# Keeps warm sandbox pods so a claim binds near-instantly instead of waiting on
# image pull + scheduling (the sandbox image is large).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: flickerd
spec:
  replicas: 2
  sandboxTemplateRef:
    name: flickerd
  # Default (OnReplenish) only staleness-checks orphaned Sandboxes, so already-warmed
  # pods keep running an old sandbox image indefinitely after a SandboxTemplate bump.
  # Recreate hash-compares every owned Sandbox against the template each reconcile and
  # replaces drifted ones automatically.
  updateStrategy:
    type: Recreate
