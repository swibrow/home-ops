toolbox:
  enabled: true
  # cephClusterSpec.placement does not cover the toolbox — it is a chart-owned
  # Deployment, not a Rook-managed daemon.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - worker-01
                  - worker-02
                  - worker-03

monitoring:
  enabled: true
  createPrometheusRules: true

ingress:
  dashboard: {}

route:
  dashboard: {}

cephClusterSpec:
  placement:
    # Rook resolves every daemon as all.Merge(<daemon>); Merge REPLACES
    # nodeAffinity and APPENDS tolerations. So `all` covers mgr/osd/prepareosd/
    # cleanup, and any per-daemon block must restate nodeAffinity in full.
    #
    # Safe for OSDs: their deployments are already nodeSelector-pinned to
    # worker-01/02/03, which intersects this list. mgr has no pin and just
    # reschedules.
    all:
      tolerations:
        - key: node-issue
          operator: Equal
          value: "true"
          effect: NoExecute
        - key: dedicated
          operator: Equal
          value: storage
          effect: NoSchedule
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - worker-01
                    - worker-02
                    - worker-03
    # STAGE 2 of 3 — do not collapse this into `all`.
    #
    # Mons are the one daemon that cannot be re-placed in a single step. Each
    # mon deployment is pinned by nodeSelector to the node the canary picked
    # (recorded in the rook-ceph-mon-endpoints mapping), and on update Rook
    # stamps the new nodeAffinity while PRESERVING that nodeSelector
    # (mon.go:1662-1690, the `UseHostNetwork` branch). Narrowing straight to
    # worker-01/02/03 makes all three mons unschedulable at once; startDeployments
    # only re-checks quorum between mons, so it breaks two before stopping — at
    # 1/3, i.e. quorum loss.
    #
    # Each stage evicts exactly ONE mon. Rook parks it as unschedulable, then
    # fails it over onto a node that satisfies this list; the replacement canary
    # carries required host pod-anti-affinity, so it cannot land on a node
    # already running a mon. Confirmed in stage 1: mon-ad@worker-07 was replaced
    # by mon-ae@worker-03.
    #
    #   stage 1 (done):  [01 02 03 05 06] — evicted mon on worker-07
    #   stage 2 (here):  [01 02 03 06]    — evicts mon on worker-05
    #   stage 3:         delete this block — evicts mon on worker-06
    #
    # Wait for HEALTH_OK and 3/3 mons in quorum before advancing a stage.
    # Budget ~45 min: the 2x ROOK_MON_OUT_TIMEOUT countdown starts when the
    # operator logs `marking mon "X" out of quorum`, NOT when the pod goes
    # Pending — the initial reconcile blocks in updateDeploymentAndWait first.
    mon:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - worker-01
                    - worker-02
                    - worker-03
                    - worker-06

  network:
    provider: host

  mon:
    count: 3
  mgr:
    count: 1

  resources:
    # krr: rook-ceph-mgr-a/mgr
    mgr:
      requests:
        cpu: "18m"
        memory: "675Mi"
      limits:
        memory: "2Gi"
    # krr: rook-ceph-mon-aa/mon
    # Shared by mon-aa/ab/ac. Review memory diffs carefully — ceph mons want
    # steady headroom; an average-based request can crowd them under recovery.
    mon:
      requests:
        cpu: "30m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    # krr: rook-ceph-osd-0/osd
    # Shared by osd-0/1/2. Review memory diffs carefully — OSDs grow to
    # osd_memory_target (~4Gi); an average request can OOM them during backfill.
    osd:
      requests:
        cpu: "48m"
        memory: "1Gi"
      limits:
        memory: "6Gi"
    mgr-sidecar:
      requests:
        cpu: "49m"
        memory: "128Mi"
      limits:
        memory: "256Mi"
    # krr: rook-ceph-crashcollector-worker-01/ceph-crash
    crashcollector:
      requests:
        cpu: "15m"
        memory: "7Mi"
      limits:
        memory: "64Mi"
    logcollector:
      requests:
        cpu: "25m"
        memory: "100Mi"
      limits:
        memory: "1Gi"
    cleanup:
      requests:
        cpu: "250m"
        memory: "100Mi"
      limits:
        memory: "1Gi"

  crashCollector:
    disable: false

  dashboard:
    enabled: true
    urlPrefix: /
    ssl: false

  storage:
    useAllNodes: false
    useAllDevices: false
    config:
      osdsPerDevice: "1"
    nodes:
      - name: "worker-01"
        devices:
          - name: "/dev/disk/by-id/ata-SAMSUNG_MZ7PC128HAFU-000L5_S11VNSAD308100"
      - name: "worker-02"
        devices:
          - name: "/dev/disk/by-id/ata-SAMSUNG_MZ7PC128HAFU-000L5_S11VNSAD307242"
      - name: "worker-03"
        devices:
          - name: "/dev/disk/by-id/ata-SAMSUNG_MZ7PC128HAFU-000L5_S11VNSAD307250"
    # migration:
    #     confirmation: "yes-really-migrate-osds"
  cleanupPolicy:
    # set to "yes-really-destroy-data" to enable the cleanup job to delete all data when deleting the cluster
    confirmation: ""

cephBlockPoolsVolumeSnapshotClass:
  enabled: true
  name: csi-ceph-blockpool
  deletionPolicy: Delete
  isDefault: false

cephFileSystems: []

cephObjectStores: []
