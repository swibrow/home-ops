toolbox:
  enabled: true
  # cephClusterSpec.placement does not cover the toolbox — it is a chart-owned
  # Deployment, not a Rook-managed daemon.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - worker-01
                  - worker-02
                  - worker-03

monitoring:
  enabled: true
  createPrometheusRules: true

ingress:
  dashboard: {}

route:
  dashboard: {}

cephClusterSpec:
  security:
    cephx:
      # CVE-2025-30156: cephx keys minted before Tentacle use the `aes` cipher.
      # Rotating the DAEMON keys (mon/mgr/osd/mds) to aes256k is what clears the
      # two [ERR] checks, AUTH_INSECURE_SERVICE_KEY_TYPE and
      # AUTH_INSECURE_SERVICE_TICKETS. Rook flips auth_service_cipher itself once
      # the daemon keys land; it is not a settable field.
      #
      # Bump keyGeneration to rotate. Rook rolls the daemons one at a time, so
      # the pools (size 3 / min_size 2) MUST be active+clean first; rotating
      # while PGs are undersized drops them to 1 replica and blocks client I/O.
      #
      # Deliberately no daemon.keyType here. Setting it makes Rook run the mons
      # with --mon-auth-emergency-allowed-ciphers, which raises a standing
      # AUTH_EMERGENCY_CIPHERS_SET warning. It is worth pinning only to break a
      # tie: a disk replacement mints the new OSD under auth_preferred_cipher
      # while its peers are still aes, and Rook then logs `failed to determine
      # authoritative cephx key type for OSDs having key types [[aes256k aes]]`.
      # Pin it for that rotation, then take it back out.
      daemon:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
      # Do NOT rotate the CSI keys to aes256k yet, and do NOT set
      # allowedCiphers: [aes256k]; both strand every RBD client. Gated on:
      #   - Linux kernel >= 7.0 on all nodes (Talos ships 6.18.33 today)
      #   - ceph-csi >= v3.17.1 (running v3.17.0)
      # Until both clear, the remaining AUTH_INSECURE_* checks stay [WRN].
      csi:
        keyType: aes
  placement:
    # Rook resolves every daemon as all.Merge(<daemon>); Merge REPLACES
    # nodeAffinity and APPENDS tolerations. So `all` covers mgr/osd/prepareosd/
    # cleanup, and any per-daemon block must restate nodeAffinity in full.
    #
    # Safe for OSDs: their deployments are already nodeSelector-pinned to
    # worker-01/02/03, which intersects this list. mgr has no pin and just
    # reschedules.
    all:
      tolerations:
        - key: node-issue
          operator: Equal
          value: "true"
          effect: NoExecute
        - key: dedicated
          operator: Equal
          value: storage
          effect: NoSchedule
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - worker-01
                    - worker-02
                    - worker-03
    # NEVER narrow this list by more than one mon's node at a time.
    #
    # Each mon deployment is nodeSelector-pinned to the node its canary picked
    # (recorded in the rook-ceph-mon-endpoints mapping). On update Rook stamps
    # the new nodeAffinity while PRESERVING that nodeSelector (mon.go:1662-1690,
    # the `UseHostNetwork` branch), so any mon whose node leaves the list becomes
    # unschedulable. startDeployments only re-checks quorum BETWEEN mons, so
    # excluding two nodes at once breaks two mons and lands at 1/3 — quorum loss.
    #
    # Migrated off worker-05/06/07 in three stages (2026-07-26). Per stage:
    #   1. exclude exactly one mon's node, commit, force an ArgoCD sync — the
    #      diff engine under-detects changes in this preserve-unknown-fields
    #      subtree, so ApplyOutOfSyncOnly silently skips the resource;
    #   2. Rook re-stamps ALL mon deployments and stalls on `ok-to-stop` EBUSY
    #      for the survivors while the evicted mon is down;
    #   3. break the stall by clearing the dead mon (ceph mon rm + delete deploy
    #      + drop it from the mapping cm) then restarting the operator. A fresh
    #      reconcile sees a MISSING mon and canary-creates it in ~40s, which is
    #      far faster than waiting on ROOK_MON_OUT_TIMEOUT.

  network:
    provider: host

  mon:
    count: 3
  mgr:
    count: 1

  resources:
    # krr: rook-ceph-mgr-a/mgr
    mgr:
      requests:
        cpu: "73m"
        memory: "283Mi"
      limits:
        memory: "2Gi"
    # krr: rook-ceph-mon-aa/mon
    # Shared by mon-aa/ab/ac. Review memory diffs carefully — ceph mons want
    # steady headroom; an average-based request can crowd them under recovery.
    mon:
      requests:
        cpu: "30m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    # krr: rook-ceph-osd-0/osd
    # Shared by osd-0/1/2. Review memory diffs carefully — OSDs grow to
    # osd_memory_target (~4Gi); an average request can OOM them during backfill.
    osd:
      requests:
        cpu: "48m"
        memory: "1Gi"
      limits:
        memory: "6Gi"
    mgr-sidecar:
      requests:
        cpu: "49m"
        memory: "128Mi"
      limits:
        memory: "256Mi"
    # krr: rook-ceph-crashcollector-worker-01/ceph-crash
    crashcollector:
      requests:
        cpu: "15m"
        memory: "7Mi"
      limits:
        memory: "64Mi"
    logcollector:
      requests:
        cpu: "25m"
        memory: "100Mi"
      limits:
        memory: "1Gi"
    cleanup:
      requests:
        cpu: "250m"
        memory: "100Mi"
      limits:
        memory: "1Gi"

  crashCollector:
    disable: false

  dashboard:
    enabled: true
    urlPrefix: /
    ssl: false

  storage:
    useAllNodes: false
    useAllDevices: false
    config:
      osdsPerDevice: "1"
    nodes:
      - name: "worker-01"
        devices:
          - name: "/dev/disk/by-id/ata-SanDisk_SD7SB2Q512G1001_153141400183"
      - name: "worker-02"
        devices:
          - name: "/dev/disk/by-id/ata-SAMSUNG_MZ7PC128HAFU-000L5_S11VNSAD307242"
      - name: "worker-03"
        devices:
          - name: "/dev/disk/by-id/ata-SAMSUNG_MZ7PC128HAFU-000L5_S11VNSAD307250"
    # migration:
    #     confirmation: "yes-really-migrate-osds"
  cleanupPolicy:
    # set to "yes-really-destroy-data" to enable the cleanup job to delete all data when deleting the cluster
    confirmation: ""

cephBlockPoolsVolumeSnapshotClass:
  enabled: true
  name: csi-ceph-blockpool
  deletionPolicy: Delete
  isDefault: false

cephFileSystems: []

cephObjectStores: []
