---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: garage
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: kopiur
      endpoint: s3.wibrow.dev
      region: garage
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  create:
    enabled: true
  credentialProjection:
    allowed: true
  scheduleDefaults:
    timezone: Europe/Zurich
  parameters:
    epoch:
      # Epochs advance on "20 blobs or 10.5 MB, minimum 24h". The blob and size
      # thresholds are passed within minutes here, so the 24h minimum is the
      # only thing gating advancement, and ~19 hourly policies write roughly
      # 150 index blobs an hour: a full-length epoch accumulates ~3.6k of them
      # and every repository open has to read the lot. A 4h floor holds the
      # steady state near 600, well under the count kopia warns at.
      minDuration: 4h
  maintenance:
    # Quick maintenance is what actually advances an eligible epoch and
    # compacts the settled one, and kopiur defaults it to 6h: longer than the
    # 4h epoch floor above, which would leave epochs sitting eligible but
    # unadvanced. The repository's own Quick Cycle interval is already 1h, so
    # match it. Full stays daily; it rewrites contents and takes minutes.
    schedule:
      quick:
        cron: "0 * * * *"
        jitter: 10m
      full:
        cron: "0 3 * * *"
        jitter: 1h
