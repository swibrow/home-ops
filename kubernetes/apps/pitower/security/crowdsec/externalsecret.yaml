---
# The chart's own lapi Secret is randAscii + lookup, which re-rolls on every
# ArgoCD render. Generate it once in-cluster instead.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: crowdsec-lapi
spec:
  length: 64
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - csLapiSecret
    - registrationToken
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-lapi
spec:
  refreshInterval: "0"
  target:
    name: crowdsec-lapi-secret
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: crowdsec-lapi
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-ntfy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: crowdsec-ntfy-secret
    template:
      data:
        NTFY_AUTH: 'Basic {{ printf "bridge:%s" .BRIDGE_PASSWORD | b64enc }}'
  data:
    - secretKey: BRIDGE_PASSWORD
      remoteRef:
        key: /monitoring/ntfy/BRIDGE_PASSWORD
---
# Shared by LAPI (registers the bouncer via BOUNCER_KEY_envoy) and the envoy
# bouncer (authenticates with it).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: crowdsec-envoy-bouncer
spec:
  length: 64
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - BOUNCER_KEY_envoy
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-envoy-bouncer
spec:
  refreshInterval: "0"
  target:
    name: crowdsec-envoy-bouncer-secret
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: crowdsec-envoy-bouncer
---
# Read-only gateway queries for the home IPv6 prefixes (cronjob-home-allowlist.yaml).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-home-allowlist
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: crowdsec-home-allowlist-secret
  data:
    - secretKey: UNIFI_API_KEY
      remoteRef:
        key: /networking/external-dns-unifi/api-key
