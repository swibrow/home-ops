---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-apps-cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:apps@idm.wibrow.dev
  # Safety binding via the email username-claim (kanidm primary mail), so a
  # missing groups claim cannot lock the cluster out of Headlamp again.
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oidc:sam@wibrow.dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
