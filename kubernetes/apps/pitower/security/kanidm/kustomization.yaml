---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
resources:
  - certificate.yaml
  - httproute.yaml
  - backendtlspolicy.yaml
components:
  - ../../../../components/pvc
  - ../../../../components/kopiur

helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.3.0
    releaseName: kanidm
    namespace: security
    valuesFile: values.yaml

configMapGenerator:
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=kanidm-pvc
      - CLAIM_NAME=kanidm-data
      - STORAGE_SIZE=1Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=kanidm-kopiur
      - CLAIM_NAME=kanidm-data

generatorOptions:
  disableNameSuffixHash: true
