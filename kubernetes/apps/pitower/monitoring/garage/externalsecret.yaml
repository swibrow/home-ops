---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: garage-metrics-secret
  data:
    # Must match the metrics_token rendered into /etc/garage.toml on garage-01.
    # Garage gates /metrics on metrics_token, not admin_token; the role leaves
    # metrics_token falling back to admin_token, so this currently holds that
    # value. See ansible/roles/garage/defaults/main.yaml for the trade-off and
    # how to split them later - both sides have to change together.
    - secretKey: METRICS_TOKEN
      remoteRef:
        key: /monitoring/garage/METRICS_TOKEN
