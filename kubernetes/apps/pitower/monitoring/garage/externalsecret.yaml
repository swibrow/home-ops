---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: garage-metrics-secret
  data:
    # Garage gates /metrics on metrics_token, not admin_token. system/garage
    # reads the same Infisical key as GARAGE_METRICS_TOKEN, so the two cannot
    # drift. It currently holds the admin token's value, carried over from the
    # LXC; rotate it on its own to split them.
    - secretKey: METRICS_TOKEN
      remoteRef:
        key: /monitoring/garage/METRICS_TOKEN
