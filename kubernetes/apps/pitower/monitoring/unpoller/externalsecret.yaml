---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: unpoller-secret
  data:
    # Deliberately reuses the key external-dns-unifi already owns rather than
    # minting a second one. Both are read-only consumers of the same UniFi
    # controller API, and a duplicate key is another thing to rotate twice and
    # forget once. If these ever need to diverge - different permissions, or
    # revoking one without the other - split the path then.
    - secretKey: UNIFI_API_KEY
      remoteRef:
        key: /networking/external-dns-unifi/api-key
