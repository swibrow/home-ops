---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
# The gateway-wide BackendTrafficPolicy (networking/envoy-gateway/envoy.yaml) enables
# Brotli/Gzip compression on all routes. Compression buffers Dozzle's SSE/websocket
# streams, so the UI never sees a flush and reports "timed out while connecting to
# API". Route-level policy takes precedence and simply omits compression to disable it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: dozzle-no-compression
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: dozzle
