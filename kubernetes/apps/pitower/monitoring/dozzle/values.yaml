controllers:
  dozzle:
    strategy: Recreate
    containers:
      app:
        image:
          repository: docker.io/amir20/dozzle
          tag: v11.1.3@sha256:a70238909232f61ebcfdc4617200cb32872be481a51d8c65cc56c4f261ba66ca
        env:
          DOZZLE_MODE: k8s
          TZ: Europe/Zurich
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
    serviceAccount:
      identifier: dozzle
defaultPodOptions:
  automountServiceAccountToken: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    controller: dozzle
    ports:
      http:
        port: 8080

route:
  app:
    enabled: true
    hostnames:
      - dozzle.wibrow.dev
    parentRefs:
      - name: envoy-internal
        namespace: networking
        sectionName: https

serviceAccount:
  dozzle: {}
