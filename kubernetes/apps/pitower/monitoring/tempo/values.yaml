---
fullnameOverride: tempo

# TEMPORARY: paused for the TSDB move to openebs-hostpath-ssd.
replicas: 0

nodeSelector:
  wibrow.dev/compute: "true"

tempo:
  # Local disk backend, not S3 — keep retention short since it's on a 20Gi PVC.
  retention: 72h
  server:
    log_format: json
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 4Gi

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  size: 20Gi

serviceMonitor:
  enabled: true
