---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: alertmanager-config
    template:
      data:
        # Full Alertmanager config rendered here because prometheus-operator's
        # config parser rejects discord webhook_url_file (operator <= v0.92 has
        # no such field), so the webhook URL must be injected inline.
        # `{{ "{{" }}` emits a literal `{{` so the Alertmanager template
        # references below survive ESO's own templating pass.
        alertmanager.yaml: |
          templates:
            - /etc/alertmanager/configmaps/alertmanager-templates/*.tmpl
          route:
            receiver: discord
            group_by: ["alertname", "namespace", "severity"]
            group_wait: 30s
            group_interval: 5m
            # Notify once per alert, not on a repeating cadence. Alertmanager
            # has no "never repeat" setting, so this is 30d in practice.
            repeat_interval: 720h
            routes:
              - receiver: "null"
                matchers:
                  - alertname = "Watchdog"
              - receiver: "null"
                matchers:
                  - alertname = "InfoInhibitor"
              # tier comes from alert-tiers.yaml (0 cluster critical .. 5 sandbox).
              - receiver: "null"
                matchers:
                  - tier = "5"
              - receiver: "null"
                matchers:
                  - alertname = "AppErrorLogSpike"
                  - tier = "4"
              # ntfy is for outages only: alerts opt in with notify=ntfy
              # (node, ZFS pool, Garage down). Everything else is Discord.
              - receiver: ntfy
                matchers:
                  - notify = "ntfy"
                continue: true
              # A matching continue route counts as handled, so without this the
              # ntfy alerts above would skip Discord.
              - receiver: discord
          receivers:
            - name: "null"
            - name: discord
              discord_configs:
                - webhook_url: "{{ .discord_webhook_url }}"
                  send_resolved: true
                  title: '{{ "{{" }} template "wibrow.discord.title" . {{ "}}" }}'
                  message: '{{ "{{" }} template "wibrow.discord.message" . {{ "}}" }}'
            - name: ntfy
              webhook_configs:
                - url: http://ntfy-alertmanager.monitoring.svc.cluster.local:8080/
                  send_resolved: true
          inhibit_rules:
            - source_matchers:
                - severity = "critical"
              target_matchers:
                - severity =~ "warning|info"
              equal: ["alertname", "namespace"]
            - source_matchers:
                - severity = "warning"
              target_matchers:
                - severity = "info"
              equal: ["alertname", "namespace"]
            # KopiurSnapshotFailed carries the snapshot name, so a policy failing
            # hourly opens a new alert (and notification) every hour. Both it and
            # the consecutive-failure counter only fire while the policy's last
            # backup failed, so that one alert per policy is enough.
            - source_matchers:
                - alertname = "KopiurLastBackupFailed"
              target_matchers:
                - alertname =~ "KopiurSnapshotFailed|KopiurBackupConsecutiveFailures"
              equal: ["namespace"]
  data:
    - secretKey: discord_webhook_url
      remoteRef:
        key: /monitoring/alertmanager/DISCORD_WEBHOOK_URL
