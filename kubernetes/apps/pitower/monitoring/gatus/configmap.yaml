---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
data:
  config.yaml: |
    storage:
      type: postgres
      path: "postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable"

    # Exposes gatus_results_endpoint_success (0/1) plus the certificate and
    # domain expiration gauges on /metrics, scraped by servicemonitor.yaml.
    # This makes the sidecar's auto-discovered endpoints the app tier's health
    # signal in Prometheus, so no Probe CRs have to restate the same hostnames.
    metrics: true

    ui:
      title: Pitower Status
      header: Pitower Status

    # Per-HTTPRoute endpoints are auto-generated by the gatus-sidecar container
    # and written to /config/gatus-sidecar.yaml, which Gatus merges from the
    # GATUS_CONFIG_PATH directory. Override a single route's check by annotating
    # its HTTPRoute with gatus.home-operations.com/endpoint (YAML fragment) or
    # opt one out with gatus.home-operations.com/enabled: "false".

    # Hand-written endpoints below for things the sidecar can't auto-discover.
    endpoints:
      # Canary for the external path (Cloudflare tunnel -> envoy-external ->
      # fallback-404 directResponse filter). Hits a subdomain with no route, so
      # the wildcard *.wibrow.dev catch-all answers; a 404 with our page proves
      # the whole ingress chain is alive. The wildcard route itself can't be
      # auto-probed (host is *.wibrow.dev), so it's checked here explicitly.
      - name: External Gateway Fallback
        group: Infrastructure
        url: https://gatus-canary.wibrow.dev
        interval: 5m
        extra-labels:
          tier: edge
          component: fallback-404
          exposure: public
          scope: lan
        conditions:
          - "[STATUS] == 404"
          - "[BODY] == pat(*pitower*)"

      # Domain registration expiry. [DOMAIN_EXPIRATION] does an RDAP lookup
      # (WHOIS fallback), which is why the interval is 6h rather than the 5m
      # default -- registries rate-limit, and gatus's own docs warn against
      # anything under 5m. This replaces a dedicated domain-expiry exporter.
      - name: wibrow.dev
        group: Domains
        url: https://wibrow.dev
        interval: 6h
        extra-labels:
          tier: domain
          component: wibrow.dev
          exposure: public
          scope: wan
        conditions:
          - "[DOMAIN_EXPIRATION] > 720h"
          - "[CERTIFICATE_EXPIRATION] > 336h"
      - name: propagit.dev
        group: Domains
        url: https://propagit.dev
        interval: 6h
        extra-labels:
          tier: domain
          component: propagit.dev
          exposure: public
          scope: wan
        conditions:
          - "[DOMAIN_EXPIRATION] > 720h"
          - "[CERTIFICATE_EXPIRATION] > 336h"
      - name: cloudsnacks.dev
        group: Domains
        # No route serves the cloudsnacks.dev apex; pitwall is the live host on
        # the zone, and the domain expiry check is what this endpoint is for.
        url: https://pitwall.cloudsnacks.dev
        interval: 6h
        extra-labels:
          tier: domain
          component: cloudsnacks.dev
          exposure: public
          scope: wan
        conditions:
          - "[DOMAIN_EXPIRATION] > 720h"
          - "[CERTIFICATE_EXPIRATION] > 336h"
