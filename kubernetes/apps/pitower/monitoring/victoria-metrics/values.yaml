fullnameOverride: victoria-metrics

server:
  enabled: true
  replicaCount: 1
  nodeSelector:
    wibrow.dev/compute: "true"
  retentionPeriod: 2y
  extraArgs:
    envflag.enable: "true"
    envflag.prefix: VM_
    loggerFormat: json
    # Accept Prometheus remote_write + InfluxDB line protocol on the default port
    search.maxUniqueTimeseries: "1000000"
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    storageClassName: openebs-hostpath
    size: 100Gi
  service:
    servicePort: 8428
    type: ClusterIP
  # krr: victoria-metrics-server/vmsingle
  resources:
    requests:
      cpu: 100m
      memory: 1001Mi
    limits:
      # 100Gi of parts on local disk with a 2y retention; the cgroup was holding
      # ~0.5Gi of page cache, so merges hit the disk instead of RAM. worker-07 has
      # ~165Gi free, so buy the cache back here.
      memory: 12Gi
  ingress:
    enabled: false

vmbackupmanager:
  enabled: false
