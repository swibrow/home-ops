fullnameOverride: victoria-logs

server:
  enabled: true
  fullnameOverride: victoria-logs
  replicaCount: 1
  nodeSelector:
    wibrow.dev/compute: "true"
  retentionPeriod: 14d
  extraArgs:
    envflag.enable: "true"
    envflag.prefix: VM_
    loggerFormat: json
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    storageClassName: openebs-hostpath
    size: 20Gi
  service:
    servicePort: 9428
    type: ClusterIP
  serviceMonitor:
    enabled: true
  # krr: victoria-logs/vlogs
  resources:
    requests:
      cpu: 134m
      memory: 581Mi
    limits:
      # The limit caps this cgroup's page cache, not just its heap. At 1Gi the
      # cgroup held ~90Mi of cache for a 20Gi dataset, so every background merge
      # re-read the parts from disk — multi-GB/s bursts that starved the ceph-mon
      # admin socket on this node and dropped it out of quorum. VictoriaLogs also
      # sizes its internal caches off the cgroup limit (-memory.allowedPercent,
      # default 60), so raising this is what actually removes the disk reads.
      memory: 8Gi

dashboards:
  enabled: true
  labels:
    grafana_dashboard: "true"
  annotations:
    grafana_folder: Observability
