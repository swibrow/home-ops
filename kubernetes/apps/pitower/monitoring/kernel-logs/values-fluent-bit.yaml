# Receives Talos kmsg JSON over UDP. Off the dedicated=* nodes (no tolerations)
# and spread out, so a node that hangs is rarely the one holding its last lines.
kind: Deployment
replicaCount: 2
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: kernel-logs-receiver

rbac:
  create: false
daemonSetVolumes: []
daemonSetVolumeMounts: []

extraPorts:
  - name: worker-01
    port: 5101
    containerPort: 5101
    protocol: UDP
  - name: worker-02
    port: 5102
    containerPort: 5102
    protocol: UDP
  - name: worker-03
    port: 5103
    containerPort: 5103
    protocol: UDP
  - name: worker-04
    port: 5104
    containerPort: 5104
    protocol: UDP
  - name: worker-05
    port: 5105
    containerPort: 5105
    protocol: UDP
  - name: worker-06
    port: 5106
    containerPort: 5106
    protocol: UDP
  - name: worker-07
    port: 5107
    containerPort: 5107
    protocol: UDP
  - name: worker-08
    port: 5108
    containerPort: 5108
    protocol: UDP
  - name: worker-09
    port: 5109
    containerPort: 5109
    protocol: UDP
  - name: worker-10
    port: 5110
    containerPort: 5110
    protocol: UDP
  - name: worker-ai-01
    port: 5111
    containerPort: 5111
    protocol: UDP

resources:
  requests:
    cpu: 10m
    memory: 32Mi


config:
  service: |
    [SERVICE]
      Daemon Off
      Flush 1
      Log_Level {{ .Values.logLevel }}
      HTTP_Server On
      HTTP_Listen 0.0.0.0
      HTTP_Port {{ .Values.metricsPort }}
      Health_Check On

  inputs: |
    [INPUT]
      name udp
      tag kmsg.worker-01
      port 5101
      format json

    [INPUT]
      name udp
      tag kmsg.worker-02
      port 5102
      format json

    [INPUT]
      name udp
      tag kmsg.worker-03
      port 5103
      format json

    [INPUT]
      name udp
      tag kmsg.worker-04
      port 5104
      format json

    [INPUT]
      name udp
      tag kmsg.worker-05
      port 5105
      format json

    [INPUT]
      name udp
      tag kmsg.worker-06
      port 5106
      format json

    [INPUT]
      name udp
      tag kmsg.worker-07
      port 5107
      format json

    [INPUT]
      name udp
      tag kmsg.worker-08
      port 5108
      format json

    [INPUT]
      name udp
      tag kmsg.worker-09
      port 5109
      format json

    [INPUT]
      name udp
      tag kmsg.worker-10
      port 5110
      format json

    [INPUT]
      name udp
      tag kmsg.worker-ai-01
      port 5111
      format json

  filters: |
    [FILTER]
      name lua
      match kmsg.*
      call set_node
      code function set_node(tag, ts, record) record["node"] = string.sub(tag, 6) return 2, ts, record end

  outputs: |
    [OUTPUT]
      Name    http
      Match   kmsg.*
      Host    kernel-logs.monitoring.svc.cluster.local
      Port    9428
      URI     /insert/jsonline?_stream_fields=node,facility&_time_field=talos-time&_msg_field=msg
      Format  json_lines
      Compress gzip

testFramework:
  enabled: false
