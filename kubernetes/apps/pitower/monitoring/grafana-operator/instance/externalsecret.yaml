---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
  namespace: monitoring
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .grafana_client_secret }}"
  data:
    - secretKey: grafana_client_secret
      remoteRef:
        key: /monitoring/grafana/client_secret
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-admin-secret
  data:
    - secretKey: admin-password
      remoteRef:
        key: /monitoring/grafana/admin-password
    - secretKey: admin-user
      remoteRef:
        key: /monitoring/grafana/admin-user
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-image-renderer
  namespace: monitoring
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-image-renderer
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: /monitoring/grafana/image_renderer_token
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-github-app
  namespace: monitoring
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-github-app
    creationPolicy: Owner
  # Reuses the ARC GitHub App (app id 630254) rather than a dedicated one — it
  # already holds Actions:read + Metadata:read, which is all the GitHub
  # datasource needs for Workflow*/Actions queries. Other query types (Issues,
  # Pull_Requests, Commits) will 403 until those permissions are added to the app.
  data:
    - secretKey: app_id
      remoteRef:
        key: /arc/github-app/app_id
    - secretKey: installation_id
      remoteRef:
        key: /arc/github-app/installation_id
    - secretKey: private_key
      remoteRef:
        key: /arc/github-app/private_key
