---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rackrat
# No resources and no components: the planner needs neither a database nor a
# secret. The cnpg-db component and the Infisical ExternalSecret moved to
# ../rackrat-comps along with the services that actually use them.
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.1.0
    releaseName: rackrat
    namespace: rackrat
    valuesFile: values.yaml
