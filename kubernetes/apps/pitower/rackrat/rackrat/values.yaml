# rackrat — comps database for second-hand server hardware.
#
# Two controllers off one image: the api Deployment (FastAPI + the rack planner
# at /planner) and the hourly scrape CronJob. Image tags are patched by rackrat's
# own CI on release (swibrow/rackrat .github/workflows/ci.yaml, deploy-pitower
# job), which expects all three tag fields below to exist.

# A freshly published ghcr package is private by default, and both controllers
# pull the same one. The ghcr-pull-secret ClusterExternalSecret already lands in
# every namespace, so this only has to reference it.
defaultPodOptions:
  imagePullSecrets:
    - name: ghcr-pull-secret
controllers:
  api:
    strategy: RollingUpdate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      # Ordering matters: `reference sync` loads cpus.yaml/chassis.yaml into
      # hardware_reference, so the tables have to exist first.
      migrate:
        image:
          repository: ghcr.io/swibrow/rackrat
          tag: v0.1.1
        command: ["sh", "-c"]
        args: ["alembic upgrade head && rackrat reference sync"]
        env: &env
          TZ: Europe/Zurich
          RACKRAT_TEXT_MODEL: claude-sonnet-5
          RACKRAT_VISION_MODEL: claude-opus-4-8
          # CHF per kWh — feeds tco_3yr, so a wrong value silently reorders
          # every ranking rather than failing.
          RACKRAT_ELECTRICITY_RATE: "0.28"
          # Marketplace Insights (sold prices) is gated access; without it the
          # eBay adapter contributes asking prices only.
          RACKRAT_EBAY_INSIGHTS_ENABLED: "false"
          # The cnpg-db component emits this as DB_URL; rackrat reads it under
          # its own RACKRAT_ prefix (pydantic-settings env_prefix).
          RACKRAT_DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: rackrat-db-secret
                key: DB_URL
        envFrom: &envFrom
          - secretRef:
              name: rackrat-secret
              # Every key in it is optional, so ESO emits no Secret at all while
              # /rackrat is empty in Infisical. Without this the pods sit in
              # CreateContainerConfigError instead of running degraded.
              optional: true
    containers:
      app:
        image:
          repository: ghcr.io/swibrow/rackrat
          tag: v0.1.1
        # The image entrypoint is the `rackrat` CLI; the API is a different
        # surface, so both command and args are replaced.
        command: ["uvicorn"]
        args:
          - rackrat.api:app
          - --host
          - 0.0.0.0
          - --port
          - "8000"
        env: *env
        envFrom: *envFrom
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8000
              initialDelaySeconds: 5
              periodSeconds: 10
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8000
              initialDelaySeconds: 15
              periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
  scrape:
    type: cronjob
    cronjob:
      # Suspended: a live scrape needs the Ricardo CDP endpoint and a Claude key,
      # and until /rackrat is populated in Infisical every run just fails.
      suspend: true
      # Etiquette: at most one scrape per marketplace per hour. The offset is
      # arbitrary but fixed — auctions close on the hour, and this catches the
      # window where a realised price becomes visible.
      schedule: "17 * * * *"
      timeZone: Europe/Zurich
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 300
      backoffLimit: 1
      activeDeadlineSeconds: 900
      successfulJobsHistory: 3
      failedJobsHistory: 3
    containers:
      app:
        image:
          repository: ghcr.io/swibrow/rackrat
          tag: v0.1.1
        args: ["scrape", "ricardo:poweredge", "--alert"]
        env: *env
        envFrom: *envFrom
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            # Headroom for Chromium: the Ricardo adapter drives a real browser,
            # and the JSON-LD it parses only exists after the page runs.
            cpu: "2"
            memory: 2Gi
service:
  app:
    controller: api
    ports:
      http:
        port: 8000
route:
  app:
    enabled: true
    hostnames:
      - rackrat.wibrow.dev
    parentRefs:
      - name: envoy-external
        namespace: networking
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: 8000
