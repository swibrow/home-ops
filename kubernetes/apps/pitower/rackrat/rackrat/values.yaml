# rackrat — the rack planner and host-vs-rent calculator.
#
# Look at what is *not* here: no database URL, no Infisical secretRef, no
# marketplace credentials, no Anthropic key. This service reaches the market
# through ratcomps (../rackrat-comps) over HTTP and holds nothing it could leak.
# That is the point of the split, and it is why this image is a slim Python base
# rather than the ~2GB Playwright one.
#
# It also starts and serves without ratcomps. The market pane comes up empty and
# /market/status says why; the planner is still a planner.
#
# The image tag is patched by rackrat's own CI on release (swibrow/rackrat
# .github/workflows/ci.yaml, deploy-pitower job), which expects the tag field
# under controllers.web to exist.

# A freshly published ghcr package is private by default. The ghcr-pull-secret
# ClusterExternalSecret already lands in every namespace, so this only has to
# reference it.
defaultPodOptions:
  imagePullSecrets:
    - name: ghcr-pull-secret
controllers:
  web:
    strategy: RollingUpdate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/swibrow/rackrat-web
          tag: v0.2.1
        # The image entrypoint is already uvicorn; only the app path is set here.
        args:
          - rackrat_web.api:app
          - --host
          - 0.0.0.0
          - --port
          - "8080"
        env:
          TZ: Europe/Zurich
          # In-cluster, same namespace. Both apps land in `rackrat` because the
          # pitower ApplicationSet takes the namespace from the directory above
          # this one.
          RACKRAT_COMPS_URL: http://rackrat-comps.rackrat.svc.cluster.local:8000
          # CHF per kWh and room overhead — these drive the power bill the
          # break-even month is computed against, so a wrong value changes the
          # host-or-rent verdict rather than failing.
          RACKRAT_ELECTRICITY_RATE: "0.28"
          RACKRAT_PUE: "1.15"
          RACKRAT_AMORTISATION_YEARS: "3"
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 15
              periodSeconds: 20
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 256Mi
service:
  app:
    controller: web
    ports:
      http:
        port: 8080
route:
  app:
    enabled: true
    hostnames:
      - rackrat.wibrow.dev
    parentRefs:
      - name: envoy-external
        namespace: networking
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: 8080
