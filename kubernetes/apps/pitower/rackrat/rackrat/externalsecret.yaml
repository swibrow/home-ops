---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Database credentials come from the cnpg-db component (rackrat-db-secret).
#
# Every entry here is optional: rackrat degrades feature by feature (heuristic
# extraction without the Claude key, no eBay adapter, no alerts), so a pinned
# `data` list would take the whole Secret down for one absent key. `find` returns
# whatever exists under /rackrat and nothing more.
#
# Key names carry through verbatim into the Secret, and from there into the
# container's environment via envFrom — so name them in Infisical exactly as
# pydantic-settings expects to read them:
#
#   RACKRAT_ANTHROPIC_API_KEY  — normalisation (text) + BMC screenshot vision;
#                                populate with a litellm virtual key (see
#                                /ai/litellm/LITELLM_MASTER_KEY), not a real
#                                Anthropic key — paired with the
#                                RACKRAT_ANTHROPIC_BASE_URL override in values.yaml
#   RACKRAT_EBAY_CLIENT_ID     — eBay Browse API (live listings)
#   RACKRAT_EBAY_CLIENT_SECRET
#   RACKRAT_TELEGRAM_BOT_TOKEN — underpricing alerts
#   RACKRAT_TELEGRAM_CHAT_ID
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rackrat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: rackrat-secret
    creationPolicy: Owner
  dataFrom:
    # The store is scoped to "/" recursive, so path here is a prefix filter over
    # every secret in the project — not a folder that has to exist.
    - find:
        path: /rackrat
        conversionStrategy: Default
        decodingStrategy: None
