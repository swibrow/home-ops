---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Database credentials come from the cnpg-db component (rackrat-db-secret).
#
# Infisical entries required under /rackrat:
#   anthropic-api-key  — normalisation (text) + BMC screenshot vision
#   ebay-client-id     — eBay Browse API (live listings)
#   ebay-client-secret
#   telegram-bot-token — underpricing alerts
#   telegram-chat-id
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rackrat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: rackrat-secret
    creationPolicy: Owner
  data:
    - secretKey: RACKRAT_ANTHROPIC_API_KEY
      remoteRef:
        key: /rackrat/anthropic-api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: RACKRAT_EBAY_CLIENT_ID
      remoteRef:
        key: /rackrat/ebay-client-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: RACKRAT_EBAY_CLIENT_SECRET
      remoteRef:
        key: /rackrat/ebay-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: RACKRAT_TELEGRAM_BOT_TOKEN
      remoteRef:
        key: /rackrat/telegram-bot-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: RACKRAT_TELEGRAM_CHAT_ID
      remoteRef:
        key: /rackrat/telegram-chat-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
