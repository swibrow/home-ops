---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rackrat
resources:
  - externalsecret.yaml
components:
  - ../../../../components/cnpg-db-shared
configMapGenerator:
  - name: cnpg-db-config
    literals:
      # Deliberately still "rackrat", not "rackrat-comps": this names the
      # ExternalSecret and, through it, nothing the pods reference by a new
      # name. Keeping it stable means the move of this component out of the
      # ../rackrat app does not rename rackrat-db-secret underneath the pods.
      - APP_NAME=rackrat
      - SECRET_NAME=rackrat-db-secret
      - CNPG_SECRET_KEY=shared-rackrat
      # rackrat drives SQLAlchemy, which resolves a bare `postgresql://` to the
      # psycopg2 dialect. Only psycopg 3 is installed, so the URL has to name it.
      - DB_SCHEME=postgresql+psycopg
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.1.0
    releaseName: rackrat-comps
    namespace: rackrat
    valuesFile: values.yaml
