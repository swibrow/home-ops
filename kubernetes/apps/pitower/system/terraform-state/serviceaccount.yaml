---
# Identity for running terraform locally without an AWS SSO login.
#
# This ServiceAccount runs nothing. It exists only so that `kubectl create token
# terraform-state -n system --audience sts.amazonaws.com` mints a JWT that the
# IAM OIDC provider for this cluster already trusts - the same IRSA mechanism
# the ACK and toolhive roles use, driven from a laptop instead of from a pod.
# The AWS side is terraform/bootstrap/aws_iam_terraform_state.tf, and its trust
# policy pins this exact `system:serviceaccount:system:terraform-state` subject.
#
# The role it assumes is deliberately narrow: read/write on the two terraform
# state keys whose stacks use no AWS provider (proxmox, unifi). It is NOT a
# general-purpose AWS credential, and it must not become one - anyone who can
# mint this token gets whatever the role can do, and minting it needs only the
# cluster-admin kubeconfig. Widening it to the god-mode policy the GitHub OIDC
# role carries would make cluster-admin equal to AWS account admin.
#
# automountServiceAccountToken is off: nothing should ever mount this.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraform-state
automountServiceAccountToken: false
