# The Talos NVIDIA extensions install under /usr/local (bin/nvidia-smi,
# lib64/libnvidia-ml.so.1), and the plugin only searches fixed bin/ and lib64/
# style paths under the driver root. There is no /usr/local/dev, so device
# nodes still resolve from /.
nvidiaDriverRoot: /usr/local

gpuResourcesEnabledOverride: true

# v0.5.0 plus three fixes for vfio-pci rebinds on Talos (swibrow/dra-driver-nvidia-gpu,
# talos branch): the busy check ran `chroot /host-root fuser`, which Talos
# does not ship, so every vfio claim timed out (now it scans the host /proc for
# open fds on the card instead, and refuses to unbind a busy GPU);
# nvidia-persistenced (a Talos service, socket under /run) was only looked
# for under the /usr/local driver root, so it kept its handle on the card (now
# disabled through the host root); and each driver switch also unbound the
# card's HDMI audio function, which omarchy passes through on vfio-pci (now
# only the GPU function is unbound, and the audio function follows it to vfio).
# Drop this once upstream releases all three.
image:
  repository: ghcr.io/swibrow/dra-driver-nvidia-gpu
  tag: v0.5.0-talos.9

resources:
  gpus:
    enabled: true
  computeDomains:
    enabled: false

# Both Alpha. PassthroughSupport publishes the vfio.gpu.nvidia.com DeviceClass
# so a KubeVirt VM can claim the card through vfio-pci; the kubelet plugin
# refuses to start with it if IOMMU is off. worker-ai-01 loads vfio_pci from
# its Talos node patch, since modprobe from the plugin's host-root mount is
# not an option on Talos.
featureGates:
  PassthroughSupport: true
  DeviceMetadata: true

kubeletPlugin:
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  # Same override as the old nvidia-device-plugin: our NFD config publishes
  # pci-0300_10de rather than the chart's other terms, and the Talos-set label
  # is the one every GPU workload already selects on.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: feature.node.kubernetes.io/nvidia-gpu
                operator: In
                values:
                  - "true"
