# The Talos NVIDIA extensions install under /usr/local (bin/nvidia-smi,
# lib64/libnvidia-ml.so.1), and the plugin only searches fixed bin/ and lib64/
# style paths under the driver root. There is no /usr/local/dev, so device
# nodes still resolve from /.
nvidiaDriverRoot: /usr/local

gpuResourcesEnabledOverride: true

# v0.5.0 plus a fix from swibrow/dra-driver-nvidia-gpu (fix/vfio-gpu-free-check):
# before rebinding to vfio-pci the plugin ran `chroot /host-root fuser`, which
# Talos does not ship, so every vfio claim hung in prepare. The patch scans
# /proc fds by device number instead. Drop this once upstream releases it.
image:
  repository: ghcr.io/swibrow/dra-driver-nvidia-gpu
  tag: v0.5.0-talos.1

resources:
  gpus:
    enabled: true
  computeDomains:
    enabled: false

# Both Alpha. PassthroughSupport publishes the vfio.gpu.nvidia.com DeviceClass
# so a KubeVirt VM can claim the card through vfio-pci; the kubelet plugin
# refuses to start with it if IOMMU is off. worker-ai-01 loads vfio_pci from
# its Talos node patch, since modprobe from the plugin's host-root mount is
# not an option on Talos.
featureGates:
  PassthroughSupport: true
  DeviceMetadata: true

kubeletPlugin:
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  # Same override as the old nvidia-device-plugin: our NFD config publishes
  # pci-0300_10de rather than the chart's other terms, and the Talos-set label
  # is the one every GPU workload already selects on.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: feature.node.kubernetes.io/nvidia-gpu
                operator: In
                values:
                  - "true"
