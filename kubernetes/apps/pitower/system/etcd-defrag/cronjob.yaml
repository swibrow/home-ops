---
# Talos-issued client config (talosconfig in a Secret of the same name) with
# os:operator, the least role that covers etcd status/defrag/alarm disarm.
# Enabled by KubeTalosAPIAccessConfig in talos/pitower/control-plane/01-cluster.yaml.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-defrag
spec:
  roles:
    - os:operator
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-defrag
spec:
  schedule: "0 3 * * 0" # Sundays 03:00
  timeZone: Europe/Zurich
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          # etcd is a Talos host service, reached through the Talos API rather
          # than by mounting its PKI off the node (kubelet extraMounts went
          # away in Talos 1.14). Defrag is heavy and must run on one member at
          # a time, and the talosctl image has no shell, so the members are
          # serialised as init containers. Control-plane IPs are pinned
          # (10.20.10.1-3, VIP .0).
          initContainers:
            - name: status
              image: &image ghcr.io/siderolabs/talosctl:v1.14.0@sha256:ff9b1177abf0874e963261c4937ce5f5e8080adde6ae49b4e13195f37bee1a67
              args: ["etcd", "status", "-n", "10.20.10.1,10.20.10.2,10.20.10.3"]
              volumeMounts: &mounts
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
              securityContext: &sc
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
            - name: defrag-worker-01
              image: *image
              args: ["etcd", "defrag", "-n", "10.20.10.1"]
              volumeMounts: *mounts
              securityContext: *sc
            - name: defrag-worker-02
              image: *image
              args: ["etcd", "defrag", "-n", "10.20.10.2"]
              volumeMounts: *mounts
              securityContext: *sc
            - name: defrag-worker-03
              image: *image
              args: ["etcd", "defrag", "-n", "10.20.10.3"]
              volumeMounts: *mounts
              securityContext: *sc
          containers:
            - name: disarm
              image: *image
              args: ["etcd", "alarm", "disarm", "-n", "10.20.10.1,10.20.10.2,10.20.10.3"]
              volumeMounts: *mounts
              securityContext: *sc
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: talos-secrets
              secret:
                secretName: etcd-defrag
