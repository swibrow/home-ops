# rpc_secret, admin_token and metrics_token come from the environment
# (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN, GARAGE_METRICS_TOKEN).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

metadata_auto_snapshot_interval = "6h"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
# Single-node cluster: it only dials itself. Set to a reachable address when a
# second node joins.
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.wibrow.dev"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.wibrow.dev"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
