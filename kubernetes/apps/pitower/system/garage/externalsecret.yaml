---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: garage-secret
  data:
    # Carried over from the LXC (ansible/roles/garage/vars/secrets.sops.yaml).
    # The RPC secret has to match the restored metadata's cluster.
    - secretKey: GARAGE_RPC_SECRET
      remoteRef:
        key: /system/garage/RPC_SECRET
    - secretKey: GARAGE_ADMIN_TOKEN
      remoteRef:
        key: /system/garage/ADMIN_TOKEN
    # Same value Prometheus scrapes with (monitoring/garage).
    - secretKey: GARAGE_METRICS_TOKEN
      remoteRef:
        key: /monitoring/garage/METRICS_TOKEN
