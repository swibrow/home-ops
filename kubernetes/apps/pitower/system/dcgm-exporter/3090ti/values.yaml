---
# Same as ../values.yaml, but for the RTX 3090 Ti only.
runtimeClassName: nvidia

nodeSelector:
  feature.node.kubernetes.io/nvidia-gpu: "true"

tolerations:
  - key: dedicated
    operator: Equal
    value: gpu
    effect: NoSchedule

# The bind/unbind watch (DCGM 4.5+, driver 590+) rebuilds the exporter's state
# after the card comes back from vfio-pci, but it keeps /dev/nvidia0 open while
# the card is on nvidia, which blocks the DRA driver's rebind. So `just vm game`
# labels the node gpu.wibrow.dev/mode=vfio first and the DaemonSet controller
# removes the exporter until `just vm game-stop` clears the label.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: gpu.wibrow.dev/mode
              operator: NotIn
              values:
                - vfio

extraEnv:
  - name: NVIDIA_VISIBLE_DEVICES
    value: GPU-5124a851-f2f1-c9d3-b3c7-1fe93a664e6a
  - name: NVIDIA_DRIVER_CAPABILITIES
    value: compute,utility
  - name: DCGM_EXPORTER_ENABLE_GPU_BIND_UNBIND_WATCH
    value: "true"

serviceMonitor:
  enabled: true
  interval: 30s
