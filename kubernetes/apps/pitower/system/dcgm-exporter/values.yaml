---
# Same placement contract as dra-driver-nvidia-gpu: NFD-labelled GPU nodes only
# (ai-01 today), and the node's dedicated=gpu taint has to be tolerated or the
# DaemonSet pod never lands.
runtimeClassName: nvidia

nodeSelector:
  feature.node.kubernetes.io/nvidia-gpu: "true"

tolerations:
  - key: dedicated
    operator: Equal
    value: gpu
    effect: NoSchedule

# The exporter takes no DRA claim - claiming the GPU would hand it the whole
# card and starve inference. Device visibility comes from the nvidia runtime
# class instead, which only injects when these are set.
#
# The bind/unbind watch (DCGM 4.5+, driver 590+) rebuilds the exporter's state
# after the card comes back from vfio-pci, but it keeps /dev/nvidia0 open while
# the card is on nvidia, which blocks the DRA driver's rebind. So the GPU switch
# labels the node gpu.wibrow.dev/mode=vfio first and the DaemonSet controller
# removes the exporter until the label is cleared.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: gpu.wibrow.dev/mode
              operator: NotIn
              values:
                - vfio

extraEnv:
  - name: NVIDIA_VISIBLE_DEVICES
    value: all
  - name: NVIDIA_DRIVER_CAPABILITIES
    value: compute,utility
  - name: DCGM_EXPORTER_ENABLE_GPU_BIND_UNBIND_WATCH
    value: "true"

serviceMonitor:
  enabled: true
  interval: 30s
