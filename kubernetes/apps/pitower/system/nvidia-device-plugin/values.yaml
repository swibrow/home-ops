runtimeClassName: nvidia

nodeSelector:
  feature.node.kubernetes.io/nvidia-gpu: "true"

# The chart's default nodeAffinity matches NFD's bare
# feature.node.kubernetes.io/pci-10de.present label. Our NFD config includes
# "class" in pci deviceLabelFields, so it publishes the more specific
# pci-0300_10de.present instead - the default affinity never matches, and
# nodeSelector above never gets a chance to help since both are ANDed.
# Replace the whole nodeSelectorTerms list with our own Talos-set label.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: feature.node.kubernetes.io/nvidia-gpu
              operator: In
              values:
                - "true"

tolerations:
  - key: dedicated
    operator: Equal
    value: gpu
    effect: NoSchedule

cdi:
  # Known Talos v1.13 gap (siderolabs/talos#13021): the device plugin's CDI
  # spec defaults hook paths to /usr/bin/nvidia-ctk, but the
  # nvidia-container-toolkit extension installs to /usr/local/bin - the
  # extensions validator rejects a /usr/bin symlink, and no fix has landed
  # upstream. Without this, any pod requesting a nvidia.com/gpu limit fails
  # with "fork/exec /usr/bin/nvidia-ctk: no such file or directory".
  nvidiaHookPath: /usr/local/bin/nvidia-cdi-hook
