---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-automation
resources:
  - namespace.yaml
  - configmap.yaml
  - externalsecret.yaml
components:
  - ../../../../components/pvc
  - ../../../../components/kopiur
configMapGenerator:
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=frigate-pvc
      - CLAIM_NAME=frigate
      - STORAGE_SIZE=5Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=frigate-kopiur
      - CLAIM_NAME=frigate
patches:
  # frigate runs as root and its .jwt_secret is 0600 root-owned; the kopiur mover must match to read it.
  - target:
      kind: SnapshotPolicy
      name: frigate-kopiur
    patch: |
      - op: replace
        path: /spec/mover/securityContext/runAsUser
        value: 0
      - op: replace
        path: /spec/mover/securityContext/runAsGroup
        value: 0
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.0.1
    releaseName: frigate
    namespace: home-automation
    valuesFile: values.yaml
