---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
# https://docs.cilium.io/en/latest/network/l2-announcements
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: policy
spec:
  loadBalancerIPs: true
  # NOTE: This might need to be set if you have more than one active NIC on your nodes
  # interfaces:
  #   - ^eno[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
    # worker-ai-01 is out of the cluster whenever it is booted into Bazzite; a
    # VIP leased there drops until the lease expires and fails over.
    matchExpressions:
      - key: kubernetes.io/hostname
        operator: NotIn
        values: [worker-ai-01]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumloadbalancerippool_v2alpha1.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "Yes"
  blocks:
    - start: 10.20.10.128
      stop: 10.20.10.255
    # UniFi PD slice 3, assigned to no network: reachable only through the
    # BGP /128s, so nothing has to answer NDP for it. Only Services that ask
    # for dual-stack (ipFamilyPolicy) take an address from it.
    - cidr: 2a02:16a:2a0a:3::/112
