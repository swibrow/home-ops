---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
spec:
  template:
    spec:
      priorityClassName: system-node-critical
      initContainers:
        # Talos only ships bridge/host-local/loopback/portmap/firewall in
        # /opt/cni/bin; macvlan, static and vlan come from Sidero's plugin bundle.
        - name: install-cni-plugins
          image: ghcr.io/siderolabs/install-cni:v1.9.0
          command:
            - /bin/sh
            - -c
            - cp /opt/cni/bin/macvlan /opt/cni/bin/static /opt/cni/bin/vlan /host/opt/cni/bin/
          securityContext:
            privileged: true
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
      containers:
        - name: kube-multus
          # Upstream 50Mi OOMs on pod churn (Talos Multus guide). Upstream's
          # 100m CPU limit throttles it under churn, which stalls CNI ADD/DEL
          # for every pod on the node. The limit leaves headroom for the
          # backlog of ADDs replayed at startup: at 150Mi, worker-07's ~80
          # pending pods OOMKilled it within a second of every restart.
          resources:
            requests:
              memory: 150Mi
            limits:
              cpu: null
              memory: 512Mi
