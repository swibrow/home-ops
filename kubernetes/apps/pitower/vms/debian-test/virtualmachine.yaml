---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: debian-test
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: debian-test-root
      spec:
        source:
          http:
            url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
        # Access and volume modes come from the ceph-block StorageProfile
        # (RWX Block), which is what makes the VM live-migratable.
        storage:
          storageClassName: ceph-block
          resources:
            requests:
              storage: 10Gi
  template:
    metadata:
      labels:
        kubevirt.io/vm: debian-test
    spec:
      domain:
        cpu:
          cores: 2
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          dataVolume:
            name: debian-test-root
        - name: cloudinit
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              timezone: Europe/Zurich
              users:
                - name: debian
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM/GhH0lTfvk17mg/U0R6apV19Y28bJ/eoS0gjR+pteU
              packages:
                - qemu-guest-agent
              runcmd:
                - systemctl enable --now qemu-guest-agent
