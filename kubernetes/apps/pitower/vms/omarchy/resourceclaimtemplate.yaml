---
# The whole RTX 3090 Ti on vfio-pci, through the NVIDIA DRA driver's passthrough
# class (system/dra-driver-nvidia-gpu). Nothing stops the llmkube GPU models
# and comfyui claiming the same card; see the VM's runStrategy.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: omarchy-vfio
  annotations:
    # spec is immutable; Argo recreates the template on a change instead.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: vfio.gpu.nvidia.com
            allocationMode: ExactCount
            count: 1
            # The RTX PRO 4000 publishes a vfio device too.
            selectors:
              - cel:
                  expression: device.attributes['gpu.nvidia.com'].productName == 'GA102 [GeForce RTX 3090 Ti]'
      # libvirt only does legacy VFIO and refuses assignment without the
      # /dev/vfio/vfio container device, which the driver leaves out by default.
      config:
        - requests: ["gpu"]
          opaque:
            driver: gpu.nvidia.com
            parameters:
              apiVersion: resource.nvidia.com/v1beta1
              kind: VfioDeviceConfig
              iommu:
                backendPolicy: LegacyOnly
                enableAPIDevice: true
