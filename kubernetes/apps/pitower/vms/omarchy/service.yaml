---
apiVersion: v1
kind: Service
metadata:
  name: omarchy
  annotations:
    lbipam.cilium.io/ips: "10.20.10.233"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    kubevirt.io/vm: omarchy
  # SSH, plus the Moonlight ports that omarchy-install-service-sunshine opens in
  # the guest firewall. Pairing goes through the Sunshine admin UI on localhost.
  ports:
    - { name: ssh, port: 22, targetPort: 22, protocol: TCP }
    - { name: https, port: 47984, targetPort: 47984, protocol: TCP }
    - { name: http, port: 47989, targetPort: 47989, protocol: TCP }
    - { name: rtsp, port: 48010, targetPort: 48010, protocol: TCP }
    - { name: video, port: 47998, targetPort: 47998, protocol: UDP }
    - { name: control, port: 47999, targetPort: 47999, protocol: UDP }
    - { name: audio, port: 48000, targetPort: 48000, protocol: UDP }
    - { name: mic, port: 48002, targetPort: 48002, protocol: UDP }
