---
# Sunshine's web UI only speaks HTTPS with its own self-signed cert.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: omarchy-sunshine
spec:
  endpoints:
    - fqdn:
        hostname: omarchy.vms.svc.cluster.local
        port: 47990
  tls:
    insecureSkipVerify: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omarchy-sunshine
  annotations:
    gatus.home-operations.com/endpoint: |
      conditions:
        - "[STATUS] == 401"
spec:
  hostnames:
    - omarchy-sunshine.wibrow.dev
  parentRefs:
    - name: envoy-internal
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: omarchy-sunshine
          port: 47990
