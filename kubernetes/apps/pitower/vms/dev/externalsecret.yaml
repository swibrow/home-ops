---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Autoinstall inputs for the Omarchy ISO, attached to the VM as a disk labelled
# cidata (see the omarchy-iso README). user_configuration.json mirrors what the
# ISO's configurator writes for an unencrypted full-disk install; the partition
# sizes fill a 99Gi disk, leaving slack under the 100Gi root disk for CDI's
# rounding; recompute them if the disk is resized.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dev-cidata
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        user_encrypt_installation.txt: "false"
        authorized_keys: |
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM/GhH0lTfvk17mg/U0R6apV19Y28bJ/eoS0gjR+pteU
        user_credentials.json: |
          {
              "root_enc_password": "{{ .PASSWORD_HASH }}",
              "users": [
                  {
                      "enc_password": "{{ .PASSWORD_HASH }}",
                      "groups": [],
                      "sudo": true,
                      "username": "swibrow"
                  }
              ]
          }
        user_configuration.json: |
          {
              "app_config": null,
              "archinstall-language": "English",
              "auth_config": {},
              "audio_config": { "audio": "pipewire" },
              "bootloader_config": { "bootloader": "Limine", "uki": false, "removable": false },
              "custom_commands": [],
              "omarchy_install": {
                  "mode": "full_disk",
                  "defer_provisioning": false,
                  "target_mount": "/mnt",
                  "boot": {
                      "esp_mount": "/boot",
                      "esp_path": "/EFI/limine",
                      "efi_binary": "limine_x64.efi",
                      "enable_fallback": true
                  },
                  "storage": {
                      "kernel": "linux-omarchy"
                  }
              },
              "disk_config": {
                  "config_type": "default_layout",
                  "device_modifications": [
                      {
                          "device": "/dev/vda",
                          "partitions": [
                              {
                                  "btrfs": [],
                                  "dev_path": null,
                                  "flags": [ "boot", "esp" ],
                                  "fs_type": "fat32",
                                  "mount_options": [],
                                  "mountpoint": "/boot",
                                  "obj_id": "ea21d3f2-82bb-49cc-ab5d-6f81ae94e18d",
                                  "size": {
                                      "sector_size": { "unit": "B", "value": 512 },
                                      "unit": "B",
                                      "value": 2147483648
                                  },
                                  "start": {
                                      "sector_size": { "unit": "B", "value": 512 },
                                      "unit": "B",
                                      "value": 1048576
                                  },
                                  "status": "create",
                                  "type": "primary"
                              },
                              {
                                  "btrfs": [
                                      { "mountpoint": "/", "name": "@" },
                                      { "mountpoint": "/home", "name": "@home" },
                                      { "mountpoint": "/var/log", "name": "@log" },
                                      { "mountpoint": "/var/cache/pacman/pkg", "name": "@pkg" }
                                  ],
                                  "dev_path": null,
                                  "flags": [],
                                  "fs_type": "btrfs",
                                  "mount_options": [ "compress=zstd" ],
                                  "mountpoint": null,
                                  "obj_id": "8c2c2b92-1070-455d-b76a-56263bab24aa",
                                  "size": {
                                      "sector_size": { "unit": "B", "value": 512 },
                                      "unit": "B",
                                      "value": 104150859776
                                  },
                                  "start": {
                                      "sector_size": { "unit": "B", "value": 512 },
                                      "unit": "B",
                                      "value": 2148532224
                                  },
                                  "status": "create",
                                  "type": "primary"
                              }
                          ],
                          "wipe": true
                      }
                  ]
              },
              "hostname": "dev",
              "kernels": [ "linux-omarchy" ],
              "network_config": { "type": "iso" },
              "ntp": true,
              "parallel_downloads": 8,
              "script": null,
              "services": [],
              "swap": true,
              "timezone": "Europe/Zurich",
              "locale_config": {
                  "kb_layout": "us",
                  "sys_enc": "UTF-8",
                  "sys_lang": "en_US.UTF-8"
              },
              "mirror_config": {
                  "custom_repositories": [],
                  "custom_servers": [
                      {"url": "https://mirror.omarchy.org/$repo/os/$arch"},
                      {"url": "https://mirror.rackspace.com/archlinux/$repo/os/$arch"},
                      {"url": "https://geo.mirror.pkgbuild.com/$repo/os/$arch"}
                  ],
                  "mirror_regions": {},
                  "optional_repositories": []
              },
              "packages": [
                  "base-devel",
                  "git",
                  "omarchy-keyring",
                  "omarchy-settings",
                  "omarchy"
              ],
              "profile_config": {
                  "gfx_driver": null,
                  "greeter": null,
                  "profile": {}
              },
              "version": "3.0.9"
          }
  data:
    # SHA-512 crypt hash: openssl passwd -6
    - secretKey: PASSWORD_HASH
      remoteRef:
        key: /vms/omarchy/PASSWORD_HASH
