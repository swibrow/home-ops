fullnameOverride: external-dns-unifi
logLevel: info
domainFilters:
  - wibrow.dev
provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/home-operations/external-dns-unifi-webhook
      tag: 0.10.12
    env:
      - name: LOG_LEVEL
        value: info
      - name: UNIFI_HOST
        value: https://192.168.0.1
      - name: UNIFI_API_KEY
        valueFrom:
          secretKeyRef:
            name: external-dns-unifi-secret
            key: api-key
    livenessProbe:
      httpGet:
        path: /healthz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /readyz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5
extraArgs:
  # v0.22.0 dropped the alpha prefix with no fallback. Without this the
  # fallback-404 route's controller=none opt-out is ignored and *.wibrow.dev
  # gets published to UniFi, hijacking s3.wibrow.dev away from garage.
  - --annotation-prefix=external-dns.alpha.kubernetes.io/
policy: sync
sources:
  - gateway-httproute
  - gateway-udproute
  - service
triggerLoopOnEvent: true
txtOwnerId: default
txtPrefix: k8s.
serviceMonitor:
  enabled: true
podAnnotations:
  secret.reloader.stakater.com/reload: external-dns-unifi-secret
