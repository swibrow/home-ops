---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  labels:
    external-dns.alpha.kubernetes.io/enabled: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: &hostname external.wibrow.dev
    # The gatus sidecar merges a Gateway's endpoint annotation into every
    # HTTPRoute that parents to it (parent first, child wins), so setting
    # extra-labels here labels all of this gateway's routes at once instead of
    # touching ~35 app values files.
    #
    # Editing this annotation requires restarting gatus to take effect. The
    # sidecar watches HTTPRoutes only and reads the parent Gateway on demand
    # through a TTL cache, so a Gateway-only change fires no reconcile and the
    # rendered config keeps the old labels indefinitely. Nothing reports an
    # error; the labels just silently stay stale until something else touches
    # an HTTPRoute. After changing it:
    #   kubectl -n monitoring rollout restart deploy/gatus These become Prometheus labels on
    # gatus_results_endpoint_success, which infra:component:up folds together.
    #
    # scope: lan is deliberate and not a placeholder. The LAN resolver answers
    # these hostnames with the envoy-external LB address directly, so an
    # in-cluster probe never traverses the tunnel and cannot see a tunnel,
    # ovh-vps, ISP or Cloudflare outage. Only the ovh-vps vantage earns
    # scope: wan, and only that is safe to publish as public availability.
    gatus.home-operations.com/endpoint: |
      extra-labels:
        tier: app
        exposure: public
        scope: lan
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: *hostname
      lbipam.cilium.io/ips: "10.20.10.239"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        # Both certs hang off this one listener: Envoy selects on SNI
        # (longest matching name wins). Separate listeners would need one
        # per hostname pattern and, being more specific, would claim the
        # traffic away from this listener entirely.
        certificateRefs:
          - group: ''
            kind: Secret
            name: wibrow-dev-production-tls
          - group: ''
            kind: Secret
            name: propagit-dev-production-tls
          - group: ''
            kind: Secret
            name: cloudsnacks-apps-production-tls
          - group: ''
            kind: Secret
            name: pitwall-cloudsnacks-dev-production-tls
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envoy-external
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      namespace: networking
      sectionName: http
  rules:
    - filters:
        - requestRedirect:
            scheme: https
            statusCode: 301
          type: RequestRedirect
      matches:
        - path:
            type: PathPrefix
            value: /
