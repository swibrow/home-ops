global:
  imageRegistry: mirror.gcr.io

certgen:
  job:
    args:
      - certgen
      - --disable-topology-injector

config:
  envoyGateway:
    extensionApis:
      enableBackend: true
      enableLua: true
    provider:
      type: Kubernetes
      kubernetes:
        deploy:
          type: GatewayNamespace
