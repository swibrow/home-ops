---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "wibrow-dev-production"
  namespace: networking
spec:
  secretName: "wibrow-dev-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "wibrow.dev"
  dnsNames:
    - "wibrow.dev"
    - "*.wibrow.dev"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "propagit-dev-production"
  namespace: networking
spec:
  secretName: "propagit-dev-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "propagit.dev"
  dnsNames:
    - "propagit.dev"
    - "*.propagit.dev"
---
# pantry: *.apps.cloudsnacks.dev is a second-level wildcard, NOT covered by
# *.cloudsnacks.dev, so both SANs are listed explicitly.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "cloudsnacks-apps-production"
  namespace: networking
spec:
  secretName: "cloudsnacks-apps-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.apps.cloudsnacks.dev"
  dnsNames:
    - "*.apps.cloudsnacks.dev"
    - "api.pantry.cloudsnacks.dev"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "pitwall-cloudsnacks-dev-production"
  namespace: networking
spec:
  secretName: "pitwall-cloudsnacks-dev-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "pitwall.cloudsnacks.dev"
  dnsNames:
    - "pitwall.cloudsnacks.dev"
