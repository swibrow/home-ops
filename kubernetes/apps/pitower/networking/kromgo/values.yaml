config:
  prometheus: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  # Exposed at kromgo.wibrow.dev (badge/metric endpoints only); the gallery
  # landing page is not exposed.
  gallery:
    enabled: false
  cache:
    enabled: true
    maxAge: 300
  defaults:
    badge:
      style: flat
  badges:
    - id: nodes
      title: nodes
      query: count(kube_node_info)
      valueExpr: string(int(result))
    - id: pods
      title: pods
      query: sum(kube_pod_status_phase{phase="Running"})
      valueExpr: string(int(result))
    - id: namespaces
      title: namespaces
      query: count(kube_namespace_status_phase{phase="Active"})
      valueExpr: string(int(result))
    - id: apps
      title: apps
      # Requires the argocd ServiceMonitor (servicemonitor-argocd.yaml) so
      # argocd_app_info gets scraped into Prometheus.
      query: count(argocd_app_info)
      valueExpr: string(int(result))
    - id: appssynced
      title: synced
      query: count(argocd_app_info{sync_status="Synced"})
      valueExpr: string(int(result))
    - id: cpu
      title: cpu
      query: round(cluster:node_cpu:ratio_rate5m * 100, 0.1)
      valueExpr: string(result) + "%"
    - id: memory
      title: memory
      query: round((1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100, 0.1)
      valueExpr: string(result) + "%"
    - id: cpuavailable
      title: cpu available
      query: round((1 - cluster:node_cpu:ratio_rate5m) * 100, 0.1)
      valueExpr: string(result) + "%"
    - id: memavailable
      title: memory available
      query: round(sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes) * 100, 0.1)
      valueExpr: string(result) + "%"
    - id: diskavailable
      title: disk available
      query: round(sum(node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}) / sum(node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) * 100, 0.1)
      valueExpr: string(result) + "%"
    - id: uptime
      title: uptime
      query: floor((time() - min(node_boot_time_seconds)) / 86400)
      valueExpr: string(int(result)) + "d"
    - id: alerts
      title: alerts
      # Firing warning/critical alerts; drives the status pill on wibrow.dev.
      query: count(ALERTS{alertstate="firing",severity=~"critical|warning"}) OR on() vector(0)
      valueExpr: string(int(result))
      colorExpr: 'result == 0.0 ? "green" : "red"'
    # --- status.wibrow.dev -------------------------------------------------
    # The Cloudflare Worker behind status.wibrow.dev reads these server-side;
    # they are the only route by which infra:* leaves the cluster. Every one
    # carries an `or on() vector(-1)` sentinel so a missing series renders
    # "unknown" instead of an empty badge, which the Worker cannot tell apart
    # from healthy. Ids are prefixed `status_`/`tier_` so the Worker can be
    # pointed at a stable contract rather than at ad-hoc badge names.
    - id: status_public
      title: public availability
      # The headline number: what fraction of publicly-exposed services answer
      # from the WAN vantage on ovh-vps. Fed only by scope="wan" series, so it
      # is a statement about the internet path, not about the LAN.
      query: infra:public:up_ratio * 100 OR on() vector(-1)
      valueExpr: 'result < 0.0 ? "unknown" : humanizeFloat(math.round(result)) + "%"'
      colorExpr: 'result < 0.0 ? "lightgrey" : result >= 100.0 ? "green" : result >= 50.0 ? "orange" : "red"'
    - id: status_health
      title: internal health
      # min() across every non-app tier, so this is deliberately unforgiving:
      # one degraded backup reads as an outage. Kept as the secondary signal
      # for that reason - the page leads with status_public.
      query: infra:overall:up OR on() vector(-1)
      valueExpr: 'result < 0.0 ? "unknown" : result >= 1.0 ? "operational" : result > 0.0 ? "degraded" : "outage"'
      colorExpr: 'result < 0.0 ? "lightgrey" : result >= 1.0 ? "green" : result > 0.0 ? "orange" : "red"'
    - id: status_down
      title: components down
      query: infra:overall:down_count OR on() vector(-1)
      valueExpr: 'result < 0.0 ? "unknown" : string(int(result))'
      colorExpr: 'result < 0.0 ? "lightgrey" : result == 0.0 ? "green" : "red"'
    - id: status_degraded
      title: components degraded
      query: infra:overall:degraded_count OR on() vector(-1)
      valueExpr: 'result < 0.0 ? "unknown" : string(int(result))'
      colorExpr: 'result < 0.0 ? "lightgrey" : result == 0.0 ? "green" : "orange"'
    - id: status_stale
      title: signals stale
      # Evidence-missing, counted separately from evidence-of-failure. A page
      # that shows 0 down while 4 exporters are dead is lying by omission.
      query: count(infra:component:stale == 1) OR on() vector(0)
      valueExpr: string(int(result))
      colorExpr: 'result == 0.0 ? "green" : "orange"'

    # Per-tier rollups. One badge each rather than one badge listing them all,
    # because a kromgo endpoint resolves to a single scalar by design.
    - id: tier_app
      title: apps
      query: infra:tier:up_ratio{tier="app"} * 100 OR on() vector(-1)
      valueExpr: &tierValue 'result < 0.0 ? "unknown" : humanizeFloat(math.round(result)) + "%"'
      colorExpr: &tierColor 'result < 0.0 ? "lightgrey" : result >= 100.0 ? "green" : result >= 50.0 ? "orange" : "red"'
    - id: tier_edge
      title: edge
      query: infra:tier:up_ratio{tier="edge"} * 100 OR on() vector(-1)
      valueExpr: *tierValue
      colorExpr: *tierColor
    - id: tier_platform
      title: platform
      query: infra:tier:up_ratio{tier="platform"} * 100 OR on() vector(-1)
      valueExpr: *tierValue
      colorExpr: *tierColor
    - id: tier_node
      title: nodes
      query: infra:tier:up_ratio{tier="node"} * 100 OR on() vector(-1)
      valueExpr: *tierValue
      colorExpr: *tierColor
    - id: tier_storage
      title: storage
      query: infra:tier:up_ratio{tier="storage"} * 100 OR on() vector(-1)
      valueExpr: *tierValue
      colorExpr: *tierColor
    - id: tier_backup
      title: backups
      query: infra:tier:up_ratio{tier="backup"} * 100 OR on() vector(-1)
      valueExpr: *tierValue
      colorExpr: *tierColor
    - id: tier_network
      title: network
      query: infra:tier:up_ratio{tier="network"} * 100 OR on() vector(-1)
      valueExpr: *tierValue
      colorExpr: *tierColor
    - id: tier_dns
      title: dns
      query: infra:tier:up_ratio{tier="dns"} * 100 OR on() vector(-1)
      valueExpr: *tierValue
      colorExpr: *tierColor
    - id: tier_host
      title: hosts
      query: infra:tier:up_ratio{tier="host"} * 100 OR on() vector(-1)
      valueExpr: *tierValue
      colorExpr: *tierColor
    - id: tier_service
      title: services
      query: infra:tier:up_ratio{tier="service"} * 100 OR on() vector(-1)
      valueExpr: *tierValue
      colorExpr: *tierColor
    - id: tier_power
      title: power
      query: infra:tier:up_ratio{tier="power"} * 100 OR on() vector(-1)
      valueExpr: *tierValue
      colorExpr: *tierColor
    - id: tier_domain
      title: domains
      query: infra:tier:up_ratio{tier="domain"} * 100 OR on() vector(-1)
      valueExpr: *tierValue
      colorExpr: *tierColor

    - id: cephhealth
      title: ceph
      # ceph_health_status: 0 = HEALTH_OK, 1 = HEALTH_WARN, 2 = HEALTH_ERR.
      # -1 sentinel so a missing mgr scrape renders "unknown" rather than an
      # empty badge, which would be indistinguishable from healthy.
      query: max(ceph_health_status) OR on() vector(-1)
      valueExpr: 'result < 0.0 ? "unknown" : result == 0.0 ? "OK" : result == 1.0 ? "WARN" : "ERR"'
      colorExpr: 'result < 0.0 ? "lightgrey" : result == 0.0 ? "green" : result == 1.0 ? "orange" : "red"'

  graphs:
    - id: cpu
      title: cpu
      # sum() drops the series label so no legend clutters the small chart.
      query: sum(cluster:node_cpu:ratio_rate5m) * 100
      theme: dark
      fill: true
      legend: false
      yMin: 0
      yMax: 100
      maxDuration: 3h
      width: 360
      height: 110
      valueExpr: string(int(result)) + "%"
    - id: memory
      title: memory
      query: (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100
      theme: dark
      fill: true
      legend: false
      yMin: 0
      yMax: 100
      maxDuration: 3h
      width: 360
      height: 110
      valueExpr: string(int(result)) + "%"

# Public endpoint for the wibrow.dev blog dashboard (cross-origin; CORS is
# handled by the SecurityPolicy in securitypolicy.yaml).
httpRoute:
  enabled: true
  parentRefs:
    - name: envoy-external
      namespace: networking
      sectionName: https
  hostnames:
    - kromgo.wibrow.dev

# krr: kromgo/kromgo
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
