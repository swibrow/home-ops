fullnameOverride: external-dns
provider: cloudflare
logFormat: json
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-secret
        key: api-token
extraArgs:
  - --ingress-class=external
  - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
  - --crd-source-kind=DNSEndpoint
  - --gateway-label-filter=external-dns.alpha.kubernetes.io/enabled=true
  # v0.22.0 dropped the alpha prefix with no fallback; without this every
  # annotation below (controller, target, cloudflare-proxied) is ignored.
  - --annotation-prefix=external-dns.alpha.kubernetes.io/
policy: sync
sources:
  - crd
  - gateway-httproute
txtPrefix: k8s.
txtOwnerId: default
domainFilters: ["wibrow.dev", "propagit.dev", "cloudsnacks.dev"]
serviceMonitor:
  enabled: true
podAnnotations:
  secret.reloader.stakater.com/reload: external-dns-secret
nodeAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node-role.kubernetes.io/master
            operator: Exists
tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists
