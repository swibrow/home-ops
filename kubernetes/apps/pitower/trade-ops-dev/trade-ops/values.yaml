# Dev environment: CI in swibrow/trade-ops bumps the tag and chart version on
# every main build and auto-merges it. kubernetes/apps/pitower/trade-ops is the
# release environment and only moves when its deploy PR is merged by hand.
# Pinned by deploy version for the same spegel reason as the release values.
image:
  tag: v0.1.0-dev.14
imagePullSecret: ghcr-pull-secret
backend:
  env:
    TRADE_OPS_DATA_PROFILE: live
  persistence:
    size: 5Gi
# No auth in front of it, same as release.
httpRoute:
  enabled: true
  hostname: trade-ops-dev.wibrow.dev
  gateway:
    name: envoy-external
    namespace: networking
    sectionName: https
