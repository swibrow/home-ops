controllers:
  propagit:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      imagePullSecrets:
        - name: ghcr-pull-secret
    containers:
      app:
        image:
          repository: ghcr.io/propagit-dev/propagit
          tag: 0.7.0
        env:
          TZ: Europe/Zurich
          PROPAGIT_ADDR: :8000
          # /metrics is served only on this second listener, off the routed
          # port, so it never reaches the internet.
          PROPAGIT_METRICS_ADDR: :9090
          # Envoy fronts propagit, so X-Forwarded-For is trusted only from the
          # pod network. Without it every client shares one rate-limit bucket
          # keyed on the gateway's address.
          PROPAGIT_TRUSTED_PROXIES: 10.244.0.0/16
          PROPAGIT_DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: propagit-db-secret
                key: DB_URL
        envFrom:
          - secretRef:
              name: propagit-secret
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: &httpPort 8000
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: *httpPort
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *httpPort
              failureThreshold: 30
              periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
service:
  app:
    controller: propagit
    ports:
      http:
        port: *httpPort
      metrics:
        port: 9090

serviceMonitor:
  app:
    serviceName: propagit
    endpoints:
      - port: metrics
        scheme: http
        path: /metrics
        interval: 1m
        scrapeTimeout: 10s

route:
  app:
    hostnames:
      - propagit.dev
      - propagit.wibrow.dev
    parentRefs:
      - name: envoy-external
        namespace: networking
        sectionName: https
