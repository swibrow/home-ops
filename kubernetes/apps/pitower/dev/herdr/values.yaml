controllers:
  herdr:
    type: statefulset
    replicas: 1
    pod:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: ghcr-pull-secret
    containers:
      app:
        image:
          repository: ghcr.io/cloudsnacks/dev-desktop
          tag: 1.1.0
        # dev-desktop's default CMD starts Hyprland/Sunshine for GUI streaming;
        # this pod reuses the same image purely for its CLI tooling (herdr,
        # Claude Code, kubectl, ...) and runs sshd instead, since herdr's
        # `--remote` mode attaches over plain SSH, not HTTP.
        command:
          - bash
          - -c
          - |
            set -euo pipefail

            mkdir -p /run/sshd /data/ssh
            for t in ed25519 rsa; do
              key="/data/ssh/ssh_host_${t}_key"
              [ -f "${key}" ] || ssh-keygen -q -t "${t}" -f "${key}" -N ""
            done

            mkdir -p "${HOME}/.ssh"
            cp /authorized_keys.d/authorized_keys "${HOME}/.ssh/authorized_keys"
            chmod 700 "${HOME}/.ssh"
            chmod 600 "${HOME}/.ssh/authorized_keys"

            cat > /tmp/sshd_config <<SSHD
            Port 2222
            HostKey /data/ssh/ssh_host_ed25519_key
            HostKey /data/ssh/ssh_host_rsa_key
            PidFile /tmp/sshd.pid
            AuthorizedKeysFile ${HOME}/.ssh/authorized_keys
            AllowUsers dev
            PermitRootLogin no
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            UsePAM no
            StrictModes no
            Subsystem sftp internal-sftp
            SSHD

            exec /usr/sbin/sshd -D -e -f /tmp/sshd_config
        env:
          TZ: Europe/Zurich
          HOME: /home/dev
          DOTFILES_REPO: https://github.com/swibrow/dotfiles.git
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 4Gi
      webterm:
        # Browser access to the same box: same pod, same $HOME, so a browser
        # session and an SSH session attach to the exact same herdr server.
        image:
          repository: ghcr.io/swibrow/webterm
          tag: v1.1.2
        workingDir: /home/dev
        env:
          TZ: Europe/Zurich
          HOME: /home/dev
          WEBTERM_LISTEN: ":8080"
          WEBTERM_CMD: herdr
          WEBTERM_AUTH: oidc
          WEBTERM_PUBLIC_URL: https://term.wibrow.dev
          WEBTERM_OIDC_ISSUER: https://idm.wibrow.dev/oauth2/openid/webterm
          WEBTERM_OIDC_CLIENT_ID: webterm
          WEBTERM_OIDC_GROUP: app_access
        envFrom:
          - secretRef:
              name: webterm-secrets
              optional: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: &webtermPort 8080
              periodSeconds: 10
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *webtermPort
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
service:
  app:
    controller: herdr
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      lbipam.cilium.io/ips: "10.20.10.232"
    ports:
      ssh:
        port: 22
        targetPort: 2222
  http:
    controller: herdr
    ports:
      http:
        port: 8080
route:
  app:
    hostnames:
      - term.wibrow.dev
    parentRefs:
      - name: envoy-internal
        namespace: networking
        sectionName: https
    rules:
      - backendRefs:
          - identifier: http
            port: 8080
persistence:
  home:
    existingClaim: herdr-data
    globalMounts:
      - path: /home/dev
        subPath: home
  ssh-host-keys:
    existingClaim: herdr-data
    advancedMounts:
      herdr:
        app:
          - path: /data/ssh
            subPath: ssh-host-keys
  authorized-keys:
    type: configMap
    name: herdr-authorized-keys
    advancedMounts:
      herdr:
        app:
          - path: /authorized_keys.d
            readOnly: true
  # /run is owned by root in the base image; sshd's privsep preauth chroot
  # needs a writable /run/sshd, and the pod runs entirely as non-root.
  run-sshd:
    type: emptyDir
    advancedMounts:
      herdr:
        app:
          - path: /run/sshd
