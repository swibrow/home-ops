---
# Arch/Hyprland desktop streamed to Moonlight clients over Sunshine.
# Suspend when unused with `operatingMode: Suspended` (the home PVC is retained).
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: dev-desktop
spec:
  operatingMode: Running
  # Sunshine needs raw TCP/UDP, so the LoadBalancer Service below replaces the
  # controller's auto headless Service.
  service: false
  shutdownPolicy: Retain
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 100Gi
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: dev-desktop
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              # The AMD Renoir APUs are the only nodes with a usable render node
              # and a VCN encoder. worker-07's only VGA device is QEMU virtual.
              - matchExpressions:
                  - key: feature.node.kubernetes.io/amd-gpu
                    operator: In
                    values: ["true"]
                  # worker-01/02/03 are control-plane nodes that already run hot;
                  # worker-01 has the least headroom (~12.8Gi allocatable vs ~28Gi),
                  # and starving it previously jammed the apiserver.
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["worker-01"]
      securityContext:
        fsGroup: 1001
      # The home PVC mounts over /home/dev and hides the desktop config baked
      # into the image, so Hyprland generated a stock default instead — no
      # `exec-once = sunshine`, hence a running compositor nobody can connect to.
      # This seeds the PVC once; it mounts the PVC elsewhere, so unlike the app
      # container it can still see the image's own /home/dev.
      initContainers:
        - name: seed-home
          image: ghcr.io/cloudsnacks/dev-desktop:1.0.0
          securityContext:
            runAsUser: 1001
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if [[ ! -e /seed/.config/hypr/hyprland.conf ]]; then
                cp -rn /home/dev/. /seed/
                # The AMD nodes have a JetKVM wired to HDMI, so the DRM backend
                # finds a real 1920x1080 output and Sunshine picks that over the
                # headless one — Moonlight would stream the node's console view.
                echo 'monitor = HDMI-A-1, disable' >> /seed/.config/hypr/hyprland.conf
                # Hyprland prefers hyprland.lua over hyprland.conf, and the .lua
                # on the PVC is the default it wrote while it was failing to
                # start. Keep it, but stop it shadowing the real config.
                if [[ -e /seed/.config/hypr/hyprland.lua ]]; then
                  mv /seed/.config/hypr/hyprland.lua /seed/.config/hypr/hyprland.lua.generated
                fi
              fi
          volumeMounts:
            - name: home
              mountPath: /seed
      containers:
        - name: dev-desktop
          image: ghcr.io/cloudsnacks/dev-desktop:1.0.0
          securityContext:
            # Kubernetes has no per-device cgroup API. Without privileged the
            # cgroup v2 eBPF device filter denies open() on /dev/dri/* and
            # /dev/uinput even for root and even at mode 0666, so a hostPath
            # device mount alone is never enough. The desktop itself still runs
            # as uid 1001 — only seatd needs the privileges (see command below).
            privileged: true
            runAsUser: 0
          # The image entrypoint execs Hyprland directly, but aquamarine builds
          # its GBM allocator only from a backend reporting drmFD() >= 0, which
          # in practice means the DRM backend, which needs a libseat session.
          # No seatd (or logind) means no session, no DRM backend, no allocator,
          # and Hyprland aborts with "CBackend::create() failed!".
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              install -d -o dev -g dev -m 700 /run/user/1001
              # A container has no VT; without SEATD_VTBOUND=0 seatd waits on
              # /dev/tty0 forever and never activates the session, so every
              # device open comes back "client is not active".
              SEATD_VTBOUND=0 seatd -g seat &
              for _ in $(seq 50); do
                if [[ -S /run/seatd.sock ]]; then break; fi
                sleep 0.1
              done
              exec setpriv --reuid=1001 --regid=1001 --init-groups \
                env HOME=/home/dev XDG_RUNTIME_DIR=/run/user/1001 \
                /usr/local/bin/start-desktop
          env:
            - name: TZ
              value: Europe/Zurich
            - name: DOTFILES_REPO
              value: https://github.com/swibrow/dotfiles.git
          ports:
            - { name: https, containerPort: 47984, protocol: TCP }
            - { name: http, containerPort: 47989, protocol: TCP }
            - { name: web, containerPort: 47990, protocol: TCP }
            - { name: rtsp, containerPort: 48010, protocol: TCP }
            - { name: video, containerPort: 47998, protocol: UDP }
            - { name: control, containerPort: 47999, protocol: UDP }
            - { name: audio, containerPort: 48000, protocol: UDP }
            - { name: mic, containerPort: 48002, protocol: UDP }
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              # Capped well under node capacity so a busy desktop cannot starve
              # the control-plane services sharing this node.
              cpu: "6"
              memory: 10Gi
          volumeMounts:
            - name: home
              mountPath: /home/dev
            - name: dri
              mountPath: /dev/dri
            - name: uinput
              mountPath: /dev/uinput
      volumes:
        # Hyprland cannot start without a render node even though it is headless:
        # aquamarine only builds a GBM allocator from a backend reporting
        # drmFD() >= 0, and the headless backend returns -1. card0 is needed too
        # (not just renderD128) — the allocator comes from the DRM backend, and
        # that enumerates KMS devices. File modes here are irrelevant; access is
        # gated by the container's device cgroup (see privileged above).
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        # Requires siderolabs/uinput in the node schematic — and note that the
        # schematic only takes effect after `topf upgrade`, not `topf apply`.
        # Without it Moonlight gets video and audio but no mouse or keyboard.
        - name: uinput
          hostPath:
            path: /dev/uinput
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: dev-desktop
  annotations:
    lbipam.cilium.io/ips: "10.20.10.231"
spec:
  type: LoadBalancer
  # Must stay Cluster: Cilium L2 announcements are explicitly incompatible with
  # externalTrafficPolicy: Local. The announcing node is elected by lease,
  # first-come-first-serve across all nodes, with no regard for where the pod
  # runs — it landed on worker-07 while the desktop runs on worker-03, so every
  # ARP-routed client got a node that drops the traffic. Costs client IP
  # preservation; Sunshine sees a node address instead.
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: dev-desktop
  ports:
    - { name: https, port: 47984, targetPort: https, protocol: TCP }
    - { name: http, port: 47989, targetPort: http, protocol: TCP }
    - { name: web, port: 47990, targetPort: web, protocol: TCP }
    - { name: rtsp, port: 48010, targetPort: rtsp, protocol: TCP }
    - { name: video, port: 47998, targetPort: video, protocol: UDP }
    - { name: control, port: 47999, targetPort: control, protocol: UDP }
    - { name: audio, port: 48000, targetPort: audio, protocol: UDP }
    - { name: mic, port: 48002, targetPort: mic, protocol: UDP }
