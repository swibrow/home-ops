---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - externalsecret.yaml
  - httproute.yaml
  - dragonfly.yaml
components:
  - ../../../../components/cnpg-db-database
  - ../../../../components/pvc
  - ../../../../components/kopiur
configMapGenerator:
  - name: cnpg-db-config
    literals:
      - APP_NAME=forgejo
      - SECRET_NAME=forgejo-db-secret
      - CNPG_SECRET_KEY=forgejo-app
      - DB_SCHEME=postgresql
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=forgejo-pvc
      - CLAIM_NAME=forgejo
      - STORAGE_SIZE=10Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=forgejo-kopiur
      - CLAIM_NAME=forgejo
patches:
  # Held at zero for the logical migration onto the shared cluster. The chart's
  # JSON schema sets `replicaCount` minimum 1, so setting it in values.yaml
  # fails `helm template` and stops the whole Application rendering — this has
  # to be a patch on the rendered Deployment.
  - target:
      kind: Deployment
      name: forgejo
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: 17.1.3
    releaseName: forgejo
    namespace: dev
    valuesFile: values.yaml
