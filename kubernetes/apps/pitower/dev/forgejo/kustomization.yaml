---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - externalsecret.yaml
  - httproute.yaml
  - dragonfly.yaml
components:
  - ../../../../components/cnpg-db
  - ../../../../components/pvc
  - ../../../../components/kopiur
configMapGenerator:
  - name: cnpg-db-config
    literals:
      - APP_NAME=forgejo
      - SECRET_NAME=forgejo-db-secret
      - CNPG_SECRET_KEY=forgejo-app
      - DB_SCHEME=postgresql
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=forgejo-pvc
      - CLAIM_NAME=forgejo
      - STORAGE_SIZE=10Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=forgejo-kopiur
      - CLAIM_NAME=forgejo
# Held at zero for the database migration onto the dedicated forgejo cluster
# in the database namespace. This has to be a post-render patch rather than
# `replicaCount: 0` in values.yaml: the chart ships a JSON schema with
# `minimum: 1`, so a zero there fails `helm template` outright and the whole
# Application stops rendering. Patching the rendered Deployment keeps the hold
# declared in git, which is what makes it survive the next automated sync.
patches:
  - target:
      kind: Deployment
      name: forgejo
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: 17.1.3
    releaseName: forgejo
    namespace: dev
    valuesFile: values.yaml
