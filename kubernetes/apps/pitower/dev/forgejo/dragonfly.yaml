apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: forgejo-dragonfly
  namespace: dev
spec:
  replicas: 1
  # Dragonfly's arm64 build needs ARMv8.2 (LSE atomics); worker-08/09/10 are
  # Cortex-A72 (Pi 4, ARMv8.0, no `atomics` in /proc/cpuinfo Features), so the
  # correct-arch image still dies on SIGILL there. Keep it on amd64.
  nodeSelector:
    kubernetes.io/arch: amd64
  # maxmemory instead of a pod limit; Dragonfly needs more than 256Mi per io thread.
  args:
    - "--proactor_threads=1"
    - "--maxmemory=512mb"
  # krr: forgejo-dragonfly/dragonfly
  resources:
    requests:
      cpu: 16m
      memory: 14Mi
