---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: analytics
resources:
  - externalsecret.yaml
  - clickhouse-configmap.yaml
components:
  - ../../../../components/cnpg-db-shared
  - ../../../../components/pvc
  - ../../../../components/kopiur
configMapGenerator:
  - name: cnpg-db-config
    literals:
      - APP_NAME=rybbit
      - SECRET_NAME=rybbit-db-secret
      - CNPG_SECRET_KEY=shared-rybbit
      - DB_SCHEME=postgresql
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=rybbit-pvc
      - CLAIM_NAME=rybbit-clickhouse
      - STORAGE_SIZE=10Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=rybbit-clickhouse-kopiur
      - CLAIM_NAME=rybbit-clickhouse
patches:
  # clickhouse writes its data as uid 101 (store/ dirs are drwxr-s---); the kopiur mover must match to read it.
  - target:
      kind: SnapshotPolicy
      name: rybbit-clickhouse-kopiur
    patch: |
      - op: replace
        path: /spec/mover/securityContext/runAsUser
        value: 101
      - op: replace
        path: /spec/mover/securityContext/runAsGroup
        value: 101
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.1.0
    releaseName: rybbit
    namespace: analytics
    valuesFile: values.yaml
