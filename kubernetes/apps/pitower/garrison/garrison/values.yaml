# Home cluster (admin@pitower): everything in the garrison namespace,
# secrets synced from Infisical via the external-secrets ClusterSecretStore.
# Pin images by release version (garrison's CI patches this file when it
# cuts a release): spegel resolves mutable tags like :latest from peer
# caches, serving stale images.
#
# database.enabled flips keep/herald to Postgres + HA (2 replicas each);
# garrison-db-secret is the CNPG-generated app credential (see
# cloudnative-pg/cluster/cluster.yaml + the cnpg-db kustomize component).
# Cut over per garrison's docs/postgres.md runbook.
database:
  enabled: true
  secret: garrison-db-secret
  secretKey: DB_URL
keep:
  image: ghcr.io/swibrow/garrison-keep:v0.37.0
  imagePullPolicy: IfNotPresent
# ghcr packages stay private (the repo is private); ghcr-pull-secret is
# fanned out to every namespace by security/external-secrets/ghcr-pull-secret.
imagePullSecret: ghcr-pull-secret
runner:
  image: ghcr.io/swibrow/garrison-runner:v0.37.0
  namespace: garrison
harness: claude
launcher: sandbox
herald:
  enabled: true
  allowedChatIds: "1053711635,-5540433154"
# Discord surface. Bot token, application id, and the guild allowlist all
# sync from Infisical (/garrison/WARHORN_*) via external-secrets — nothing
# warhorn-specific to pin here. stt stays off until a transcription
# endpoint is picked; the bot is text-only and /join says so.
# NOTE: requires chart >= the release carrying the warhorn — until the
# version above is bumped past it, these keys are inert.
warhorn:
  enabled: true
# Post-mortem log source. Kubernetes drops a raid pod's logs when the pod goes,
# so `garrison keep logs`, the wartable panel, and the emissary pod_logs tool
# used to go blind on exactly the raids worth investigating. VictoriaLogs keeps
# 14d (monitoring/victoria-logs), and the keep falls back to it whenever the
# live pod read fails. Namespace defaults to runner.namespace (garrison), which
# is where the sortie pods log from. The keep has no egress NetworkPolicy, so
# nothing else is needed to reach the monitoring namespace.
# NOTE: requires chart >= the release carrying logArchive — until the version
# above is bumped past it, these keys are inert.
logArchive:
  url: http://victoria-logs.monitoring.svc.cluster.local:9428
secrets:
  authEnabled: true
  # wartable is VPN-only (envoy-internal); /internal stays token-gated.
  apiAuthEnabled: false
  externalSecrets:
    enabled: true
    store: infisical
    basePath: /garrison
    githubApp: true
    # OTLP collector endpoint for runner sortie pods and the keep itself —
    # synced by the chart's own garrison-runner-env/garrison-keep-env
    # ExternalSecrets (requires chart >= 0.25.0). Replaces the standalone
    # garrison-runner-otel/garrison-keep-otel ExternalSecrets, which raced
    # the chart's own ExternalSecrets for ownership of the same Secret.
    runnerOtel: true
    keepOtel: true
persistence:
  size: 5Gi
networkPolicy:
  enabled: true
  # Narrow exception to the runner sandboxes' private-range egress fence:
  # the toolhive MCP backend proxies in the ai namespace (see mcp.catalog
  # below). The other half is the garrison-runner ingress allowance in
  # ai/toolhive/toolhive-config/networkpolicy.yaml.
  runnerExtraEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcpserver
      ports:
        - protocol: TCP
          port: 8080
httpRoute:
  enabled: true
  hostname: garrison.wibrow.dev
  gateway:
    name: envoy-internal
    namespace: networking
    sectionName: https
  # GitHub can't reach envoy-internal (VPN-only) to deliver App webhooks —
  # route just POST /webhooks/github through envoy-external instead. Update
  # the GitHub App's webhook URL to https://garrison-hooks.wibrow.dev/webhooks/github.
  webhookExternal:
    enabled: true
    hostname: garrison-hooks.wibrow.dev
    gateway:
      name: envoy-external
      namespace: networking
      sectionName: https
# Remote MCP servers raid agents may use, selected per project (wartable
# checkboxes / herald /mcp / PATCH projects API). URLs are the toolhive
# backend proxies in the ai namespace — reachable from runner pods only via
# the runnerExtraEgress exception below plus the garrison-runner ingress in
# ai/toolhive/toolhive-config/networkpolicy.yaml. The github entry ships a
# read-only default tool allowlist (enforced in the runner by a PreToolUse
# deny hook); a project can widen it by overriding `tools` in its selection.
# NOTE: requires chart >= the release carrying mcp support — until the
# version above is bumped past it, these keys are inert.
mcp:
  catalog:
    - name: github
      url: http://mcp-github-proxy.ai.svc.cluster.local:8080/mcp
      description: GitHub repos/issues/PRs/actions (read-only default toolset)
      tools:
        - get_issue
        - get_issue_comments
        - list_issues
        - search_issues
        - get_pull_request
        - get_pull_request_files
        - get_pull_request_comments
        - list_pull_requests
        - search_code
        - get_file_contents
        - list_workflow_runs
        - get_workflow_run
        - get_job_logs
    - name: context7
      url: http://mcp-context7-proxy.ai.svc.cluster.local:8080/mcp
      description: Library documentation lookup (resolve-library-id, get-library-docs)
    - name: grafana
      url: http://mcp-grafana-proxy.ai.svc.cluster.local:8080/sse
      transport: sse
      description: Grafana dashboards, Prometheus/Loki queries
    - name: terraform
      url: http://mcp-terraform-proxy.ai.svc.cluster.local:8080/mcp
      description: Terraform registry providers/modules docs
    # The cluster-facing half of the catalog. These were held back originally
    # because their backends carry privileged identities, but each is read-only
    # at the identity itself, not merely by allowlist: kubernetes runs under the
    # cluster-**view** ClusterRole, argocd sets MCP_READ_ONLY, aws-api sets
    # READ_OPERATIONS_ONLY. That makes them safe to hand a raid agent debugging
    # a live deployment, which is most of what raids on this fleet do.
    - name: kubernetes
      url: http://mcp-kubernetes-proxy.ai.svc.cluster.local:8080/mcp
      description: Live cluster state — resources, pod logs, events (cluster-view RBAC, read-only)
    - name: argocd
      url: http://mcp-argocd-proxy.ai.svc.cluster.local:8080/mcp
      description: ArgoCD applications, sync status, and history (MCP_READ_ONLY)
    - name: aws-api
      url: http://mcp-aws-api-proxy.ai.svc.cluster.local:8080/mcp
      description: AWS API reads via the toolhive-aws-ro IRSA role (READ_OPERATIONS_ONLY)
    # database-toolbox exposes a per-cluster `*_execute_sql` alongside its
    # read tools, and home-assistant can actuate devices — neither backend is
    # read-only on its own, so both are held to a listing/read allowlist here
    # (enforced in the runner by the PreToolUse deny hook, not by the server).
    # The toolbox exposes one pair of tools per cloudnative-pg cluster,
    # `<cluster>_list_tables` and `<cluster>_execute_sql`, and it connects as
    # each database's app user — so execute_sql is a live write vector on prod
    # data. Only the schema-listing half is granted. A new cluster's entry has
    # to be added here explicitly; that is the point.
    - name: database-toolbox
      url: http://mcp-database-toolbox-proxy.ai.svc.cluster.local:8080/mcp
      description: Postgres schema inspection across the cloudnative-pg clusters (list_tables only)
      tools:
        - autobrr_list_tables
        - backstage_list_tables
        - firefly_list_tables
        - forgejo_list_tables
        - garrison_list_tables
        - gatus_list_tables
        - ghostfolio_list_tables
        - house-hunter_list_tables
        - litellm_list_tables
        - mattermost_list_tables
        - memini_list_tables
        - miniflux_list_tables
        - open-webui_list_tables
        - paperless_list_tables
        - propagit_list_tables
        - rybbit_list_tables
        - temporal_list_tables
    # hass-mcp can actuate the house: entity_action, call_service_tool and
    # restart_ha are omitted, everything granted below only reads state.
    - name: home-assistant
      url: http://mcp-home-assistant-proxy.ai.svc.cluster.local:8080/mcp
      description: Home Assistant entity/automation state and history (read-only subset)
      tools:
        - get_version
        - get_entity
        - list_entities
        - get_entities_by_area
        - search_entities_tool
        - domain_summary_tool
        - system_overview
        - list_automations
        - get_error_log
        - get_history
        - get_history_range
        - get_statistics
        - get_statistics_range
