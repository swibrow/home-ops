apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: garrison
resources:
  - networkpolicy-otel.yaml
components:
  - ../../../../components/cnpg-db-shared
configMapGenerator:
  - name: cnpg-db-config
    literals:
      - APP_NAME=garrison
      - SECRET_NAME=garrison-db-secret
      - CNPG_SECRET_KEY=ai-garrison
      - DB_SCHEME=postgresql
helmCharts:
  - name: garrison
    repo: oci://ghcr.io/swibrow/charts
    version: 0.60.3
    releaseName: garrison
    valuesFile: values.yaml
patches:
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: garrison-crier
        namespace: garrison
        annotations:
          gatus.home-operations.com/enabled: "false"
  - patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: garrison-keep-webhook
        namespace: garrison
        annotations:
          gatus.home-operations.com/enabled: "false"
