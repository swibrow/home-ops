# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Infisical entries required:
#   /herdr-sandbox/claude/GITHUB_TOKEN: fine-grained PAT, contents + pull-requests
#     read/write on the repos sessions work on
#   /ai/agentgateway/HERDR_SANDBOX_API_KEY: agentgateway client key (see
#     ai/agentgateway/config/externalsecret.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-sandbox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: claude-sandbox
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: /herdr-sandbox/claude/GITHUB_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Reuses the shared Claude subscription token (agentmemory owns the Infisical entry).
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: /ai/agentmemory/CLAUDE_CODE_OAUTH_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AGENTGATEWAY_API_KEY
      remoteRef:
        key: /ai/agentgateway/HERDR_SANDBOX_API_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
