# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Infisical entries required:
#   /ai/agentgateway/HERDR_SANDBOX_API_KEY: agentgateway client key (see
#     ai/agentgateway/config/externalsecret.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-sandbox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: claude-sandbox
    creationPolicy: Owner
  data:
    # Reuses the shared Claude subscription token (agentmemory owns the Infisical entry).
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: /ai/agentmemory/CLAUDE_CODE_OAUTH_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AGENTGATEWAY_API_KEY
      remoteRef:
        key: /ai/agentgateway/HERDR_SANDBOX_API_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Private key of the GitHub App that toolhive already uses (see
# ai/toolhive/toolhive-config/generator-github.yaml).
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: github-app
    creationPolicy: Owner
  data:
    - secretKey: private-key
      remoteRef:
        key: /ai/toolhive/GITHUB_APP_PRIVATE_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Installation token (key `token`, 60 min lifetime) refreshed every 20 min. Pods
# mount it as a file rather than an env var, because a warm pod can sit for
# hours before it is claimed and sessions run up to 12h.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-sandbox-github
spec:
  refreshInterval: 20m
  target:
    name: claude-sandbox-github
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: claude-sandbox
