---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Path-qualified key (not dataFrom.find): the store is scoped to "/" recursive
# and find silently drops names that exist in more than one folder.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pantry-admin-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: pantry-admin-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: /pantry/PANTRY_ADMIN_TOKEN
