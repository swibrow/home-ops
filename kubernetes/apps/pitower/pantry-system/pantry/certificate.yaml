---
# Default TLS cert for pantry's ingress-nginx: covers every tenant app
# hostname plus the API. Terminated at nginx; towonel passes SNI through raw.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pantry-wildcard
  namespace: pantry-system
spec:
  secretName: pantry-wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - "*.apps.cloudsnacks.dev"
    - api.pantry.cloudsnacks.dev
