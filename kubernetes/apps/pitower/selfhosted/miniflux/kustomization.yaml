---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted
resources:
  - externalsecret.yaml
components:
  - ../../../../components/cnpg-db-shared
configMapGenerator:
  - name: cnpg-db-config
    literals:
      - APP_NAME=miniflux
      - SECRET_NAME=miniflux-db-secret
      # Tenant secret in the database namespace, not a CNPG-generated -app
      # secret. It carries host/port/dbname as well as the credentials.
      - CNPG_SECRET_KEY=shared-miniflux
      - DB_SCHEME=postgresql
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.0.1
    releaseName: miniflux
    namespace: selfhosted
    valuesFile: values.yaml
