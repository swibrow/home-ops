---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Media and Home Assistant tokens are shared with the ops dashboard (homepage).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name family-home-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: HASS_TOKEN
      remoteRef:
        key: /selfhosted/homepage/hass_token
    - secretKey: JELLYFIN_TOKEN
      remoteRef:
        key: /selfhosted/homepage/jellyfin_token
    - secretKey: SONARR_TOKEN
      remoteRef:
        key: /selfhosted/homepage/sonarr_token
    - secretKey: RADARR_TOKEN
      remoteRef:
        key: /selfhosted/homepage/radarr_token
---
# Tokens created for this app. Optional in the pod, so the page runs without
# them; ESO only syncs a Secret once every one of its keys exists in Infisical,
# so each integration that may be missing gets its own Secret.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name family-home-integrations
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: /selfhosted/family-home/IMMICH_API_KEY
    - secretKey: MEALIE_TOKEN
      remoteRef:
        key: /selfhosted/family-home/MEALIE_TOKEN
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name family-home-actual
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: ACTUAL_SESSION_TOKEN
      remoteRef:
        key: /selfhosted/family-home/ACTUAL_SESSION_TOKEN
    - secretKey: ACTUAL_SYNC_ID
      remoteRef:
        key: /selfhosted/family-home/ACTUAL_SYNC_ID
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Kanidm OAuth2 client secret for the SecurityPolicy (Envoy Gateway reads the
# "client-secret" key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name family-home-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: *name
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: /selfhosted/family-home/OIDC_CLIENT_SECRET
