---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: cryptgeon-dragonfly
  namespace: selfhosted
spec:
  replicas: 1
  # maxmemory instead of a pod limit; Dragonfly needs more than 256Mi per io thread.
  # Cryptgeon's secrets are viewable once then evicted, so no persistence/snapshot.
  args:
    - "--proactor_threads=1"
    - "--maxmemory=512mb"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
