---
# API key(s) for the Envoy apiKeyAuth SecurityPolicy on the atuin route
# (securitypolicy.yaml). EG treats each Secret data key as a client id and its
# value as the API key (no Bearer prefix). Value should be a Kanidm
# service-account API token (kanidm service-account api-token generate), so
# the credential stays issued/revocable/audited through Kanidm even though EG
# checks it as an opaque string. Add more secretKeys (each its own Infisical
# path) to issue additional per-device keys.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atuin-apikeys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: atuin-apikeys
    creationPolicy: Owner
  data:
    - secretKey: default
      remoteRef:
        key: /selfhosted/atuin/GATEWAY_API_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
