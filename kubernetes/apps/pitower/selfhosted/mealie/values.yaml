controllers:
  mealie:
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/mealie-recipes/mealie
          tag: v3.30.0
        env:
          ALLOW_SIGNUP: "false"
          ALLOW_PASSWORD_LOGIN: "false"
          BASE_URL: https://recipes.wibrow.dev
          TZ: Europe/Zurich
          OIDC_AUTH_ENABLED: "true"
          OIDC_CONFIGURATION_URL: https://idm.wibrow.dev/oauth2/openid/mealie/.well-known/openid-configuration
          OIDC_CLIENT_ID: mealie
          OIDC_AUTO_REDIRECT: "true"
          OIDC_SIGNUP_ENABLED: "true"
          OIDC_ADMIN_GROUP: admins@idm.wibrow.dev
          OIDC_USER_GROUP: apps@idm.wibrow.dev
        envFrom:
          - secretRef:
              name: mealie-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                port: &port 9000
                path: /api/app/about
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5

        resources:
          requests:
            cpu: 20m
            memory: 286Mi
service:
  app:
    controller: mealie
    ports:
      http:
        port: *port

route:
  app:
    enabled: true
    hostnames:
      - recipes.wibrow.dev
    parentRefs:
      - name: envoy-external
        namespace: networking
        sectionName: https

persistence:
  data:
    existingClaim: mealie-data
    globalMounts:
      - path: /app/data
  openai-patch:
    type: configMap
    name: mealie-openai-patch
    globalMounts:
      - path: /opt/mealie/lib/python3.14/site-packages/mealie/services/openai/openai.py
        subPath: openai.py
        readOnly: true
  # The AI provider's API key is file:gateway. The app drops to uid 911, so
  # the token needs to be world-readable.
  ai-providers:
    type: custom
    volumeSpec:
      projected:
        defaultMode: 0444
        sources:
          - serviceAccountToken:
              audience: agentgateway
              expirationSeconds: 3600
              path: gateway
    globalMounts:
      - path: /run/secrets/ai-providers
        readOnly: true
