---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted
resources:
  - externalsecret.yaml
components:
  - ../../../../components/pvc
  - ../../../../components/kopiur
configMapGenerator:
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=mealie-pvc
      - CLAIM_NAME=mealie-data
      - STORAGE_SIZE=1Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=mealie-kopiur
      - CLAIM_NAME=mealie-data
patches:
  # mealie writes its data as uid 911; the kopiur mover must match to read it.
  - target:
      kind: SnapshotPolicy
      name: mealie-kopiur
    patch: |
      - op: replace
        path: /spec/mover/securityContext/runAsUser
        value: 911
      - op: replace
        path: /spec/mover/securityContext/runAsGroup
        value: 911
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.1.0
    releaseName: mealie
    namespace: selfhosted
    valuesFile: values.yaml
