controllers:
  n8n:
    annotations:
      reloader.stakater.com/auto: "true"

    pod:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: "OnRootMismatch"

    initContainers:
      # Re-owns data written under the app's previous uid; a no-op once everything is 2000:2000.
      chown-data:
        image:
          repository: public.ecr.aws/docker/library/busybox
          tag: latest
        command:
          - sh
          - -c
          - find /home/node/.n8n \( ! -user 2000 -o ! -group 2000 \) -exec chown -h 2000:2000 {} +
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
    containers:
      app:
        image:
          repository: ghcr.io/n8n-io/n8n
          tag: 2.44.1
        env:
          DB_SQLITE_VACUUM_ON_STARTUP: true
          EXECUTIONS_DATA_PRUNE: true
          EXECUTIONS_DATA_MAX_AGE: 7
          EXECUTIONS_DATA_PRUNE_MAX_COUNT: 50000
          GENERIC_TIMEZONE: "Europe/Zurich"
          N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
          N8N_PROTOCOL: "https"
          N8N_PORT: &port 8080
          N8N_HOST: &hostName n8n.wibrow.dev
          N8N_LOG_LEVEL: info
          N8N_LOG_OUTPUT: console
          # uid 2000 has no passwd entry, so HOME resolves to / without this.
          N8N_USER_FOLDER: /home/node
          WEBHOOK_URL: https://n8n-webhook.wibrow.dev
        resources:
          requests:
            cpu: 26m
            memory: 304Mi
          limits:
            memory: 2Gi

service:
  app:
    controller: n8n
    ports:
      http:
        port: *port

persistence:
  data:
    existingClaim: n8n
    advancedMounts:
      n8n:
        app:
          - path: /home/node/.n8n
        chown-data:
          - path: /home/node/.n8n
  # The image's /home/node is owned by uid 1000; n8n writes generated static assets here on start.
  cache:
    type: emptyDir
    advancedMounts:
      n8n:
        app:
          - path: /home/node/.cache

route:
  app:
    enabled: true
    hostnames:
      - n8n.wibrow.dev
    parentRefs:
      - name: envoy-external
        namespace: networking
        sectionName: https
  webhooks:
    enabled: true
    hostnames:
      - n8n-webhook.wibrow.dev
    parentRefs:
      - name: envoy-external
        namespace: networking
        sectionName: https
    rules:
      - matches:
          - path:
              value: /
        backendRefs:
          - name: n8n
            port: *port
