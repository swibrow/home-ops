---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: arc-controller
  namespace: arc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gha-rs-controller
  podMetricsEndpoints:
    - targetPort: 8080
      path: /metrics
      interval: 30s
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: arc-listeners
  namespace: arc
spec:
  # Listener pods are created by the controller, not the chart, so they are only
  # reachable by label — there is no Service to hang a ServiceMonitor off.
  selector:
    matchLabels:
      app.kubernetes.io/component: runner-scale-set-listener
  # ARC's own dashboard filters on these two as metric labels, so promote them
  # off the pod. The operator sanitises the dots to underscores
  # (actions_github_com_scale_set_name).
  podTargetLabels:
    - actions.github.com/scale-set-name
    - actions.github.com/scale-set-namespace
  podMetricsEndpoints:
    - targetPort: 8080
      path: /metrics
      interval: 30s
      # Without this the operator's `namespace` (the listener's own, "arc") masks
      # the one the exporter emits, and the scale set's namespace lands in
      # exported_namespace instead. ARC's dashboard assumes namespace is the
      # runner namespace, which only holds when the exposed label wins.
      honorLabels: true
      metricRelabelings:
        # job_workflow_ref carries the branch (…/lint.yaml@refs/heads/<branch>), so
        # across 27 repos with renovate/* branches it multiplies series without
        # adding signal. job_workflow_name identifies the workflow on its own.
        - action: labeldrop
          regex: job_workflow_ref
        # Always empty on a non-enterprise account.
        - action: labeldrop
          regex: enterprise
