  - name: gha-runner-scale-set
    repo: oci://ghcr.io/actions/actions-runner-controller-charts
    version: 0.14.2
    releaseName: garrison-runners
    namespace: arc-runners
    valuesFile: values.yaml
    valuesMerge: override
    valuesInline:
      githubConfigUrl: https://github.com/swibrow/garrison
      runnerScaleSetName: garrison
      # garrison's ci workflow fans out on a main push (five gates plus a keep
      # and a runner image build at once), so minRunners keeps one warm - that
      # is what takes the ~10 minute ARC cold start off the front of every run.
      minRunners: 1
      # worker-07 is the sole compute node and shared with every other repo's
      # runners; at 1 CPU/12Gi each, an unbounded garrison burst (multiple
      # concurrent pushes) can alone push the node into contention. Cap so
      # garrison can't monopolize it - 6 covers one full fan-out (3 jobs) plus
      # headroom for a second push queued behind it.
      maxRunners: 6
      template:
        spec:
          serviceAccountName: garrison-runners
          # Both CI scratch paths are tmpfs. worker-07 is the only compute node,
          # so it carries all of these runners on top of frigate, the ai
          # namespace and monitoring - sda sustains ~6700 w/s at queue depth 28,
          # and a 4k fsync from inside a runner measured 37ms at rest and >240ms
          # under a CI fan-out. That is not a throughput problem (bulk writes hit
          # ~107MB/s and 100 file creates take 37ms); it is fsync latency on the
          # shared containerd overlayfs, and it is what makes garrison's gates
          # time out. The same node:sqlite open/write/reopen cycle that herald's
          # binding-store test performs runs 6x faster on tmpfs than on the
          # overlay on an idle node, and tmpfs does not degrade under a fan-out
          # because no block device is involved. `work` is where the checkout,
          # node_modules (2.4GB / ~101k files) and dist land; /tmp is where
          # os.tmpdir() tests write.
          #
          # values.yaml's template.spec.volumes/containers are plain lists, not
          # merged by name - overriding either here replaces the whole list, so
          # dind-sock/dind-externals/var-lib-docker (needed by the base
          # init-dind-externals and dind initContainers) have to be repeated
          # below or pod creation fails validation.
          volumes:
            - name: dind-sock
              emptyDir: {}
            - name: dind-externals
              emptyDir: {}
            - name: var-lib-docker
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    storageClassName: openebs-hostpath-runners
                    resources:
                      requests:
                        storage: 40Gi
            # A green run puts 3.4Gi in `work` (checkout + node_modules + every
            # package's dist) plus setup-node's tool cache, so 8Gi is a bit over
            # 2x headroom.
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 2Gi
          containers:
            - name: runner
              image: ghcr.io/cloudsnacks/actions-runner:2.336.0-3
              command: ["/home/runner/run.sh"]
              env:
                - name: DOCKER_HOST
                  value: unix:///var/run/docker.sock
                - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                  value: "120"
              volumeMounts:
                - name: work
                  mountPath: /home/runner/_work
                - name: dind-sock
                  mountPath: /var/run
                - name: tmp
                  mountPath: /tmp
              resources:
                # tmpfs pages count against the container's memory cgroup and
                # cannot be reclaimed, so both sizeLimits (10Gi) are memory this
                # pod can really pin, on top of the job itself - a gate peaked
                # at ~2.3Gi. The request has to carry that, not just the limit:
                # with maxRunners unset the only thing bounding a wide burst is
                # the scheduler, and it can only bound what it was told to
                # reserve.
                requests:
                  cpu: 1
                  memory: 12Gi
                limits:
                  memory: 14Gi
