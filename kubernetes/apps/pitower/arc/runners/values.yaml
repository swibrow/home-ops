# Common values for every runner scale set. ARC has no personal-account-wide
# scope, only repo/org/enterprise, so each repo needs its own scale set — add a
# helmCharts entry in kustomization.yaml (githubConfigUrl, runnerScaleSetName,
# serviceAccountName) plus a ServiceAccount in rbac.yaml.
githubConfigSecret: arc-github-app

controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: arc

# maxRunners was left unset on the theory that scale-up is "bounded by cluster
# capacity, not by ARC". That stopped being true once the work dir and
# /var/lib/docker moved onto node-local hostpath PVCs: openebs hostpath only
# creates a directory, so it reserves nothing and rejects nothing, and there is
# no capacity signal left to push back on the listener.
#
# On 2026-08-08 home-ops sat at 15 runners, every one Pending, each claiming
# 60Gi against a 458G pool on the single node that has the mount and each
# needing its own init-pvc helper pod there. PVC binding hit "context deadline
# exceeded" and the pods churned instead of running any jobs. Cap concurrency to
# what worker-07 can actually provision; raise only alongside that node's
# storage, not in response to a queue.
maxRunners: 6
minRunners: 0

# No containerMode: the pod spec below is the chart's own dind-mode output
# (chart 0.14.2 helpers, k8s>=1.29 sidecar variant) written out explicitly.
# Reason: containerMode.type=dind generates the dind container with no way to
# relocate /var/lib/docker, which is where per-job image pulls land. Here both
# the work dir and docker storage live on ephemeral PVCs from an SSD-backed
# storage class instead of the spinning rpool. PVCs are born and die with the
# pod - same disposable semantics as the emptyDirs they replace. Re-diff
# against the chart helpers on chart upgrades.
#
# Temporarily on openebs-hostpath-ssd (zpool `scratch`) while the `runners`
# zpool is rebuilt onto the 500GB EVOs; revert to openebs-hostpath-runners
# once the new pool and scsi2 are back.
template:
  spec:
    automountServiceAccountToken: true
    nodeSelector:
      wibrow.dev/compute: "true"
    tolerations:
      - key: dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:2.336.0
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker:dind
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        restartPolicy: Always
        startupProbe:
          exec:
            command: ["docker", "info"]
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: var-lib-docker
            mountPath: /var/lib/docker
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.336.0
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 4Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
    volumes:
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: work
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: openebs-hostpath-ssd
              resources:
                requests:
                  storage: 20Gi
      - name: var-lib-docker
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: openebs-hostpath-ssd
              resources:
                requests:
                  storage: 40Gi
