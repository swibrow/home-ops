# Common values for every runner scale set. ARC has no personal-account-wide
# scope, only repo/org/enterprise, so each repo needs its own scale set — add a
# helmCharts entry in kustomization.yaml (githubConfigUrl, runnerScaleSetName,
# serviceAccountName) plus a ServiceAccount in rbac.yaml.
githubConfigSecret: arc-github-app

controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: arc

# maxRunners was left unset on the theory that scale-up is "bounded by cluster
# capacity, not by ARC". That stopped being true once the work dir and
# /var/lib/docker moved onto node-local hostpath PVCs: openebs hostpath only
# creates a directory, so it reserves nothing, and there is no capacity signal
# to push back on the listener.
#
# On 2026-08-08 home-ops sat at 15 runners, every one Pending, each claiming
# 60Gi against a 458G pool on the single node that has the mount and each
# needing its own init-pvc helper pod there. PVC binding hit "context deadline
# exceeded" and the pods churned instead of running any jobs. Cap concurrency to
# what worker-07 can actually provision; raise only alongside that node's
# storage, not in response to a queue.
#
# XFS project quotas now cap each claim, so a single runaway job can no longer
# eat the volume - but quotas limit, they do not reserve, so the sum of claims
# can still exceed the disk and this cap is still what prevents that. At 6 the
# worst case is 360Gi of runner claims alongside 190Gi of TSDBs and 100Gi of app
# PVCs, against an 800G volume.
maxRunners: 6
minRunners: 0

# No containerMode: the pod spec below is the chart's own dind-mode output
# (chart 0.14.2 helpers, k8s>=1.29 sidecar variant) written out explicitly.
# Reason: containerMode.type=dind generates the dind container with no way to
# relocate /var/lib/docker, which is where per-job image pulls land. Here both
# the work dir and docker storage live on ephemeral PVCs rather than emptyDirs,
# so they are born and die with the pod but stay off the system disk. Re-diff
# against the chart helpers on chart upgrades.
#
# These used to come from openebs-hostpath-runners, a separate disk kept apart
# from the monitoring TSDBs so a runner burst could not fill the disk under
# them. Both now share worker-07's `extra` volume: that separation stopped
# meaning anything once both disks became zvols on the same rpool, and the
# guarantee comes from XFS project quotas instead - openebs-hostpath enforces
# each PVC's requested size as a hard limit, so a runaway job fills its own
# 20Gi/40Gi claim and nothing else.
template:
  spec:
    automountServiceAccountToken: true
    nodeSelector:
      wibrow.dev/compute: "true"
    tolerations:
      - key: dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:2.337.0
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker:dind
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        restartPolicy: Always
        startupProbe:
          exec:
            command: ["docker", "info"]
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: var-lib-docker
            mountPath: /var/lib/docker
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.337.0
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 4Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
    volumes:
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: work
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: openebs-hostpath
              resources:
                requests:
                  storage: 20Gi
      - name: var-lib-docker
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: openebs-hostpath
              resources:
                requests:
                  storage: 40Gi
