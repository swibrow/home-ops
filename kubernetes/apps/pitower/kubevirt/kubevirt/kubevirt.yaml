---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates: []
    # VM nodes have mismatched CPUs (Ryzen, N100, Xeon), so live migration
    # never finds a target; drains and upgrades restart VMs instead.
    evictionStrategy: None
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  # Defaults to openshift-monitoring/prometheus-k8s; without these the
  # operator skips the ServiceMonitor and PrometheusRules entirely.
  monitorNamespace: monitoring
  monitorAccount: kube-prometheus-stack-prometheus
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - Evict
  # The Pis (worker-08/09/10) are arm64; keep virt-handler and VMs on amd64.
  # worker-05/06 have VT-x disabled in the BIOS (no /dev/kvm), so they can
  # never run a VM; drop them from the list once it is enabled. worker-ai-01's
  # dedicated=gpu taint is tolerated so a VM can claim the RTX 3090 Ti there
  # through the DRA driver's vfio.gpu.nvidia.com class; VMs still need their
  # own toleration to land on it.
  workloads:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - worker-05
                      - worker-06
