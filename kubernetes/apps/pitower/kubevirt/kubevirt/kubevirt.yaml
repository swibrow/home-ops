---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates:
        - HostDevices
    # Keyboard and Logitech G502 mouse on worker-ai-01, for the omarchy VM.
    # Only the USB devices: passing their whole controller (1022:15b8) through
    # hangs the host. KubeVirt attaches them by bus:devnum, so they must be
    # plugged in when the VM starts, and a replug drops them until it restarts.
    permittedHostDevices:
      usb:
        - resourceName: kubevirt.io/usb-keyboard
          selectors:
            - vendor: "05af"
              product: "1053"
        - resourceName: kubevirt.io/usb-mouse
          selectors:
            - vendor: "046d"
              product: "c08b"
      # The RTX 3090 Ti's HDMI audio function, bound to vfio-pci by the
      # worker-ai-01 Talos patch. The DRA claim only covers the GPU function.
      pciHostDevices:
        - pciVendorSelector: "10DE:1AEF"
          resourceName: nvidia.com/GA102_HDMI_AUDIO
    # VM nodes have mismatched CPUs (Ryzen, N100, Xeon), so live migration
    # never finds a target; drains and upgrades restart VMs instead.
    evictionStrategy: None
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  # Defaults to openshift-monitoring/prometheus-k8s; without these the
  # operator skips the ServiceMonitor and PrometheusRules entirely.
  monitorNamespace: monitoring
  monitorAccount: kube-prometheus-stack-prometheus
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - Evict
  # The Pis (worker-08/09/10) are arm64; keep virt-handler and VMs on amd64.
  # worker-05/06 have VT-x disabled in the BIOS (no /dev/kvm), so they can
  # never run a VM; drop them from the list once it is enabled. worker-ai-01's
  # dedicated=gpu taint is tolerated so a VM can claim the RTX 3090 Ti there
  # through the DRA driver's vfio.gpu.nvidia.com class; VMs still need their
  # own toleration to land on it.
  workloads:
    nodePlacement:
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - worker-05
                      - worker-06
