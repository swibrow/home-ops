# Pitwall: multi-tenant GitHub Actions telemetry dashboard
# (github.com/cloudsnacks/pitwall). Tenants are installations of the public
# Pitwall GitHub App (currently the cloudsnacks org and the swibrow personal
# account); all installations deliver webhooks to the same endpoint and are
# onboarded automatically.

# The ghcr.io/cloudsnacks/pitwall package is private, and the ghcr-pull-secret
# ClusterExternalSecret already lands in every namespace.
defaultPodOptions:
  imagePullSecrets:
    - name: ghcr-pull-secret
  securityContext:
    # The image is distroless nonroot.
    runAsUser: 65532
    runAsGroup: 65532

controllers:
  pitwall:
    # Since v1.3.0 replicas scale horizontally: SSE fans out through
    # Postgres NOTIFY, the dead-letter queue lives in Postgres, and cron
    # jobs take advisory locks. Startup migrations serialize via
    # golang-migrate's advisory lock, so rolling updates are safe.
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: "0"
      surge: 1
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          # CI publishes :latest and :<git-sha> on every push to main; pin the
          # SHA and bump it to roll out.
          repository: ghcr.io/cloudsnacks/pitwall
          tag: v1.3.0
        env:
          TZ: Europe/Zurich
          # The cnpg-db component emits DB_URL in pitwall-db-secret.
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: pitwall-db-secret
                key: DB_URL
        envFrom:
          - secretRef:
              name: pitwall-secret
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: &httpPort 8080
              initialDelaySeconds: 5
              periodSeconds: 10
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *httpPort
              initialDelaySeconds: 10
              periodSeconds: 30
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

service:
  app:
    controller: pitwall
    ports:
      http:
        port: *httpPort

route:
  app:
    hostnames:
      - pitwall.wibrow.dev
    parentRefs:
      # External: GitHub webhook deliveries come in from the internet.
      - name: envoy-external
        namespace: networking
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *httpPort
