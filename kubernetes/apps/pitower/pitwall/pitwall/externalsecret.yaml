---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Database credentials come from the cnpg-db component (pitwall-db-secret).
#
# Key names carry through verbatim into the Secret and reach the container via
# envFrom, so name them in Infisical under /pitwall exactly as pitwall reads
# them (cloudsnacks/pitwall docs/configuration.md). All of these come out of the
# GitHub App manifest conversion (cloudsnacks/pitwall
# deploy/github-app-manifest.html) except SESSION_SECRET:
#
#   GITHUB_WEBHOOK_SECRET          - HMAC for POST /api/webhook
#   SESSION_SECRET                 - openssl rand -hex 32
#   GITHUB_CLIENT_ID               - the app's OAuth client credentials (sign-in)
#   GITHUB_CLIENT_SECRET
#   GITHUB_APP_ID                  - only needed for --backfill jobs
#   GITHUB_INSTALLATION_ID
#   GITHUB_APP_PRIVATE_KEY_BASE64
#
# Unlike rackrat there is no `optional: true` on the consumer side: the server
# refuses to start without these, so an empty /pitwall folder should fail loud.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pitwall
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: pitwall-secret
    creationPolicy: Owner
  dataFrom:
    # The store is scoped to "/" recursive, so path here is a prefix filter over
    # every secret in the project, not a folder that has to exist.
    - find:
        path: /pitwall
        conversionStrategy: Default
        decodingStrategy: None
