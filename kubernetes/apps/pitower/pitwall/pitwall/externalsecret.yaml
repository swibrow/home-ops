---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Database credentials come from the cnpg-db component (pitwall-db-secret).
#
# Key names carry through verbatim into the Secret and reach the container via
# envFrom, so name them in Infisical under /pitwall exactly as pitwall reads
# them (cloudsnacks/pitwall docs/configuration.md). All of these come out of the
# GitHub App manifest conversion (cloudsnacks/pitwall
# deploy/github-app-manifest.html) except SESSION_SECRET:
#
#   GITHUB_WEBHOOK_SECRET          - HMAC for POST /api/webhook
#   SESSION_SECRET                 - openssl rand -hex 32
#   GITHUB_CLIENT_ID               - the app's OAuth client credentials (sign-in)
#   GITHUB_CLIENT_SECRET
#   GITHUB_APP_ID                  - only needed for --backfill jobs
#   GITHUB_INSTALLATION_ID
#   GITHUB_APP_PRIVATE_KEY_BASE64
#
# Unlike rackrat there is no `optional: true` on the consumer side: the server
# refuses to start without these, so a missing key should fail loud.
#
# Listed key by key rather than `dataFrom.find`: the store is scoped to "/"
# recursive, and a find silently drops any name that also exists in another
# folder. GITHUB_WEBHOOK_SECRET and GITHUB_CLIENT_ID do, so the find synced 5 of
# 7 keys and the server never started. A path-qualified key is unambiguous.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pitwall
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: pitwall-secret
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: /pitwall/GITHUB_WEBHOOK_SECRET
    - secretKey: SESSION_SECRET
      remoteRef:
        key: /pitwall/SESSION_SECRET
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: /pitwall/GITHUB_CLIENT_ID
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: /pitwall/GITHUB_CLIENT_SECRET
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: /pitwall/GITHUB_APP_ID
    - secretKey: GITHUB_INSTALLATION_ID
      remoteRef:
        key: /pitwall/GITHUB_INSTALLATION_ID
    - secretKey: GITHUB_APP_PRIVATE_KEY_BASE64
      remoteRef:
        key: /pitwall/GITHUB_APP_PRIVATE_KEY_BASE64
