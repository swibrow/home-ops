---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pitwall
resources:
  - externalsecret.yaml
components:
  - ../../../../components/cnpg-db-shared
configMapGenerator:
  - name: cnpg-db-config
    literals:
      - APP_NAME=pitwall
      - SECRET_NAME=pitwall-db-secret
      - CNPG_SECRET_KEY=shared-pitwall
      # pgx accepts both postgres:// and postgresql://; keep the template's default.
      - DB_SCHEME=postgresql
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.1.0
    releaseName: pitwall
    namespace: pitwall
    valuesFile: values.yaml
