---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pitwall
resources:
  - externalsecret.yaml
components:
  - ../../../../components/cnpg-db-shared
  - ../../../../components/pvc
configMapGenerator:
  - name: cnpg-db-config
    literals:
      - APP_NAME=pitwall
      - SECRET_NAME=pitwall-db-secret
      - CNPG_SECRET_KEY=shared-pitwall
      # pgx accepts both postgres:// and postgresql://; keep the template's default.
      - DB_SCHEME=postgresql
  # Persists the dead-letter queue (webhook events received during a database
  # outage) across pod restarts.
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=pitwall-pvc
      - CLAIM_NAME=pitwall
      - STORAGE_SIZE=1Gi
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.0.1
    releaseName: pitwall
    namespace: pitwall
    valuesFile: values.yaml
