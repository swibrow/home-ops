# The cluster's only CNPG operator.
#
# Two operators cannot coexist: the admission webhook configurations are
# cluster-scoped with names hardcoded in the operator
# (cnpg-{mutating,validating}-webhook-configuration), and every operator
# unconditionally re-patches their caBundle with its own generated CA on a
# periodic reconcile loop. Two of them ping-pong that field, and whichever
# loses leaves the caBundle disagreeing with the serving cert behind
# clientConfig.service, breaking every Cluster create/update cluster-wide.
# There is no opt-out: `manager controller --help` on 1.30.0 exposes no flag
# for it, and the chart grants the webhook patch RBAC regardless of
# config.clusterWide.
#
# So this release owns the webhook configurations (they render pointing at
# database/cnpg-webhook-service, matching this operator's serving cert) and the
# CRDs, taken over from the release that used to run in `cloudnative-pg`.
#
# clusterWide stays true because the webhook configurations and the CRDs are
# cluster-scoped and a namespaced Role could not reconcile them; WATCH_NAMESPACE
# is what actually confines the operator to the Clusters in this namespace.
crds:
  create: true
config:
  clusterWide: true
  data:
    WATCH_NAMESPACE: database
webhook:
  mutating:
    create: true
  validating:
    create: true
monitoring:
  podMonitorEnabled: true
  grafanaDashboard:
    create: false
