---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
#
# Tenants of the shared/ai clusters — one file per app, each holding the
# credential ExternalSecret plus the Database and DatabaseRole CRs.
#
# Kept as its own ArgoCD app rather than folded into ../clusters so onboarding a
# tenant never shows up as a diff against a Cluster resource.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database
resources:
  - autobrr.yaml
  - firefly.yaml
  - forgejo.yaml
  - garrison.yaml
  - gatus.yaml
  - ghostfolio.yaml
  - goat.yaml
  - house-hunter.yaml
  - litellm.yaml
  - memini.yaml
  - miniflux.yaml
  - mlflow.yaml
  - open-webui.yaml
  - paperless.yaml
  - phoenix.yaml
  - pitwall.yaml
  - propagit.yaml
  - rackrat.yaml
  - rybbit.yaml
