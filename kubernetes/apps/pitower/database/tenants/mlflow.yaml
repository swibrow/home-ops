---
# See miniflux.yaml for why the tenant secret is basic-auth, why it carries
# host/port/dbname, and why target.template.metadata is pinned.
#
# On the `ai` cluster alongside memini/litellm/open-webui/phoenix — this is a
# trial deployment evaluating MLflow as a Claude Code tracing backend, see
# ai/mlflow/kustomization.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-mlflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ai-mlflow
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: mlflow
        password: "{{ .password }}"
        host: ai-rw.database.svc.cluster.local
        port: "5432"
        dbname: mlflow
  data:
    - secretKey: password
      remoteRef:
        key: /database/tenants/MLFLOW_PASSWORD
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: mlflow
spec:
  cluster:
    name: ai
  name: mlflow
  login: true
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: ai-mlflow
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ai-mlflow
spec:
  cluster:
    name: ai
  name: mlflow
  owner: mlflow
  databaseReclaimPolicy: retain
