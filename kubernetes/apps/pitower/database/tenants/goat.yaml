---
# See miniflux.yaml for why the tenant secret is basic-auth, why it carries
# host/port/dbname, and why target.template.metadata is pinned.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-goat
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ai-goat
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: goat
        password: "{{ .password }}"
        host: ai-rw.database.svc.cluster.local
        port: "5432"
        dbname: goat
  data:
    - secretKey: password
      remoteRef:
        key: /database/tenants/GOAT_PASSWORD
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: goat
spec:
  cluster:
    name: ai
  name: goat
  login: true
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: ai-goat
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ai-goat
spec:
  cluster:
    name: ai
  name: goat
  owner: goat
  databaseReclaimPolicy: retain
