---
# See miniflux.yaml for why the tenant secret is basic-auth, why it carries
# host/port/dbname, and why target.template.metadata is pinned.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-garrison
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ai-garrison
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: garrison
        password: "{{ .password }}"
        host: ai-rw.database.svc.cluster.local
        port: "5432"
        dbname: garrison
  data:
    - secretKey: password
      remoteRef:
        key: /database/tenants/GARRISON_PASSWORD
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: garrison
spec:
  cluster:
    name: ai
  name: garrison
  login: true
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: ai-garrison
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ai-garrison
spec:
  cluster:
    name: ai
  name: garrison
  owner: garrison
  databaseReclaimPolicy: retain
