---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shared-atuin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: shared-atuin
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: atuin
        password: "{{ .password }}"
        host: shared-rw.database.svc.cluster.local
        port: "5432"
        dbname: atuin
  data:
    - secretKey: password
      remoteRef:
        key: /database/tenants/ATUIN_PASSWORD
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: atuin
spec:
  cluster:
    name: shared
  name: atuin
  login: true
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: shared-atuin
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: shared-atuin
spec:
  cluster:
    name: shared
  name: atuin
  owner: atuin
  databaseReclaimPolicy: retain
