---
# See miniflux.yaml for why the tenant secret is basic-auth, why it carries
# host/port/dbname, and why target.template.metadata is pinned.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shared-firefly
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: shared-firefly
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: firefly
        password: "{{ .password }}"
        host: shared-rw.database.svc.cluster.local
        port: "5432"
        dbname: firefly
  data:
    - secretKey: password
      remoteRef:
        key: /database/tenants/FIREFLY_PASSWORD
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: firefly
spec:
  cluster:
    name: shared
  name: firefly
  login: true
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: shared-firefly
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: shared-firefly
spec:
  cluster:
    name: shared
  name: firefly
  owner: firefly
  databaseReclaimPolicy: retain
