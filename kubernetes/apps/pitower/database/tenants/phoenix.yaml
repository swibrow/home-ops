---
# See miniflux.yaml for why the tenant secret is basic-auth, why it carries
# host/port/dbname, and why target.template.metadata is pinned.
#
# Unlike the other tenants this password is NOT carried over: phoenix came from
# a dedicated cluster whose credential CNPG generated itself, so there was never
# an Infisical value to preserve. The app reads the new one out of this secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-phoenix
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ai-phoenix
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: phoenix
        password: "{{ .password }}"
        host: ai-rw.database.svc.cluster.local
        port: "5432"
        dbname: phoenix
  data:
    - secretKey: password
      remoteRef:
        key: /database/tenants/PHOENIX_PASSWORD
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: phoenix
spec:
  cluster:
    name: ai
  name: phoenix
  login: true
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: ai-phoenix
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ai-phoenix
spec:
  cluster:
    name: ai
  name: phoenix
  owner: phoenix
  databaseReclaimPolicy: retain
