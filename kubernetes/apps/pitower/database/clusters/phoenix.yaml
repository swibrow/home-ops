---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: phoenix
  namespace: database
spec:
  instances: 2
  bootstrap:
    initdb:
      database: phoenix
      owner: phoenix
  storage:
    # Phoenix stores spans as rows, so this grows with tracing volume rather than
    # staying flat. Paired with database.defaultRetentionPolicyDays in the app.
    size: 10Gi
    storageClass: openebs-hostpath
  monitoring:
    enablePodMonitor: true
