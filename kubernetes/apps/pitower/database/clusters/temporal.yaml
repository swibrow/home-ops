---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
#
# Deliberately has no bootstrap.initdb. Temporal owns its own schema: the server
# runs with createDatabase/manageSchema enabled and creates `temporal` and
# `temporal_visibility` itself, as the superuser, which is why it connects as
# `postgres` rather than through an app role. CNPG still creates its default
# `app` database here; nothing uses it.
#
# Data is NOT migrated from the old cluster - the schema is rebuilt from scratch
# on first connect, discarding prior workflow history and visibility records.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: temporal
  namespace: database
spec:
  # Single instance, as on the old cluster. primaryUpdateMethod is therefore
  # left at the default: with no replica there is nothing to switch over to.
  instances: 1
  # pg17 on the old cluster. Nothing carries across, so the new schema is
  # created directly on 18.
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  enableSuperuserAccess: true
  storage:
    size: 2Gi
    storageClass: openebs-hostpath
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
  monitoring:
    enablePodMonitor: true
