---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
#
# Dedicated rather than a tenant of `shared`: forgejo is the one database whose
# loss would cost source history, so it keeps its own postmaster, its own
# failure domain and its own backup stream.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo
  namespace: database
spec:
  instances: 2
  # pg17 on the old cluster. The move is a logical dump/restore either way, so
  # the major bump rides along rather than needing a second migration.
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  enableSuperuserAccess: true
  # On any PodSpec change CNPG defaults to restarting the primary in place. With
  # openebs-hostpath the data is node-local, so a primary that cannot reschedule
  # onto its own node leaves the cluster with no primary and writes down, with
  # no automatic failover. Switchover promotes the replica first instead.
  primaryUpdateMethod: switchover
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
  storage:
    size: 2Gi
    storageClass: openebs-hostpath
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
  monitoring:
    enablePodMonitor: true
