---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    # Must match `clickhouse.access.secret.name` in the rendered operator config,
    # which follows fullnameOverride.
    name: clickhouse-operator
  data:
    - secretKey: username
      remoteRef:
        key: /database/clickhouse-operator/CH_USERNAME
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: /database/clickhouse-operator/CH_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
