---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-pg
  namespace: database
---
# Read-only on secrets cluster-wide, plus the selfsubjectrulesreview the ESO
# kubernetes provider issues to validate the store. Cluster-scoped and shared,
# so it lives with the only store that still binds it — it used to be defined
# alongside the retired `cnpg-secrets` store in the cloudnative-pg namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-pg
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-pg-database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-pg
subjects:
  - kind: ServiceAccount
    name: external-secrets-pg
    namespace: database
---
# Lets the database-toolbox MCP backend (ai namespace) read the Postgres credential
# secrets here so its init container can build a multi-source genai-toolbox config
# dynamically. Scoped to secrets in this namespace only — the same DB credentials the
# toolbox connects with. Mirrors the Role it already has in cloudnative-pg, which goes
# away with that namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: toolhive-database-toolbox-secrets-reader
  namespace: database
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: toolhive-database-toolbox-secrets-reader
  namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: toolhive-database-toolbox-secrets-reader
subjects:
  - kind: ServiceAccount
    name: toolhive-database-toolbox
    namespace: ai
