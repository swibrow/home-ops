---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: banking
resources:
  - ./externalsecret.yaml
components:
  - ../../../../components/pvc
  - ../../../../components/kopiur
  - ../../../../components/cnpg-db
configMapGenerator:
  - name: cnpg-db-config
    literals:
      - APP_NAME=firefly
      - SECRET_NAME=firefly-db-secrets
      - CNPG_SECRET_KEY=firefly-app
      - DB_SCHEME=postgresql
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=firefly-pvc
      - CLAIM_NAME=firefly-data
      - STORAGE_SIZE=1Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=firefly-kopiur
      - CLAIM_NAME=firefly-data
patches:
  # firefly runs as www-data (uid 33); the kopiur mover must match to read it.
  - target:
      kind: SnapshotPolicy
      name: firefly-kopiur
    patch: |
      - op: replace
        path: /spec/mover/securityContext/runAsUser
        value: 33
      - op: replace
        path: /spec/mover/securityContext/runAsGroup
        value: 33
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.0.1
    releaseName: firefly
    namespace: banking
    valuesFile: values.yaml
