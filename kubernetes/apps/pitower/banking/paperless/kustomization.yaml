---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: banking
resources:
  - ./externalsecret.yaml
components:
  - ../../../../components/pvc
  - ../../../../components/kopiur
  - ../../../../components/cnpg-db
configMapGenerator:
  - name: cnpg-db-config
    literals:
      - APP_NAME=paperless
      - SECRET_NAME=paperless-db-secrets
      - CNPG_SECRET_KEY=paperless-app
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=paperless-pvc
      - CLAIM_NAME=paperless-data
      - STORAGE_SIZE=5Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=paperless-kopiur
      - CLAIM_NAME=paperless-data
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.0.1
    releaseName: paperless
    namespace: banking
    valuesFile: values.yaml
