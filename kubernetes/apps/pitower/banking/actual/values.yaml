controllers:
  actual:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 2000
        runAsUser: 2000
    containers:
      app:
        image:
          repository: ghcr.io/actualbudget/actual-server
          tag: 26.9.0
        env:
          TZ: Europe/Zurich
          ACTUAL_PORT: &httpPort 5006
          ACTUAL_LOGIN_METHOD: openid
          ACTUAL_OPENID_ENFORCE: "true"
          ACTUAL_OPENID_DISCOVERY_URL: https://idm.wibrow.dev/oauth2/openid/actual/.well-known/openid-configuration
          ACTUAL_OPENID_CLIENT_ID: actual
          ACTUAL_OPENID_SERVER_HOSTNAME: https://actual.wibrow.dev
        envFrom:
          - secretRef:
              name: actual-secret
        probes:
          liveness:
            enabled: true
            spec:
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *httpPort
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 5
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        resources:
          requests:
            cpu: 12m
            memory: 65Mi
          limits:
            memory: 512Mi
service:
  app:
    controller: actual
    ports:
      http:
        port: *httpPort
route:
  app:
    hostnames:
      - actual.wibrow.dev
    parentRefs:
      - name: envoy-external
        namespace: networking
        sectionName: https
persistence:
  data:
    existingClaim: actual-data
    advancedMounts:
      actual:
        app:
          - path: /data
