---
# Hostpath class on worker-07's runners volume (Talos user volume `runners`).
# Backed by a zvol on proxmox-01's rpool - 6x 800GB SAS SSD in 3 mirrors,
# sync=standard - since the standalone `runners` zpool was folded into rpool.
# Exists solely for GitHub runner pods' ephemeral volumes; only worker-07 has
# the mount.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-hostpath-runners
  annotations:
    openebs.io/cas-type: local
    cas.openebs.io/config: |
      - name: StorageType
        value: "hostpath"
      - name: BasePath
        value: "/var/mnt/runners/openebs/local"
provisioner: openebs.io/local
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
