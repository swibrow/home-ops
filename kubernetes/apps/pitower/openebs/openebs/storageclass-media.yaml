---
# Hostpath class on worker-07's `media` volume - a 1200GiB zvol on proxmox-01's
# `garage` RAIDZ1 (4x 600GB Toshiba 10K SAS, bays 6-9). Restored 2026-08-16 to
# take the Immich photo library off the failing Synology.
#
# The only class here backed by redundant disks, and the only one holding data
# that is not rebuildable. Reclaim policy is Retain, unlike every other openebs
# class: a pruned PVC must not take the photos with it.
#
# No xfsQuota in the cas config, unlike openebs-hostpath: this volume backs one
# claim, so there is nothing to fence it off from.
#
# Only worker-07 has the mount, so pair any PVC with a nodeSelector on it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-hostpath-media
  annotations:
    openebs.io/cas-type: local
    cas.openebs.io/config: |
      - name: StorageType
        value: "hostpath"
      - name: BasePath
        value: "/var/mnt/media/openebs/local"
provisioner: openebs.io/local
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
