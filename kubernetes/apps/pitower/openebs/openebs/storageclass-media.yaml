---
# Hostpath class on worker-07's media volume (Talos user volume `media`, 4x
# 600GB 10K SAS RAIDZ1 on proxmox-01). The only class here backed by redundant
# disks and the only one holding data that is not rebuildable - the Immich photo
# library. Reclaim policy is Retain, unlike the other openebs classes: a pruned
# PVC must not take the photos with it.
#
# Only worker-07 has the mount, so pair any PVC with a nodeSelector on it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-hostpath-media
  annotations:
    openebs.io/cas-type: local
    cas.openebs.io/config: |
      - name: StorageType
        value: "hostpath"
      - name: BasePath
        value: "/var/mnt/media/openebs/local"
provisioner: openebs.io/local
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
