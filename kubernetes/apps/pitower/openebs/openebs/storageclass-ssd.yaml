---
# Hostpath class on worker-07's scratch volume (Talos user volume `scratch`).
# Backed by a zvol on proxmox-01's rpool - 6x 800GB SAS SSD in 3 mirrors,
# sync=standard - since the standalone `scratch` zpool was folded into rpool.
# Pair with a nodeSelector/affinity on worker-07 since only that node has the
# mount.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-hostpath-ssd
  annotations:
    openebs.io/cas-type: local
    cas.openebs.io/config: |
      - name: StorageType
        value: "hostpath"
      - name: BasePath
        value: "/var/mnt/scratch/openebs/local"
provisioner: openebs.io/local
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
