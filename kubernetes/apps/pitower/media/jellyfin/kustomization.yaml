---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - pvc.yaml
components:
  - ../../../../components/volsync
  - ../../../../components/kopiur
configMapGenerator:
  - name: volsync-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=jellyfin
      - CLAIM_NAME=jellyfin
      - SECRET_NAME=jellyfin-volsync
      - STORAGE_SIZE=10Gi
      - RESTIC_REPO=s3:https://s3.eu-central-2.amazonaws.com/pitower-volsync-backups/media/jellyfin
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=jellyfin-kopiur
      - CLAIM_NAME=jellyfin
patches:
  # jellyfin runs as uid 2000; the kopiur mover must match to read it.
  - target:
      kind: SnapshotPolicy
      name: jellyfin-kopiur
    patch: |
      - op: replace
        path: /spec/mover/securityContext/runAsUser
        value: 2000
      - op: replace
        path: /spec/mover/securityContext/runAsGroup
        value: 2000
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.0.1
    releaseName: jellyfin
    valuesFile: values.yaml
    namespace: media
