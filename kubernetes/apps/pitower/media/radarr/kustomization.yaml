---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
components:
  - ../../../../components/pvc
  - ../../../../components/kopiur
configMapGenerator:
  - name: pvc-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=radarr-pvc
      - CLAIM_NAME=radarr-config
      - STORAGE_SIZE=2Gi
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=radarr-kopiur
      - CLAIM_NAME=radarr-config
patches:
  # radarr runs as uid 2000 (asp/ keys are 0600/0660, gid 2000 covers both); the kopiur mover must match to read it.
  - target:
      kind: SnapshotPolicy
      name: radarr-kopiur
    patch: |
      - op: replace
        path: /spec/mover/securityContext/runAsUser
        value: 2000
      - op: replace
        path: /spec/mover/securityContext/runAsGroup
        value: 2000
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.1.0
    releaseName: radarr
    namespace: media
    valuesFile: values.yaml
