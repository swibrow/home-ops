---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: immich-dragonfly
  namespace: media
spec:
  replicas: 1
  nodeSelector:
    kubernetes.io/arch: amd64
  args:
    - "--proactor_threads=1"
    - "--default_lua_flags=allow-undeclared-keys"
  resources:
    requests:
      cpu: 16m
      memory: 14Mi
    limits:
      memory: 512Mi
