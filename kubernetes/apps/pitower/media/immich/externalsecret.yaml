---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: cnpg-secrets-database
    kind: ClusterSecretStore
  target:
    name: immich-db-secret
    template:
      type: Opaque
      data:
        DB_HOST: '{{ index . "host" }}.database.svc.cluster.local'
        DB_PORT: '{{ index . "port" }}'
        DB_USER: '{{ index . "user" }}'
        DB_PASS: '{{ index . "password" }}'
        DB_NAME: '{{ index . "dbname" }}'
        DB_URL: 'postgresql://{{ index . "user" }}:{{ index . "password" }}@{{ index . "host" }}.database.svc.cluster.local:{{ index . "port" }}/{{ index . "dbname" }}'
  dataFrom:
    - extract:
        key: immich-app
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: immich-config-secret
    template:
      data:
        # Immich has no env vars for OAuth, so the whole system config is
        # rendered here to keep the client secret out of git. IMMICH_CONFIG_FILE
        # makes the admin Settings UI read-only and a parse/validation error is
        # fatal at boot, so every future setting change goes through this file.
        # Keys omitted fall back to Immich's defaults - storageTemplate is the
        # one override that existed in the DB before the switch.
        immich-config.json: |
          {
            "storageTemplate": {
              "enabled": true
            },
            "passwordLogin": {
              "enabled": true
            },
            "oauth": {
              "enabled": true,
              "issuerUrl": "https://idm.wibrow.dev/oauth2/openid/immich",
              "clientId": "immich",
              "clientSecret": "{{ .OAUTH_CLIENT_SECRET }}",
              "scope": "openid email profile",
              "signingAlgorithm": "ES256",
              "buttonText": "Login with Kanidm",
              "autoRegister": true,
              "autoLaunch": false,
              "roleClaim": "immich_role",
              "storageLabelClaim": "preferred_username",
              "mobileOverrideEnabled": true,
              "mobileRedirectUri": "https://photos.wibrow.dev/api/oauth/mobile-redirect"
            }
          }
  data:
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: /media/immich/OAUTH_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
