controllers:
  server:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      nodeSelector:
        kubernetes.io/hostname: worker-07
    containers:
      app:
        image:
          repository: ghcr.io/immich-app/immich-server
          tag: v3.1.0
        env:
          TZ: Europe/Zurich
          IMMICH_PORT: &serverPort 2283
          IMMICH_MEDIA_LOCATION: /data
          IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning.media.svc.cluster.local:3003
          IMMICH_CONFIG_FILE: /config/immich-config.json
          DB_VECTOR_EXTENSION: vectorchord
          REDIS_HOSTNAME: immich-dragonfly.media.svc.cluster.local
          DB_URL:
            valueFrom:
              secretKeyRef:
                name: immich-db-secret
                key: DB_URL
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/server/ping
                port: *serverPort
              initialDelaySeconds: 0
              periodSeconds: 10
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/server/ping
                port: *serverPort
              initialDelaySeconds: 0
              periodSeconds: 10
              failureThreshold: 5
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/server/ping
                port: *serverPort
              failureThreshold: 30
              periodSeconds: 10
        resources:
          requests:
            cpu: 12m
            memory: 512Mi
  machine-learning:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      nodeSelector:
        kubernetes.io/hostname: worker-07
    containers:
      app:
        image:
          repository: ghcr.io/immich-app/immich-machine-learning
          tag: v3.1.0
        env:
          TZ: Europe/Zurich
          MACHINE_LEARNING_CACHE_FOLDER: /cache
          MPLCONFIGDIR: /cache/matplotlib
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 3003
              periodSeconds: 10
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 3003
              periodSeconds: 10
              failureThreshold: 5
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 3003
              failureThreshold: 60
              periodSeconds: 10
        resources:
          requests:
            cpu: 11m
            memory: 496Mi

service:
  server:
    controller: server
    ports:
      http:
        port: *serverPort
  machine-learning:
    controller: machine-learning
    ports:
      http:
        port: 3003

route:
  server:
    hostnames:
      - photos.wibrow.dev
    parentRefs:
      - name: envoy-external
        namespace: networking
        sectionName: https
    rules:
      - backendRefs:
          - identifier: server
            port: *serverPort

persistence:
  config:
    type: secret
    name: immich-config-secret
    advancedMounts:
      server:
        app:
          - path: /config/immich-config.json
            subPath: immich-config.json
            readOnly: true
  library:
    # On the NAS since 2026-08-12. Previously PVC immich-library-media on the
    # `media` RAIDZ1 pool, now dissolved: those four 600GB spinners made way
    # for the SAS SSDs. The export maps root through (no_root_squash), which
    # this needs - immich runs as uid 0 and owns its whole /data tree.
    #
    # Do NOT switch this back to -aHAX if it ever moves again: -X fails on
    # every file against NFS with lsetxattr security.selinux, and rsync then
    # exits 23. -aH --numeric-ids is correct here.
    type: nfs
    server: data
    path: /volume1/media/immich
    advancedMounts:
      server:
        app:
          - path: /data
  model-cache:
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: openebs-hostpath
    advancedMounts:
      machine-learning:
        app:
          - path: /cache
