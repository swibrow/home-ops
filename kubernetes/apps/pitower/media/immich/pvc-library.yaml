---
# The photo library, on the `media` RAIDZ1 pool via openebs-hostpath-media.
#
# Declared here rather than through the chart's persistence.library block
# because storageClassName is immutable: moving the existing immich-library PVC
# off openebs-hostpath would mean destroying it. A second claim lets the old one
# stay Bound and untouched during the migration, so rollback is a one-line
# revert of persistence.library back to its storageClass form.
#
# The class is reclaimPolicy: Retain, so deleting this claim leaves the photos
# on disk rather than reclaiming them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath-media
  resources:
    requests:
      storage: 1000Gi
