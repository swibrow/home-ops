---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - externalsecret.yaml
components:
  - ../../../../components/volsync
  - ../../../../components/kopiur
configMapGenerator:
  - name: volsync-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=prowlarr
      - CLAIM_NAME=prowlarr-config
      - SECRET_NAME=prowlarr-volsync
      - STORAGE_SIZE=1Gi
      - RESTIC_REPO=s3:https://s3.eu-central-2.amazonaws.com/pitower-volsync-backups/media/prowlarr
  - name: kopiur-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=prowlarr-kopiur
      - CLAIM_NAME=prowlarr-config
patches:
  # prowlarr runs as uid 2000 (asp/ keys are 0600); the kopiur mover must match to read it.
  - target:
      kind: SnapshotPolicy
      name: prowlarr-kopiur
    patch: |
      - op: replace
        path: /spec/mover/securityContext/runAsUser
        value: 2000
      - op: replace
        path: /spec/mover/securityContext/runAsGroup
        value: 2000
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.0.1
    releaseName: prowlarr
    namespace: media
    valuesFile: values.yaml
