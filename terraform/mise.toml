[env]
UNIFI_API_KEY = { age = "" }
UNIFI_API = "https://10.20.0.1"
UNIFI_INSECURE = "true"

[tasks."unifi:bgp-upload"]
description = "Push terraform/unifi/frr-bgp.conf to the UCG Fiber's 'pitower' BGP config (the provider has no BGP resource)"
dir = "{{config_root}}/unifi"
run = '''
#!/usr/bin/env bash
set -euo pipefail
api="$UNIFI_API/proxy/network/v2/api/site/default/bgp/config"
auth=(-H "X-API-KEY: $UNIFI_API_KEY")
current=$(curl -skf "${auth[@]}" "$api/all" | jq -e '.[] | select(.description == "pitower")')
jq --rawfile conf frr-bgp.conf '.frr_bgpd_config = $conf | .uploaded_file_name = "frr-bgp.conf"' <<<"$current" \
  | curl -skf "${auth[@]}" -H "Content-Type: application/json" -X POST --data-binary @- "$api" >/dev/null
curl -skf "${auth[@]}" "$api/all" | jq -e '.[] | select(.description == "pitower") | {enabled, error, uploaded_file_name}'
'''
