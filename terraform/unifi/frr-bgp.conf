! Push with `mise run unifi:bgp-upload` from terraform/. The provider
! has no BGP resource, so this file is the source of truth, applied by hand.
!
! Peers are the pitower nodes (Cilium BGP, ASN 64513), matching the
! CiliumBGPClusterConfig in kubernetes/apps/pitower/kube-system/cilium/config.
! Only /32s from the LoadBalancer pool and /24 node pod CIDRs are accepted,
! and nothing is sent back. IPv6 is the same over separate sessions: nodes
! dial in from their VLAN 20 SLAAC addresses (accepted by listen range, so
! they need no list here) and may send /128s from the LoadBalancer slice and
! /64 pod CIDRs.
router bgp 64512
 bgp router-id 10.20.0.1
 neighbor cilium peer-group
 neighbor cilium remote-as 64513
 neighbor cilium timers 3 9
 neighbor 10.20.10.1 peer-group cilium
 neighbor 10.20.10.2 peer-group cilium
 neighbor 10.20.10.3 peer-group cilium
 neighbor 10.20.10.4 peer-group cilium
 neighbor 10.20.10.5 peer-group cilium
 neighbor 10.20.10.6 peer-group cilium
 neighbor 10.20.10.7 peer-group cilium
 neighbor 10.20.10.8 peer-group cilium
 neighbor 10.20.10.9 peer-group cilium
 neighbor 10.20.10.10 peer-group cilium
 neighbor cilium6 peer-group
 neighbor cilium6 remote-as 64513
 neighbor cilium6 timers 3 9
 bgp listen range 2a02:16a:2a0a:2::/64 peer-group cilium6
 !
 address-family ipv4 unicast
  neighbor cilium route-map cilium-in in
  neighbor cilium route-map deny-all out
  maximum-paths 8
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor cilium6 activate
  neighbor cilium6 route-map cilium6-in in
  neighbor cilium6 route-map deny-all out
  maximum-paths 8
 exit-address-family
exit
!
ip prefix-list cilium-lb seq 10 permit 10.20.10.128/25 ge 32
ip prefix-list cilium-pods seq 10 permit 10.244.0.0/16 ge 24 le 24
ipv6 prefix-list cilium6-lb seq 10 permit 2a02:16a:2a0a:3::/112 ge 128
ipv6 prefix-list cilium6-pods seq 10 permit fd10:244::/56 ge 64 le 64
!
route-map cilium-in permit 10
 match ip address prefix-list cilium-lb
exit
!
route-map cilium-in permit 20
 match ip address prefix-list cilium-pods
exit
!
route-map cilium6-in permit 10
 match ipv6 address prefix-list cilium6-lb
exit
!
route-map cilium6-in permit 20
 match ipv6 address prefix-list cilium6-pods
exit
!
route-map deny-all deny 10
exit
