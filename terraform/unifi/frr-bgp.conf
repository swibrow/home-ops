! Push with `mise run unifi:bgp-upload` from terraform/. The provider
! has no BGP resource, so this file is the source of truth, applied by hand.
!
! Peers are the pitower nodes (Cilium BGP, ASN 64513), matching the
! CiliumBGPClusterConfig in kubernetes/apps/pitower/kube-system/cilium/config.
! Only /32s from the LoadBalancer pool are accepted, and nothing is sent back.
router bgp 64512
 bgp router-id 10.20.0.1
 neighbor cilium peer-group
 neighbor cilium remote-as 64513
 neighbor cilium timers 3 9
 neighbor 10.20.10.1 peer-group cilium
 neighbor 10.20.10.2 peer-group cilium
 neighbor 10.20.10.3 peer-group cilium
 neighbor 10.20.10.4 peer-group cilium
 neighbor 10.20.10.5 peer-group cilium
 neighbor 10.20.10.6 peer-group cilium
 neighbor 10.20.10.7 peer-group cilium
 neighbor 10.20.10.8 peer-group cilium
 neighbor 10.20.10.9 peer-group cilium
 neighbor 10.20.10.10 peer-group cilium
 !
 address-family ipv4 unicast
  neighbor cilium route-map cilium-in in
  neighbor cilium route-map deny-all out
  maximum-paths 8
 exit-address-family
exit
!
ip prefix-list cilium-lb seq 10 permit 10.20.10.128/25 ge 32
!
route-map cilium-in permit 10
 match ip address prefix-list cilium-lb
exit
!
route-map deny-all deny 10
exit
