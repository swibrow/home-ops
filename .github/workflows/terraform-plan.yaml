name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      # Only the stacks in this workflow's matrix; terraform/unifi has its own
      # workflow on the self-hosted runner for VLAN 20 access.
      - "terraform/alexa/**"
      - "terraform/garrison-alexa/**"
      - "terraform/bootstrap/**"
      - "terraform/general/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack:
          - alexa
          - garrison-alexa
          - bootstrap
          - general
      fail-fast: false
    name: Plan (${{ matrix.stack }})
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-2

      - uses: dflook/terraform-plan@738d3a75f0d801d280dca5eb7357b89c8383267f # v3.1.2
        with:
          path: terraform/${{ matrix.stack }}
          label: ${{ matrix.stack }}
