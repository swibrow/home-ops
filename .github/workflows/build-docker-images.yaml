name: Build Docker Images

on:
  push:
    branches: [main]
    paths:
      - docker/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  discover:
    runs-on: home-ops
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
      builds: ${{ steps.set-matrix.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: changed
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          dir_names: "true"
          dir_names_max_depth: "2"
          files: docker/**
          json: "true"
          escape_json: "false"

      # One build per image and arch, each on a native runner. An image limits
      # its arches with a `platforms` file (one per line); default is both.
      - id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            images=$(basename -a docker/*/)
          else
            images=$(echo '${{ steps.changed.outputs.all_changed_files }}' | jq -r '.[] | ltrimstr("docker/")')
          fi
          builds=$(for image in $images; do
            [[ -f "docker/$image/Dockerfile" ]] || continue
            for platform in $(cat "docker/$image/platforms" 2>/dev/null || echo linux/amd64 linux/arm64); do
              jq -nc --arg image "$image" --arg platform "$platform" \
                '{image: $image, platform: $platform, arch: ($platform | split("/")[1])}'
            done
          done | jq -sc .)
          echo "builds=${builds}" >> "$GITHUB_OUTPUT"
          echo "images=$(jq -c '[.[].image] | unique' <<< "$builds")" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.builds != '[]'
    runs-on: ${{ matrix.arch == 'arm64' && 'home-ops-arm64' || 'home-ops' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/swibrow/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Runs per image even when another image's build failed; an image missing any
  # of its arches is not tagged.
  merge:
    needs: [discover, build]
    if: ${{ !cancelled() && needs.discover.outputs.images != '[]' }}
    runs-on: home-ops
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - env:
          IMAGE: ${{ env.REGISTRY }}/swibrow/${{ matrix.image }}
        run: |
          version=$(grep -oP 'ARG \w+_VERSION=\K.+' docker/${{ matrix.image }}/Dockerfile | head -1)
          shopt -s nullglob
          sources=()
          for digest in "${RUNNER_TEMP}"/digests/*; do
            sources+=("${IMAGE}@sha256:$(basename "$digest")")
          done
          expected=$(cat docker/${{ matrix.image }}/platforms 2>/dev/null || echo linux/amd64 linux/arm64)
          if (( ${#sources[@]} != $(wc -w <<< "$expected") )); then
            echo "::error::${{ matrix.image }}: ${#sources[@]} of $(wc -w <<< "$expected") arches built"
            exit 1
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:${version:-${{ github.sha }}}" \
            -t "${IMAGE}:latest" \
            "${sources[@]}"
