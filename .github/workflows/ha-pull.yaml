name: HA Pull

# Home Assistant config is editable in the UI as well as from git (scripts/ha.py). This snapshots
# HA into iot/homeassistant/ so UI edits reach git. main requires the "checks" status, so changes
# land through a rolling ha-sync PR with auto-merge. The branch and PR are made with the Renovate
# GitHub App's token: a GITHUB_TOKEN PR needs approval before its checks run, so it never merges.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: home-ops
    env:
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liivKjIffkIYhVlr
          private-key: ${{ secrets.HA_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Pull from Home Assistant
        env:
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          HA_URL: https://ha.wibrow.dev
        run: ./scripts/ha.py pull

      - name: Open or update the ha-sync PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git add -A iot/homeassistant
          if git diff --cached --quiet; then
            echo "HA matches main"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C ha-sync
          git commit -s -m "chore(homeassistant): sync UI changes"
          if git fetch -q origin ha-sync && git diff --quiet origin/ha-sync HEAD; then
            echo "ha-sync already has these changes"
            exit 0
          fi
          git push -f origin ha-sync
          if [ "$(gh pr view ha-sync --json state -q .state 2>/dev/null || true)" != "OPEN" ]; then
            gh pr create --head ha-sync --base main --title "chore(homeassistant): sync UI changes" \
              --body "Snapshot of Home Assistant config edited in the UI, from \`scripts/ha.py pull\`."
          fi
          gh pr merge ha-sync --auto --squash
